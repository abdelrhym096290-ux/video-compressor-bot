name = "fox1-ai"
main = "worker.js"
compatibility_date = "2026-09-03"
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "fox-ai-db"
database_id = "af119c1d-6f40-41d3-aab0-590cdce0462e"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "EXPERIMENT_STATE"
class_name = "ExperimentState"

# إصلاح: [exports.ExperimentState] لم تكن صيغة Wrangler الحقيقية لتفعيل
# SQLite storage — الصيغة الصحيحة الوحيدة هي عبر [[migrations]] بالأسفل.
# مهم: إن كان هذا الـ DO منشوراً بالفعل بدون هذه الكتلة، فقد يكون يعمل
# فعلاً بتخزين key-value القديم لا SQLite — التبديل من new_classes إلى
# new_sqlite_classes بعد النشر غير مسموح، فتحقق أولاً عبر:
#   wrangler deploy --dry-run
# قبل أي نشر فعلي بهذا التعديل.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExperimentState"]