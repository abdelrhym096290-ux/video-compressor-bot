name = "fox1-ai"
main = "Worker.js"
compatibility_date = "2026-09-03"
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "fox-ai-db"
database_id = "af119c1d-6f40-41d3-aab0-590cdce0462e"

[ai]
binding = "AI"

[assets]
directory = "."
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 1

# R2 is intentionally disabled for now; the Worker falls back to D1 metadata/text storage.
