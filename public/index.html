<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FOX AI</title>
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1c1c26;--surface3:#2c2c30;--line:#282836;--line2:#383848;--ink:#f0f0f8;--muted:#9090a4;--faint:#606074;--radius:16px;--radius-sm:12px;--shadow:0 8px 30px rgba(0,0,0,.5);--font:'Segoe UI','Tahoma','Arial',system-ui,sans-serif;--accent:#e06442;--accent2:#f28561;--accent3:#b6452e;--accent-bg:rgba(224,100,66,.1);--green:#27ae60;--red:#e74c3c}
[data-theme="light"]{--bg:#f2f2f7;--surface:#fff;--surface2:#f0f0f5;--surface3:#e5e5ea;--line:#e0e0e8;--line2:#d0d0d8;--ink:#1a1a2a;--muted:#606074;--faint:#9090a4}
[data-accent="orange"]{--accent:#e06442;--accent2:#f28561;--accent3:#b6452e}
[data-accent="blue"]{--accent:#3498db;--accent2:#5dade2;--accent3:#217dbb}
[data-accent="green"]{--accent:#27ae60;--accent2:#2ecc71;--accent3:#1e8449}
[data-accent="red"]{--accent:#e74c3c;--accent2:#ec7063;--accent3:#b03a2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.7 var(--font)}
button,input,textarea{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}textarea{resize:none}
::-webkit-scrollbar{display:none}
.app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;border-inline:1px solid var(--line);background:var(--bg)}
svg{display:inline-block;vertical-align:middle;fill:currentColor;width:20px;height:20px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;color:var(--ink)}
.icon-btn:active{background:var(--surface2)}
.icon-btn svg{width:20px;height:20px}
.top-nav{display:flex;align-items:center;gap:6px;padding:8px 12px;min-height:56px;flex-shrink:0;position:relative;z-index:40;border-bottom:1px solid var(--line)}
.tn-side{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tn-center{flex:1;display:flex;align-items:center;justify-content:center}
.nav-title{font-weight:800;font-size:16px}
.model-pill{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:4px 8px;border-radius:10px;background:var(--surface2)}
.model-pill svg{width:12px;height:12px;fill:var(--muted)}
.toggle-wrap{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:20px;padding:3px}
.toggle-wrap button{height:28px;border-radius:15px;padding:0 14px;font-size:12px;font-weight:700;color:var(--muted)}
.toggle-wrap button.active{background:var(--accent);color:#fff}
.content{flex:1;overflow-y:auto;padding:14px 16px;scroll-behavior:smooth}
.shortcuts-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin:2px 0 20px}
.shortcut-card{flex:0 0 auto;width:80px;height:85px;background:var(--surface);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:.15s;border:1px solid var(--line)}
.shortcut-card:active{background:var(--surface2);transform:scale(.96)}
.shortcut-card svg{width:22px;height:22px;fill:var(--accent)}
.shortcut-card span{font-size:11px;font-weight:600}
.recent-title{font-size:12px;font-weight:600;color:var(--faint);margin:4px 0 10px;text-align:right}
.chat-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);position:relative}
.chat-row:last-child{border-bottom:0}
.chat-row-main{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;overflow:hidden}
.chat-row-main svg{width:18px;height:18px;fill:var(--accent);flex-shrink:0}
.chat-row-main span{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-row-options{position:relative;flex-shrink:0}
.more-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.more-btn:active{background:var(--surface2)}
.more-btn svg{width:18px;height:18px;fill:var(--muted)}
.message{margin-bottom:14px;display:flex;flex-direction:column;position:relative}
.message.user{align-items:flex-start}
.message.agent{align-items:flex-end}
.message-content{display:flex;align-items:flex-start;gap:6px;max-width:85%}
.message.user .message-content{flex-direction:row}
.message.agent .message-content{flex-direction:row-reverse}
.bubble{padding:12px 16px;border-radius:18px;font-size:13.5px;line-height:1.6;word-break:break-word;flex:1;user-select:text;-webkit-user-select:text}
.message.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.message.agent .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg-options-btn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:8px}
.msg-options-btn svg{width:14px;height:14px;fill:var(--muted)}
.tool-approval{display:flex;gap:6px;margin-top:8px}
.tool-approval button{flex:1;padding:8px;border-radius:8px;font-size:11px;font-weight:600}
.tool-approval .approve{background:var(--green);color:#fff}
.tool-approval .reject{background:var(--red);color:#fff}
.composer-wrap{display:none;padding:8px 10px 12px;flex-shrink:0;border-top:1px solid var(--line)}
.composer-wrap.visible{display:block}
.composer-card{background:var(--surface);border-radius:24px;padding:8px 6px 6px;border:1px solid var(--line)}
.composer-input{width:100%;padding:6px 12px;font-size:14px;min-height:24px;max-height:100px;text-align:right;direction:rtl}
.composer-toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.composer-cluster{display:flex;align-items:center;gap:2px}
.composer-toolbar button{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.composer-toolbar button:active{background:var(--surface2)}
.composer-toolbar svg{width:20px;height:20px;fill:var(--muted)}
.btn-send-active{background:var(--accent)!important}
.btn-send-active svg{fill:#fff!important}
.agent-panel{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:16px;margin-bottom:10px}
.agent-panel h3{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--accent)}
.step-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--surface2);margin-bottom:6px;font-size:12px}
.step-item .step-status{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.step-status.completed{background:rgba(39,174,96,.2);color:var(--green)}
.step-status.running{background:var(--accent-bg);color:var(--accent)}
.step-status.pending{background:var(--surface3);color:var(--muted)}
.step-item .step-info{flex:1;min-width:0}
.step-item .step-info b{display:block;font-size:12px}
.step-item .step-info small{color:var(--muted);font-size:11px}
.step-actions{display:flex;gap:4px;flex-shrink:0}
.step-actions button{width:24px;height:24px;border-radius:6px;background:var(--surface3);font-size:10px;display:flex;align-items:center;justify-content:center}
.task-controls{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.task-controls button{flex:1;padding:8px;border-radius:8px;background:var(--surface2);font-size:11px;font-weight:600}
.task-controls button.primary{background:var(--accent);color:#fff}
.task-controls button.danger{background:rgba(231,76,60,.2);color:var(--red)}
.workspace-section{margin-bottom:10px}
.workspace-files{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:12px}
.workspace-files h4{font-size:12px;font-weight:700;margin-bottom:8px;color:var(--accent)}
.file-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:11px;cursor:pointer}
.file-item:last-child{border-bottom:0}
.file-item svg{width:14px;height:14px;fill:var(--muted);flex-shrink:0}
.file-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item small{color:var(--faint);flex-shrink:0}
.experiment-log{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:12px}
.experiment-log h4{font-size:12px;font-weight:700;margin-bottom:8px;color:var(--accent)}
.exp-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:11px}
.exp-item:last-child{border-bottom:0}
.exp-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.exp-status.completed{background:var(--green)}
.exp-status.running{background:var(--accent)}
.exp-status.failed{background:var(--red)}
.exp-status.cancelled{background:var(--muted)}
.agent-profile{text-align:center;padding:20px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);margin-bottom:16px}
.agent-avatar{width:80px;height:80px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.agent-avatar svg{width:40px;height:40px;fill:var(--accent)}
.agent-profile h2{font-size:18px;font-weight:800;margin-bottom:4px}
.agent-profile p{font-size:12px;color:var(--muted)}
.teach-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:var(--accent);color:#fff;border-radius:var(--radius);font-size:14px;font-weight:700;margin-bottom:16px}
.teach-btn svg{width:20px;height:20px;fill:#fff}
.agent-memory{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:16px}
.agent-memory h3{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--accent)}
.memory-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--surface2);margin-bottom:6px;font-size:12px;position:relative}
.memory-item svg{width:14px;height:14px;fill:var(--accent);flex-shrink:0}
.memory-item .memory-options{margin-right:auto;position:relative}
.plan-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:10px;border:1px solid var(--line)}
.plan-top{display:flex;align-items:center;justify-content:space-between}
.plan-plan{font-size:18px;font-weight:800;color:var(--accent)}
.upgrade-btn{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:6px 14px;border-radius:10px}
.settings-group{background:var(--surface);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;padding:0 16px;border:1px solid var(--line)}
.settings-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.settings-row:last-child{border-bottom:0}
.s-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.s-icon svg{width:18px;height:18px;fill:var(--accent)}
.s-label{flex:1;text-align:right;font-size:13px;font-weight:500}
.s-value{font-size:11px;color:var(--faint)}
.s-chevron{width:16px;height:16px;fill:var(--faint);flex-shrink:0;transform:scaleX(-1)}
.fab{position:absolute;bottom:20px;left:16px;width:56px;height:56px;border-radius:50%;background:var(--accent);box-shadow:0 4px 18px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;transition:.2s}
.fab:active{transform:scale(.9)}
.fab svg{width:28px;height:28px;fill:#fff}
.fab.hidden{display:none}
.dd-backdrop{position:fixed;inset:0;z-index:999;display:none;background:rgba(0,0,0,.3)}
.dd-backdrop.open{display:block}
.dropdown-panel{position:fixed;background:var(--surface2);border-radius:16px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:1000;min-width:200px;max-width:220px;display:none;border:1px solid var(--line);overflow-y:auto;max-height:60vh}
.dropdown-panel.open{display:block;animation:ddIn .2s ease}
@keyframes ddIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.dd-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.dd-item:active{background:var(--surface3)}
.dd-item svg{width:16px;height:16px;fill:var(--accent);flex-shrink:0}
.dd-item.danger{color:#e74c3c}
.dd-item.danger svg{fill:#e74c3c}
.dd-divider{height:1px;background:var(--line2);margin:4px 6px}
.color-dots{display:flex;gap:12px;justify-content:center;margin:15px 0}
.color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.color-dot.active{border-color:var(--ink)}
.color-dot.orange{background:#e06442}.color-dot.blue{background:#3498db}
.color-dot.green{background:#27ae60}.color-dot.red{background:#e74c3c}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--surface3);color:var(--ink);padding:10px 20px;border-radius:16px;font-size:12px;font-weight:600;z-index:3000;box-shadow:var(--shadow);max-width:80%;text-align:center}
.from-footer{text-align:center;color:var(--faint);font-size:12px;margin-top:20px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.task-filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.longpress-menu{position:fixed;z-index:3000;background:var(--surface2);border-radius:12px;padding:6px;box-shadow:var(--shadow);display:none;border:1px solid var(--line)}
.longpress-menu.open{display:block;animation:ddIn .15s ease}
.longpress-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;background:none;border:0;color:var(--ink)}
.longpress-menu button:active{background:var(--surface3)}
.longpress-menu button svg{width:14px;height:14px;fill:var(--accent)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top-nav" id="topNav"></div>
  <div class="content" id="contentArea"></div>
  <div class="fab hidden" id="fab"></div>
  <div class="composer-wrap" id="composerWrap">
    <div class="composer-card">
      <textarea class="composer-input" id="input" placeholder="إرسال رسالة إلى FOX AI" rows="1"></textarea>
      <div class="composer-toolbar">
        <div class="composer-cluster">
          <button id="micBtn" title="ميكروفون"></button>
          <button id="attachBtn" title="مرفقات"></button>
          <button id="planBtn" title="إنشاء خطة"></button>
        </div>
        <div class="composer-cluster">
          <button id="sendBtn" title="إرسال"></button>
        </div>
      </div>
    </div>
  </div>
</div>
<input type="file" id="fileInput" hidden multiple />
<div class="dd-backdrop" id="ddBackdrop"></div>
<div class="dropdown-panel" id="dropdownPanel"></div>
<div class="longpress-menu" id="longpressMenu"></div>

<script>
'use strict';
const API_URL='https://fox1-ai.abdelrhym096290.workers.dev';
let pendingAttachments=[],activeTaskId=null,activePlan=null,pendingTool=null,taskFilter='all',longpressTimer=null;
function readDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function api(payload){let token=localStorage.getItem('foxToken')||'';let r=await fetch(API_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...payload,sessionToken:token})});if(r.status===401){const pw=prompt('أدخل كلمة مرور FOX AI');if(!pw)throw Error('يلزم تسجيل الدخول');const lr=await fetch(API_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',accessPassword:pw})});const ld=await lr.json();if(!lr.ok||!ld.token)throw Error(ld.error||'فشل تسجيل الدخول');localStorage.setItem('foxToken',ld.token);r=await fetch(API_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...payload,sessionToken:ld.token})})}return r}
const FALLBACK_MODELS=[{id:'cerebras-gemma-4-31b',name:'Gemma 4 31B',company:'Cerebras',description:'استدلال سريع'},{id:'gemini-5-flash',name:'Flash 5',company:'Google',description:'محادثة عامة'},{id:'cf-qwen3-coder',name:'Qwen 3.8 Coder',company:'Cloudflare',description:'برمجة'}];
let availableModels=[];
async function loadModels(){try{const r=await fetch(API_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'models'})});const d=await r.json();if(d.models?.length){availableModels=d.models.map(x=>({...x,description:x.description||'نموذج متاح'}))}}catch{}if(!availableModels.length)availableModels=FALLBACK_MODELS}

async function createPlan(){const taskText=input.value.trim();if(!taskText){toast('اكتب هدف المهمة أولاً');return}toast('جاري إنشاء الخطة...');try{const r=await api({action:'plan_task',chatId:S.currentChatId||Date.now().toString(),model:localStorage.getItem('foxSelectedModelId')||'cerebras-gemma-4-31b',task:taskText});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر إنشاء الخطة');activeTaskId=d.task?.id||null;activePlan=d.plan||null;if(activeTaskId)localStorage.setItem('foxTaskId',activeTaskId);if(S.currentChatId){S.messages.push({role:'user',content:taskText});S.messages.push({role:'agent',content:`📋 تم إنشاء الخطة:\n${d.plan.goal}\n\n${d.plan.steps.map((s,i)=>`${i+1}. ${s.title} - ${s.description}`).join('\n')}`})}input.value='';updateSendBtn();render();toast('تم إنشاء الخطة بنجاح');if(activeTaskId){await advanceAgent()}}catch(e){toast(e.message)}}
async function advanceAgent(){if(!activeTaskId){toast('لا توجد مهمة نشطة');return}showActivityIndicator(true);toast('جاري تنفيذ الخطوة...');try{const r=await api({action:'advance_task',taskId:activeTaskId,model:localStorage.getItem('foxSelectedModelId')||'cerebras-gemma-4-31b',maxSteps:3});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تشغيل الوكيل');activePlan=d.plan||activePlan;if(d.proposal){pendingTool=d.proposal;S.messages.push({role:'agent',content:`🔧 اقتراح طرفية:\n${d.proposal.command}`})}if(d.status==='completed'){toast('اكتملت المهمة بنجاح');if(S.currentChatId){const c=S.chatHistory.find(c=>String(c.id)===String(S.currentChatId));if(c){c.completed=true;localStorage.setItem('foxHistory',JSON.stringify(S.chatHistory))}}}else if(d.status==='waiting_for_tool_approval'){toast('بانتظار موافقة الطرفية')}else if(d.status==='waiting_for_user'){toast('بانتظار توجيهك')}else if(d.status==='failed'){toast('فشلت المهمة')}else{toast('تم تنفيذ الخطوة');if(S.currentChatId){const c=S.chatHistory.find(c=>String(c.id)===String(S.currentChatId));if(c){c.hasActiveTask=true;localStorage.setItem('foxHistory',JSON.stringify(S.chatHistory))}}}render()}catch(e){toast(e.message)}finally{showActivityIndicator(false)}}
async function taskControl(action){if(!activeTaskId){toast('لا توجد مهمة نشطة');return}try{const r=await api({action,taskId:activeTaskId});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تغيير حالة المهمة');toast(d.status==='paused'?'تم إيقاف المهمة':d.status==='cancelled'?'تم إلغاء المهمة':'تم استئناف المهمة')}catch(e){toast(e.message)}}
async function stepControl(stepId,action){if(!activeTaskId){toast('لا توجد مهمة نشطة');return}try{const r=await api({action:'step_control',taskId:activeTaskId,stepId,...(action==='complete_step'?{output:'تمت الخطوة من الواجهة'}:{})});const d=await r.json();if(r.ok){activePlan=d.plan;toast('تم تحديث الخطوة');render()}else{toast(d.error||'تعذر التحديث')}}catch(e){toast(e.message)}}
async function loadTaskEvents(){if(!activeTaskId){toast('لا توجد مهمة نشطة');return}try{const r=await api({action:'task_events',taskId:activeTaskId});const d=await r.json();if(r.ok){S.taskEvents=d.events||[];S.screen='task-events';render()}}catch(e){toast(e.message)}}
function renderTaskEvents(){const events=S.taskEvents||[];contentArea.innerHTML=`<div class="recent-title">أحداث المهمة (${events.length})</div>${events.length?events.slice(-50).reverse().map(e=>{const names={step_started:'بدأت خطوة',model_called:'استدعاء النموذج',tool_requested:'طلب موافقة الطرفية',verification_passed:'نجاح التحقق',verification_failed:'فشل التحقق',user_intervention:'تعقيب المستخدم',task_completed:'اكتملت المهمة',approval_requested:'بانتظار موافقة'};let payloadHTML='';if(e.payload){try{const payload=typeof e.payload==='string'?JSON.parse(e.payload):e.payload;payloadHTML=`<pre style="background:var(--surface3);padding:8px;border-radius:6px;font-size:10px;overflow-x:auto;margin-top:6px;">${esc(JSON.stringify(payload,null,2))}</pre>`}catch{payloadHTML=`<pre style="background:var(--surface3);padding:8px;border-radius:6px;font-size:10px;overflow-x:auto;margin-top:6px;">${esc(String(e.payload))}</pre>`}}return`<details style="background:var(--surface);border-radius:8px;padding:10px;margin-bottom:6px;border:1px solid var(--line);"><summary style="cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px;"><div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:${e.type==='task_completed'?'var(--green)':e.type==='verification_failed'?'var(--red)':'var(--accent)'};"></div><span style="flex:1;">${esc(names[e.type]||e.type)}</span><small style="color:var(--faint);font-size:10px;">${new Date(e.created_at).toLocaleTimeString('ar')}</small></summary><div style="margin-top:8px;font-size:11px;color:var(--muted);"><div>الوقت الكامل: ${new Date(e.created_at).toLocaleString('ar')}</div>${payloadHTML}</div></details>`}).join(''):'<p style="text-align:center;color:var(--faint);margin-top:30px;">لا توجد أحداث</p>'}`}
async function interveneInTask(){if(!activeTaskId){toast('لا توجد مهمة نشطة');return}const content=prompt('أدخل توجيهك للمهمة:');if(!content||!content.trim())return;try{const r=await api({action:'task_intervention',taskId:activeTaskId,content:content.trim(),advance:true});const d=await r.json();if(r.ok){toast('تم إرسال التوجيه');activePlan=d.plan||activePlan;render()}else{toast(d.error||'تعذر الإرسال')}}catch(e){toast(e.message)}}
async function approveTool(approved){if(!pendingTool){toast('لا يوجد اقتراح طرفية معلق');return}try{const r=await api({action:'run_tool',chatId:S.currentChatId||'default',taskId:activeTaskId||null,proposal:pendingTool,approved:approved,approvalBudget:approved?5:0});const d=await r.json();if(r.ok){toast('تم تشغيل التجربة');pendingTool=null;if(d.experiment){S.messages.push({role:'agent',content:`⚡ تم تشغيل التجربة:\n${d.experiment.command}\n\nالحالة: ${d.experiment.status}`})}}else if(d.needsApproval){toast(d.reason||'يلزم موافقة إضافية')}else{toast(d.error||'تعذر التشغيل')}render()}catch(e){toast(e.message)}}
async function loadWorkspace(){if(!S.currentChatId){toast('ابدأ محادثة أولاً');return}try{const r=await api({action:'workspace_status',chatId:S.currentChatId});const d=await r.json();if(r.ok&&d.workspace){S.workspaceData=d.workspace;S.screen='workspace';render()}}catch(e){toast(e.message)}}
function renderWorkspace(){if(!S.workspaceData){contentArea.innerHTML='<div class="empty-state" style="text-align:center;padding:60px 24px;"><div style="width:48px;height:48px;margin:0 auto 16px;opacity:.6;">'+SVG.workspace+'</div><h2>لا توجد بيانات</h2><p>ابدأ محادثة أولاً</p></div>';return}const w=S.workspaceData;contentArea.innerHTML=`<div class="workspace-section"><div class="workspace-files"><h4>الملفات (${w.files?.length||0})</h4>${w.files?.length?w.files.map(f=>`<div class="file-item" style="cursor:pointer;" onclick="previewFile('${f.id}','${esc(f.name)}')">${SVG.file}<span>${esc(f.name)}</span><small>${Math.ceil(Number(f.size||0)/1024)}KB · ${esc(f.storage||'D1')}</small><button onclick="event.stopPropagation();downloadFile('${f.id}','${esc(f.name)}')" style="width:24px;height:24px;border-radius:6px;background:var(--surface3);font-size:10px;flex-shrink:0;">⬇</button></div>`).join(''):'<p style="color:var(--faint);text-align:center;padding:10px;">لا توجد ملفات</p>'}</div></div><div class="workspace-section"><div class="experiment-log"><h4>التجارب (${w.experiments?.length||0})</h4>${w.experiments?.length?w.experiments.map(e=>`<div class="exp-item"><div class="exp-status ${e.status}"></div><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(e.command)}</span><small>${esc(e.status)}</small></div>`).join(''):'<p style="color:var(--faint);text-align:center;padding:10px;">لا توجد تجارب</p>'}</div></div><div class="workspace-section"><div class="workspace-files"><h4>حصة الطرفية</h4><p style="font-size:12px;">المستخدم: ${w.budget?.used||0} / الممنوح: ${w.budget?.granted||0}</p><p style="font-size:12px;">المتبقي: ${w.budget?.remaining||0}</p></div></div>`}
async function previewFile(fileId,fileName){try{const r=await api({action:'get_messages',chatId:S.currentChatId||'default'});const d=await r.json();const file=(d.files||[]).find(f=>f.id===fileId);if(!file){toast('الملف غير موجود');return}S.previewFile=file;S.screen='file-preview';render()}catch(e){toast('تعذر فتح الملف')}}
function renderFilePreview(){const f=S.previewFile;if(!f)return;contentArea.innerHTML=`<div class="agent-panel"><h3>${esc(f.name)}</h3><div style="font-size:11px;color:var(--muted);margin-bottom:12px;"><div>النوع: ${esc(f.mime||'غير معروف')}</div><div>الحجم: ${Math.ceil(Number(f.size||0)/1024)}KB</div><div>التخزين: ${esc(f.storage||'D1')}</div><div>تاريخ الإنشاء: ${new Date(f.created_at).toLocaleString('ar')}</div></div><div style="display:flex;gap:8px;"><button onclick="downloadFile('${f.id}','${esc(f.name)}')" style="flex:1;padding:10px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;">${SVG.file} تنزيل</button><button onclick="goBack()" style="flex:1;padding:10px;border-radius:8px;background:var(--surface2);font-weight:600;">رجوع</button></div></div>`}
async function downloadFile(fileId,fileName){try{const r=await api({action:'get_messages',chatId:S.currentChatId||'default'});const d=await r.json();const file=(d.files||[]).find(f=>f.id===fileId);if(file&&file.data_url){const a=document.createElement('a');a.href=file.data_url;a.download=fileName;a.click();toast('تم التنزيل');return}if(file&&file.asset_id){const dl=await api({action:'download_file',assetId:file.asset_id});if(dl.ok){const blob=await dl.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fileName;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('تم التنزيل')}else{toast('تعذر التنزيل من GitHub')}}else{toast('لا توجد نسخة قابلة للتنزيل')}}catch(e){toast('تعذر التنزيل: '+e.message)}}

function renderAgentHome(){const knowledgeCount=AgentState.knowledge.length,interactionCount=AgentState.interactions.length;contentArea.innerHTML=`<div class="agent-profile"><div class="agent-avatar">${SVG.robot}</div><h2>${AgentState.name||'وكيلك الشخصي'}</h2><p>${knowledgeCount?`تعلم ${knowledgeCount} معلومات عنك`:'لم يتعلم عنك بعد'}</p><p style="font-size:11px;margin-top:4px;">${interactionCount?`${interactionCount} تفاعل`:'لا توجد تفاعلات'}</p></div><button class="teach-btn" onclick="startAgentChat()">${SVG.spark} تحدث مع وكيلك</button><div class="agent-memory"><h3>ذاكرة الوكيل</h3>${AgentState.knowledge.length?AgentState.knowledge.map((k,i)=>`<div class="memory-item">${SVG.check}<span>${esc(k)}</span><button class="more-btn memory-options" onclick="openMemoryMenu(event,${i})">${SVG.more}</button></div>`).join(''):'<p style="text-align:center;color:var(--faint);padding:20px;">لا توجد ذكريات بعد. تحدث مع وكيلك ليتعلم عنك.</p>'}</div>`}

function deleteMemory(index){AgentState.knowledge.splice(index,1);localStorage.setItem('foxAgent',JSON.stringify(AgentState));render()}
function renameAgent(){const newName=prompt('أدخل اسم الوكيل:',AgentState.name||'');if(newName&&newName.trim()){AgentState.name=newName.trim();localStorage.setItem('foxAgent',JSON.stringify(AgentState));render()}}
function clearAgentMemory(){if(confirm('هل أنت متأكد من مسح ذاكرة الوكيل بالكامل؟')){AgentState.knowledge=[];AgentState.preferences=[];AgentState.interactions=[];AgentState.personality=[];localStorage.setItem('foxAgent',JSON.stringify(AgentState));render();toast('تم مسح ذاكرة الوكيل')}}
function chooseModel(id,label){S.selectedModel=label;localStorage.setItem('foxSelectedModelId',id);closeDropdown();render()}
function addToFavorites(id){const favorites=JSON.parse(localStorage.getItem('foxFavorites')||'[]');if(!favorites.includes(String(id))){favorites.push(String(id));localStorage.setItem('foxFavorites',JSON.stringify(favorites));toast('تمت الإضافة للمفضلة')}}
function removeFavorite(id){let favorites=JSON.parse(localStorage.getItem('foxFavorites')||'[]');favorites=favorites.filter(f=>f!==String(id));localStorage.setItem('foxFavorites',JSON.stringify(favorites));render();toast('تمت الإزالة من المفضلة')}
function initLongpress(){document.addEventListener('touchstart',(e)=>{const bubble=e.target.closest('.bubble');if(!bubble)return;clearTimeout(longpressTimer);longpressTimer=setTimeout(()=>{const msgIndex=Array.from(document.querySelectorAll('.bubble')).indexOf(bubble);if(msgIndex>=0){showLongpressMenu(e.touches[0].clientX,e.touches[0].clientY,msgIndex)}},500)});document.addEventListener('touchend',()=>clearTimeout(longpressTimer));document.addEventListener('touchmove',()=>clearTimeout(longpressTimer))}
function showLongpressMenu(x,y,msgIndex){longpressMenu.innerHTML=`<button onclick="copyMessageFromMenu(${msgIndex})">${SVG.copy} نسخ</button><button onclick="shareMessageFromMenu(${msgIndex})">${SVG.share} مشاركة</button><button onclick="deleteMessageFromMenu(${msgIndex})" style="color:var(--red)">${SVG.trash} حذف</button>`;longpressMenu.style.position='fixed';longpressMenu.style.top=Math.min(y,window.innerHeight-150)+'px';longpressMenu.style.left=Math.max(10,Math.min(x,window.innerWidth-180))+'px';longpressMenu.classList.add('open');setTimeout(()=>longpressMenu.classList.remove('open'),3000)}
function copyMessageFromMenu(index){const m=S.messages[index]||AgentState.interactions[index];if(m){navigator.clipboard?.writeText(m.content).catch(()=>{});toast('تم النسخ')}longpressMenu.classList.remove('open')}
function shareMessageFromMenu(index){const m=S.messages[index]||AgentState.interactions[index];if(m&&navigator.share){navigator.share({text:m.content}).catch(()=>{})}else{toast('تمت المشاركة')}longpressMenu.classList.remove('open')}
function deleteMessageFromMenu(index){longpressMenu.classList.remove('open');if(confirm('⚠️ سيتم حذف هذه الرسالة نهائياً ولا يمكن استعادتها. هل أنت متأكد؟')){deleteMessage(index)}}
function startVoiceInput(){const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){toast('المتصفح لا يدعم الإدخال الصوتي');return}const recognition=new SpeechRecognition();recognition.lang='ar-SA';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onstart=()=>toast('🎤 استمع الآن...');recognition.onresult=(event)=>{const transcript=event.results[0][0].transcript;input.value+=(input.value?' ':'')+transcript;updateSendBtn();toast('تم إضافة النص الصوتي')};recognition.onerror=(event)=>toast('خطأ في التعرف الصوتي: '+event.error);recognition.onend=()=>toast('انتهى التسجيل');recognition.start()}
function openKnowledgeSettings(){S.screen='knowledge';render()}
function renderKnowledge(){contentArea.innerHTML=`<div class="agent-panel"><h3>المعرفة والذاكرة</h3><p style="font-size:12px;color:var(--muted);margin-bottom:12px;">إدارة ذاكرة الوكيل والمعلومات المحفوظة</p><div style="margin-bottom:12px;"><label style="font-size:11px;font-weight:600;display:block;margin-bottom:6px;">اسم الوكيل</label><input type="text" id="agentNameInput" value="${esc(AgentState.name||'')}" placeholder="أدخل اسم الوكيل" style="width:100%;padding:10px;border-radius:8px;background:var(--surface2);font-size:13px;"></div><div style="margin-bottom:12px;"><label style="font-size:11px;font-weight:600;display:block;margin-bottom:6px;">المعرفة المحفوظة (${AgentState.knowledge.length})</label><div id="knowledgeList" style="max-height:200px;overflow-y:auto;">${AgentState.knowledge.length?AgentState.knowledge.map((k,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--surface2);border-radius:8px;margin-bottom:4px;"><span style="flex:1;font-size:12px;">${esc(k)}</span><button onclick="deleteKnowledgeItem(${i})" style="color:var(--red);font-size:16px;">×</button></div>`).join(''):'<p style="font-size:11px;color:var(--faint);text-align:center;">لا توجد معرفة محفوظة</p>'}</div></div><button onclick="saveAgentName()" style="width:100%;padding:12px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;">حفظ</button><button onclick="clearAgentMemory()" style="width:100%;padding:12px;border-radius:8px;background:rgba(231,76,60,.2);color:var(--red);font-weight:700;margin-top:8px;">مسح كل الذاكرة</button></div>`}
function saveAgentName(){const nameInput=document.getElementById('agentNameInput');if(nameInput&&nameInput.value.trim()){AgentState.name=nameInput.value.trim();localStorage.setItem('foxAgent',JSON.stringify(AgentState));toast('تم حفظ اسم الوكيل')}}

function renderIntegrations(){contentArea.innerHTML=`<div class="agent-panel"><h3>التكاملات والموصلات</h3><p style="font-size:12px;color:var(--muted);margin-bottom:12px;">إدارة الاتصالات الخارجية</p><div style="margin-bottom:8px;"><div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border-radius:8px;"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:var(--green);"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg><span style="font-size:13px;font-weight:600;">Worker API</span><span style="font-size:11px;color:var(--green);margin-right:auto;">متصل</span></div></div><div style="margin-bottom:8px;"><div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border-radius:8px;"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:var(--green);"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg><span style="font-size:13px;font-weight:600;">D1 Database</span><span style="font-size:11px;color:var(--green);margin-right:auto;">متصل</span></div></div><div style="margin-bottom:8px;"><div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border-radius:8px;"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:var(--accent);"><path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm1 17h-2v-2h2zm2.07-7.75l-.9.92A3.4 3.4 0 0013 15h-2v-.5a3.1 3.1 0 01.9-2.2l1.24-1.26A1.7 1.7 0 0013.6 9.7a1.7 1.7 0 00-1.7-1.7 1.7 1.7 0 00-1.7 1.7H8.2a3.7 3.7 0 117.4 0 3.3 3.3 0 01-.53 1.55z"/></svg><span style="font-size:13px;font-weight:600;">GitHub Actions</span><span style="font-size:11px;color:var(--faint);margin-right:auto;">يعتمد على الإعداد</span></div></div><button onclick="toast('يمكن إضافة المزيد من التكاملات لاحقاً')" style="width:100%;padding:12px;border-radius:8px;background:var(--surface2);font-weight:600;border:1px dashed var(--line2);">+ إضافة تكامل جديد</button></div>`}
function openUpgrade(){S.screen='upgrade';render()}
function renderUpgrade(){contentArea.innerHTML=`<div class="agent-panel"><h3>ترقية FOX AI</h3><p style="font-size:12px;color:var(--muted);margin-bottom:12px;">اختر خطتك المناسبة</p><div style="background:var(--surface2);border:1px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:12px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span style="font-weight:800;font-size:15px;">الخطة المجانية</span><span style="background:var(--accent);color:#fff;padding:4px 10px;border-radius:8px;font-size:10px;font-weight:700;">حالية</span></div><ul style="font-size:12px;color:var(--muted);list-style:none;padding:0;"><li style="padding:4px 0;">✓ محادثة غير محدودة</li><li style="padding:4px 0;">✓ نماذج متعددة</li><li style="padding:4px 0;">✓ مرفقات حتى 700KB</li><li style="padding:4px 0;">✓ الوكيل والخطط</li></ul></div><div style="background:var(--surface2);border-radius:12px;padding:16px;margin-bottom:12px;opacity:.7;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span style="font-weight:800;font-size:15px;">الخطة المتقدمة</span><span style="color:var(--faint);font-size:11px;">قريباً</span></div><ul style="font-size:12px;color:var(--muted);list-style:none;padding:0;"><li style="padding:4px 0;">✓ ملفات أكبر</li><li style="padding:4px 0;">✓ تجارب طرفية غير محدودة</li><li style="padding:4px 0;">✓ أولوية في المعالجة</li></ul></div><button onclick="toast('سيتم إطلاق الخطط المدفوعة قريباً')" style="width:100%;padding:12px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;">اشترك الآن</button></div>`}
function renderLibrary(){contentArea.innerHTML='<div class="recent-title">الملفات</div><div class="empty-state" style="text-align:center;padding:60px 24px;"><div style="width:48px;height:48px;margin:0 auto 16px;opacity:.6;">'+SVG.library+'</div><h2>لا توجد ملفات</h2><p>ستظهر ملفاتك هنا</p></div>'}
function renderProjects(){contentArea.innerHTML='<div class="recent-title">المشاريع</div><div class="empty-state" style="text-align:center;padding:60px 24px;"><div style="width:48px;height:48px;margin:0 auto 16px;opacity:.6;">'+SVG.folder+'</div><h2>لا توجد مشاريع</h2><p>أنشئ مشروعك الأول</p></div>'}
function renderScheduled(){contentArea.innerHTML='<div class="empty-state" style="text-align:center;padding:60px 24px;"><div style="width:48px;height:48px;margin:0 auto 16px;opacity:.6;">'+SVG.clock+'</div><h2>لا توجد مهام مجدولة</h2><p>جدول مهامك هنا</p></div>'}
function renderFavorites(){const favorites=JSON.parse(localStorage.getItem('foxFavorites')||'[]');const favChats=S.chatHistory.filter(c=>favorites.includes(String(c.id)));contentArea.innerHTML=`<div class="recent-title">المحادثات المفضلة (${favChats.length})</div>${favChats.length?favChats.map(c=>`<div class="chat-row"><div class="chat-row-main" onclick="openChat('${String(c.id).replace(/'/g,"\\'")}')">${SVG.star}<span>${esc(c.title)}</span></div><div class="chat-row-options"><button class="more-btn" onclick="removeFavorite('${String(c.id).replace(/'/g,"\\'")}')">×</button></div></div>`).join(''):'<p style="text-align:center;color:var(--faint);padding:40px;">لا توجد محادثات مفضلة</p>'}`}
function renderSettings(){contentArea.innerHTML=`<div class="plan-card"><div class="plan-top"><button class="upgrade-btn" onclick="openUpgrade()">ترقية</button><div class="plan-plan">FOX AI</div></div><div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2);font-size:12px;"><span>0</span><span>${SVG.spark} الحصة</span></div></div><div class="plan-card"><h3 style="text-align:center;margin-bottom:10px;font-size:13px;">لون التطبيق</h3><div class="color-dots"><div class="color-dot orange ${S.accent==='orange'?'active':''}" onclick="setAccent('orange')"></div><div class="color-dot blue ${S.accent==='blue'?'active':''}" onclick="setAccent('blue')"></div><div class="color-dot green ${S.accent==='green'?'active':''}" onclick="setAccent('green')"></div><div class="color-dot red ${S.accent==='red'?'active':''}" onclick="setAccent('red')"></div></div></div><div class="settings-group"><div class="settings-row" onclick="toggleTheme()"><div class="s-icon">${SVG.moon}</div><div class="s-label">المظهر</div><div class="s-value">${S.theme==='light'?'فاتح':'داكن'}</div><svg class="s-chevron" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div><div class="settings-row" onclick="openModelSettings()"><div class="s-icon">${SVG.spark}</div><div class="s-label">النموذج الافتراضي</div><div class="s-value">${esc(S.selectedModel)}</div><svg class="s-chevron" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div><div class="settings-row" onclick="openTokenSettings()"><div class="s-icon">${SVG.tools}</div><div class="s-label">حدود النموذج</div><div class="s-value">${localStorage.getItem('foxMaxTokens')||'4096'} tokens</div><svg class="s-chevron" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div><div class="settings-row" onclick="openKnowledgeSettings()"><div class="s-icon">${SVG.help}</div><div class="s-label">المعرفة والذاكرة</div><svg class="s-chevron" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div><div class="settings-row" onclick="openIntegrations()"><div class="s-icon">${SVG.plug}</div><div class="s-label">التكاملات والموصلات</div><svg class="s-chevron" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div></div><div class="from-footer">FOX AI<small>الإصدار 26.13.0</small></div>`}
function openModelSettings(){S.screen='model-settings';render()}
function renderModelSettings(){const currentModel=localStorage.getItem('foxSelectedModelId')||'cerebras-gemma-4-31b';contentArea.innerHTML=`<div class="agent-panel"><h3>اختيار النموذج الافتراضي</h3><p style="font-size:12px;color:var(--muted);margin-bottom:12px;">اختر النموذج المستخدم في المحادثات الجديدة</p>${availableModels.map(m=>`<div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid ${m.id===currentModel?'var(--accent)':'transparent'};" onclick="setDefaultModel('${m.id}')"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:var(--accent);flex-shrink:0;"><path d="M12 2l1.6 5.8L19 9l-5.4 1.2L12 16l-1.6-5.8L5 9l5.4-1.2z"/></svg><div style="flex:1;"><div style="font-size:13px;font-weight:600;">${esc(m.name)}</div><div style="font-size:11px;color:var(--muted);">${esc(m.company||'')} · ${esc(m.description||'')}</div></div>${m.id===currentModel?'<span style="color:var(--accent);font-weight:700;">✓</span>':''}</div>`).join('')}</div>`}
function setDefaultModel(id){localStorage.setItem('foxSelectedModelId',id);const m=availableModels.find(x=>x.id===id);if(m)S.selectedModel=`${m.name} · ${m.company}`;toast('تم تعيين النموذج الافتراضي');render()}
function openTokenSettings(){S.screen='token-settings';render()}
function renderTokenSettings(){const maxTokens=localStorage.getItem('foxMaxTokens')||'4096';const temperature=localStorage.getItem('foxTemperature')||'0.7';contentArea.innerHTML=`<div class="agent-panel"><h3>حدود النموذج</h3><div style="margin-bottom:16px;"><label style="font-size:12px;font-weight:600;display:block;margin-bottom:6px;">الحد الأقصى للرموز (Max Tokens)</label><input type="number" id="maxTokensInput" value="${maxTokens}" min="100" max="8000" step="100" style="width:100%;padding:10px;border-radius:8px;background:var(--surface2);font-size:13px;"></div><div style="margin-bottom:16px;"><label style="font-size:12px;font-weight:600;display:block;margin-bottom:6px;">درجة الحرارة (Temperature): ${temperature}</label><input type="range" id="temperatureInput" value="${temperature}" min="0" max="1" step="0.1" style="width:100%;" oninput="document.getElementById('tempValue').textContent=this.value"><div style="text-align:center;font-size:12px;color:var(--accent);font-weight:700;" id="tempValue">${temperature}</div></div><button onclick="saveTokenSettings()" style="width:100%;padding:12px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;">حفظ الإعدادات</button></div>`}
function saveTokenSettings(){const maxTokens=document.getElementById('maxTokensInput')?.value;const temperature=document.getElementById('temperatureInput')?.value;if(maxTokens)localStorage.setItem('foxMaxTokens',maxTokens);if(temperature)localStorage.setItem('foxTemperature',temperature);toast('تم حفظ الإعدادات');render()}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';localStorage.setItem('foxTheme',S.theme);document.documentElement.dataset.theme=S.theme;render()}
function setAccent(color){S.accent=color;localStorage.setItem('foxAccent',color);document.documentElement.dataset.accent=color;render()}
async function sendMessage(){const value=input.value.trim();if(!value)return;if(S.screen==='agent-chat'){AgentState.interactions.push({role:'user',content:value});if(!AgentState.knowledge.includes(value)){AgentState.knowledge.push(value)}input.value='';updateSendBtn();render();try{const r=await api({action:'chat',chatId:'agent-'+Date.now(),model:localStorage.getItem('foxSelectedModelId')||'cerebras-gemma-4-31b',messages:[{role:'user',content:value}],attachments:[]});const d=await r.json();if(r.ok&&d.response){AgentState.interactions.push({role:'agent',content:d.response})}else{AgentState.interactions.push({role:'agent',content:'فهمت! سأتذكر ذلك.'})}}catch{AgentState.interactions.push({role:'agent',content:'فهمت! سأتذكر ذلك.'})}AgentState.lastUpdated=new Date().toISOString();localStorage.setItem('foxAgent',JSON.stringify(AgentState));render()}else{if(activeTaskId){try{const r=await api({action:'task_intervention',taskId:activeTaskId,content:value,advance:true});const d=await r.json();if(r.ok){S.messages.push({role:'user',content:value});S.messages.push({role:'agent',content:'تم إرسال توجيهك للمهمة النشطة.'});activePlan=d.plan||activePlan;input.value='';updateSendBtn();render();return}}catch(e){}}if(!S.currentChatId)S.currentChatId=Date.now().toString();S.messages.push({role:'user',content:value});input.value='';updateSendBtn();render();try{const r=await api({action:'chat',chatId:S.currentChatId,model:localStorage.getItem('foxSelectedModelId')||'cerebras-gemma-4-31b',messages:S.messages,attachments:pendingAttachments});const d=await r.json();if(r.ok&&d.response){S.messages.push({role:'agent',content:d.response});if(d.pendingExecution){pendingTool=d.pendingExecution;S.messages.push({role:'agent',content:`🔧 اقتراح طرفية:\n${d.pendingExecution.command}`})}}else{S.messages.push({role:'agent',content:'عذراً، تعذر الاتصال بالخادم.'})}}catch(e){S.messages.push({role:'agent',content:'عذراً، حدث خطأ: '+e.message})}pendingAttachments=[];S.chatHistory=[...S.chatHistory.filter(x=>String(x.id)!==String(S.currentChatId)),{id:S.currentChatId,title:value.slice(0,60),messages:S.messages}];localStorage.setItem('foxHistory',JSON.stringify(S.chatHistory));render()}}
function render(){renderTopNav();updateComposerVisibility();renderComposerIcons();switch(S.screen){case'home':renderHome();break;case'agent-home':renderAgentHome();break;case'agent-chat':renderAgentChat();break;case'chat':renderChat();break;case'workspace':renderWorkspace();break;case'task-events':renderTaskEvents();break;case'memory':renderMemory();break;case'search-results':renderSearchResults();break;case'settings':renderSettings();break;case'knowledge':renderKnowledge();break;case'integrations':renderIntegrations();break;case'upgrade':renderUpgrade();break;case'library':renderLibrary();break;case'projects':renderProjects();break;case'scheduled':renderScheduled();break;case'favorites':renderFavorites();break;case'file-preview':renderFilePreview();break;case'model-settings':renderModelSettings();break;case'token-settings':renderTokenSettings();break}}
function bindEvents(){sendBtn.addEventListener('click',sendMessage);micBtn.addEventListener('click',startVoiceInput);attachBtn.addEventListener('click',()=>fileInput.click());planBtn.addEventListener('click',createPlan);fileInput.addEventListener('change',async()=>{pendingAttachments=[];const a=[];for(const f of fileInput.files){if(f.type.startsWith('image/')||f.type==='application/pdf'||!f.type.startsWith('text/')){pendingAttachments.push({name:f.name,mime:f.type||'application/octet-stream',size:f.size,data:await readDataUrl(f)});a.push(`[ملف مرفق: ${f.name}]`)}else{const tx=(await f.text()).slice(0,12000);pendingAttachments.push({name:f.name,mime:f.type||'text/plain',size:f.size,text:tx});a.push(`[ملف نصي مرفق: ${f.name}]\n${tx}`)}}input.value+=a.join('\n');updateSendBtn();toast(`تمت إضافة ${pendingAttachments.length} مرفق`)});fab.innerHTML=SVG.plus;fab.addEventListener('click',newChat);input.addEventListener('input',updateSendBtn);input.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});ddBackdrop.addEventListener('click',closeDropdown);initLongpress()}
async function init(){document.documentElement.dataset.theme=S.theme;document.documentElement.dataset.accent=S.accent;try{S.chatHistory=JSON.parse(localStorage.getItem('foxHistory')||'[]')}catch{}await loadModels();await loadActiveTask();const savedModelId=localStorage.getItem('foxSelectedModelId');if(savedModelId&&availableModels.length){const m=availableModels.find(x=>x.id===savedModelId);if(m)S.selectedModel=`${m.name} · ${m.company}`}bindEvents();render()}
document.addEventListener('DOMContentLoaded',init);
</script>
