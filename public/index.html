<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FOX AI</title>
<style>
/* ============ المتغيرات ============ */
:root{
  --bg:#0a0a0f;--surface:#12121a;--surface2:#1c1c26;--surface3:#2c2c30;
  --line:#282836;--line2:#383848;--ink:#f0f0f8;--muted:#9090a4;--faint:#606074;
  --radius:16px;--radius-sm:12px;--shadow:0 8px 30px rgba(0,0,0,.5);
  --font:'Segoe UI','Tahoma','Arial',system-ui,sans-serif;
  --accent:#e06442;--accent2:#f28561;--accent3:#b6452e;--accent-bg:rgba(224,100,66,.1);
}
[data-theme="light"]{
  --bg:#f2f2f7;--surface:#fff;--surface2:#f0f0f5;--surface3:#e5e5ea;
  --line:#e0e0e8;--line2:#d0d0d8;--ink:#1a1a2a;--muted:#606074;--faint:#9090a4;
}
[data-accent="orange"]{--accent:#e06442;--accent2:#f28561;--accent3:#b6452e}
[data-accent="blue"]{--accent:#3498db;--accent2:#5dade2;--accent3:#217dbb}
[data-accent="green"]{--accent:#27ae60;--accent2:#2ecc71;--accent3:#1e8449}
[data-accent="red"]{--accent:#e74c3c;--accent2:#ec7063;--accent3:#b03a2e}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.7 var(--font)}
button,input,textarea{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}textarea{resize:none}
::-webkit-scrollbar{display:none}
.app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;border-inline:1px solid var(--line);background:var(--bg)}

/* ============ الأيقونات ============ */
svg{display:inline-block;vertical-align:middle;fill:currentColor;width:20px;height:20px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;color:var(--ink)}
.icon-btn:active{background:var(--surface2)}
.icon-btn svg{width:20px;height:20px}

/* ============ الشريط العلوي ============ */
.top-nav{display:flex;align-items:center;gap:6px;padding:8px 12px;min-height:56px;flex-shrink:0;position:relative;z-index:40;border-bottom:1px solid var(--line)}
.tn-side{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tn-center{flex:1;display:flex;align-items:center;justify-content:center}
.nav-title{font-weight:800;font-size:16px}
.model-pill{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:4px 8px;border-radius:10px;background:var(--surface2)}
.model-pill svg{width:12px;height:12px;fill:var(--muted)}
.toggle-wrap{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:20px;padding:3px}
.toggle-wrap button{height:28px;border-radius:15px;padding:0 14px;font-size:12px;font-weight:700;color:var(--muted)}
.toggle-wrap button.active{background:var(--accent);color:#fff}

/* ============ المحتوى ============ */
.content{flex:1;overflow-y:auto;padding:14px 16px;scroll-behavior:smooth}
.shortcuts-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin:2px 0 20px}
.shortcut-card{flex:0 0 auto;width:80px;height:85px;background:var(--surface);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:.15s;border:1px solid var(--line)}
.shortcut-card:active{background:var(--surface2);transform:scale(.96)}
.shortcut-card svg{width:22px;height:22px;fill:var(--accent)}
.shortcut-card span{font-size:11px;font-weight:600}
.recent-title{font-size:12px;font-weight:600;color:var(--faint);margin:4px 0 10px;text-align:right}

/* ============ صفوف المحادثات ============ */
.chat-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);position:relative}
.chat-row:last-child{border-bottom:0}
.chat-row-main{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;overflow:hidden}
.chat-row-main svg{width:18px;height:18px;fill:var(--accent);flex-shrink:0}
.chat-row-main span{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-row-options{position:relative;flex-shrink:0}
.more-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.more-btn:active{background:var(--surface2)}
.more-btn svg{width:18px;height:18px;fill:var(--muted)}

/* ============ الرسائل ============ */
.message{margin-bottom:14px;display:flex;flex-direction:column;position:relative}
.message.user{align-items:flex-start}
.message.agent{align-items:flex-end}
.message-content{display:flex;align-items:flex-start;gap:6px;max-width:85%}
.message.user .message-content{flex-direction:row}
.message.agent .message-content{flex-direction:row-reverse}
.bubble{padding:12px 16px;border-radius:18px;font-size:13.5px;line-height:1.6;word-break:break-word;flex:1;user-select:text;-webkit-user-select:text}
.message.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.message.agent .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg-options-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.msg-options-btn svg{width:14px;height:14px;fill:var(--muted)}

/* ============ شريط الإدخال ============ */
.composer-wrap{display:none;padding:8px 10px 12px;flex-shrink:0;border-top:1px solid var(--line)}
.composer-wrap.visible{display:block}
.composer-card{background:var(--surface);border-radius:24px;padding:8px 6px 6px;border:1px solid var(--line)}
.composer-input{width:100%;padding:6px 12px;font-size:14px;min-height:24px;max-height:100px;text-align:right;direction:rtl}
.composer-toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.composer-cluster{display:flex;align-items:center;gap:2px}
.composer-toolbar button{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.composer-toolbar button:active{background:var(--surface2)}
.composer-toolbar svg{width:20px;height:20px;fill:var(--muted)}
.btn-send-active{background:var(--accent)!important}
.btn-send-active svg{fill:#fff!important}

/* ============ شاشة Agent ============ */
.agent-profile{text-align:center;padding:20px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);margin-bottom:16px}
.agent-avatar{width:80px;height:80px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.agent-avatar svg{width:40px;height:40px;fill:var(--accent)}
.agent-profile h2{font-size:18px;font-weight:800;margin-bottom:4px}
.agent-profile p{font-size:12px;color:var(--muted)}
.teach-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:var(--accent);color:#fff;border-radius:var(--radius);font-size:14px;font-weight:700;margin-bottom:16px}
.teach-btn svg{width:20px;height:20px;fill:#fff}
.agent-memory{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:16px}
.agent-memory h3{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--accent)}
.memory-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--surface2);margin-bottom:6px;font-size:12px;position:relative}
.memory-item svg{width:14px;height:14px;fill:var(--accent);flex-shrink:0}
.memory-item .memory-options{margin-right:auto;position:relative}

/* ============ الإعدادات ============ */
.plan-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:10px;border:1px solid var(--line)}
.plan-top{display:flex;align-items:center;justify-content:space-between}
.plan-plan{font-size:18px;font-weight:800;color:var(--accent)}
.upgrade-btn{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:6px 14px;border-radius:10px}
.settings-group{background:var(--surface);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;padding:0 16px;border:1px solid var(--line)}
.settings-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.settings-row:last-child{border-bottom:0}
.s-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.s-icon svg{width:18px;height:18px;fill:var(--accent)}
.s-label{flex:1;text-align:right;font-size:13px;font-weight:500}
.s-value{font-size:11px;color:var(--faint)}
.s-chevron{width:16px;height:16px;fill:var(--faint);flex-shrink:0;transform:scaleX(-1)}

/* ============ زر الإضافة ============ */
.fab{position:absolute;bottom:20px;left:16px;width:56px;height:56px;border-radius:50%;background:var(--accent);box-shadow:0 4px 18px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;transition:.2s}
.fab:active{transform:scale(.9)}
.fab svg{width:28px;height:28px;fill:#fff}
.fab.hidden{display:none}

/* ============ القوائم المنسدلة - محسنة ============ */
.dd-backdrop{position:fixed;inset:0;z-index:999;display:none;background:rgba(0,0,0,.3)}
.dd-backdrop.open{display:block}
.dropdown-panel{
  position:fixed;
  background:var(--surface2);
  border-radius:16px;
  padding:6px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
  z-index:1000;
  min-width:200px;
  max-width:220px;
  display:none;
  border:1px solid var(--line);
  overflow-y:auto;
  max-height:60vh;
}
.dropdown-panel.open{
  display:block;
  animation:ddIn .2s ease;
}
@keyframes ddIn{
  from{opacity:0;transform:scale(.95)}
  to{opacity:1;transform:scale(1)}
}
.dd-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 12px;
  border-radius:10px;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
}
.dd-item:active{
  background:var(--surface3);
}
.dd-item svg{
  width:16px;
  height:16px;
  fill:var(--accent);
  flex-shrink:0;
}
.dd-item.danger{
  color:#e74c3c;
}
.dd-item.danger svg{
  fill:#e74c3c;
}
.dd-divider{
  height:1px;
  background:var(--line2);
  margin:4px 6px;
}

/* ============ الألوان ============ */
.color-dots{display:flex;gap:12px;justify-content:center;margin:15px 0}
.color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.color-dot.active{border-color:var(--ink)}
.color-dot.orange{background:#e06442}.color-dot.blue{background:#3498db}
.color-dot.green{background:#27ae60}.color-dot.red{background:#e74c3c}

/* ============ Toast ============ */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--surface3);color:var(--ink);padding:10px 20px;border-radius:16px;font-size:12px;font-weight:600;z-index:3000;box-shadow:var(--shadow);max-width:80%;text-align:center}
.from-footer{text-align:center;color:var(--faint);font-size:12px;margin-top:20px}

/* ============ تفاصيل المهمة ============ */
.task-goal-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px}
.task-goal-card b{font-size:13px}
.task-goal-card .status-line{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:4px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0}
.status-dot.running{background:var(--accent);animation:pulse2 1.4s infinite}
.status-dot.finished{background:#2ecc71}
.status-dot.failed{background:#e74c3c}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.4}}
.step-row{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.step-row:last-child{border:0}
.step-dot{width:18px;height:18px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;margin-top:1px;font-weight:700}
.step-row.done .step-dot{background:rgba(46,204,113,.18);color:#2ecc71}
.step-row.run .step-dot{background:var(--accent-bg);color:var(--accent);animation:pulse2 1.3s infinite}
.step-row.await .step-dot{background:rgba(243,156,18,.2);color:#f39c12}
.step-row.fail .step-dot{background:rgba(231,76,60,.15);color:#e74c3c}
.step-title{font-weight:700;font-size:12px}
.step-sub{font-size:10px;color:var(--faint);margin-top:1px}
.terminal-box{background:#000;border:1px solid var(--line2);border-radius:var(--radius-sm);padding:10px;margin:8px 0;font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:10.5px;color:#7ee787;max-height:200px;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.terminal-box .cursor{display:inline-block;width:6px;height:11px;background:#7ee787;animation:blink2 1s step-end infinite;vertical-align:middle;margin-right:2px}
.terminal-meta{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);margin-top:6px}
@keyframes blink2{0%,50%{opacity:1}51%,100%{opacity:0}}
.approval-box{background:rgba(243,156,18,.1);border:1px solid #f39c12;border-radius:var(--radius-sm);padding:11px;margin:8px 0;font-size:12px}
.approval-box .row{display:flex;gap:6px;margin-top:8px}
.approval-box .row button{flex:1;border-radius:10px;padding:11px;font-weight:700;font-size:12px}
.approval-box .approve{background:#2ecc71;color:#fff}
.approval-box .reject{background:var(--surface2);color:var(--ink)}
.task-controls{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.task-controls button{flex:1;min-width:70px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:11px;font-weight:600;color:var(--ink)}
.task-controls button.danger{color:#e74c3c}
.task-controls button.primary{background:var(--accent);color:#fff;border-color:var(--accent3)}
.steer-row{display:flex;gap:6px;margin-top:6px}
.steer-row input{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:10px 14px;font-size:12px;color:var(--ink)}
.steer-row button{background:var(--accent);color:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.result-box{background:rgba(46,204,113,.1);border:1px solid #2ecc71;border-radius:var(--radius-sm);padding:11px;margin:8px 0;font-size:12px}
.result-box button{margin-top:8px;background:#2ecc71;color:#fff;border-radius:10px;padding:10px 12px;font-weight:700;width:100%}
.event-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:6px;font-size:11px;cursor:pointer}
.event-card .ev-head{display:flex;justify-content:space-between;color:var(--muted)}
.event-card pre{margin-top:6px;font-size:10px;color:var(--faint);white-space:pre-wrap;overflow-wrap:anywhere;max-height:120px;overflow:auto;display:none}
.event-card.open pre{display:block}
.agent-activity{display:flex;align-items:center;gap:8px;padding:11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:11px;color:var(--muted);margin-bottom:8px}
.agent-activity svg{width:16px;height:16px;animation:spin2 1s linear infinite;fill:var(--accent);flex-shrink:0}
@keyframes spin2{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.file-card{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px;font-size:11px}
.file-card svg{width:18px;fill:var(--accent);flex-shrink:0}
.file-card .fc-info{flex:1;overflow:hidden}
.file-card .fc-info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.file-card .fc-info small{color:var(--faint)}
.search-result{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}
.search-result small{display:block;color:var(--faint);margin-top:2px}
.settings-real{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.settings-real:last-child{border:0}
.settings-real select,.settings-real input[type=text]{flex:1;background:var(--surface2);border-radius:8px;padding:8px;font-size:12px;color:var(--ink);text-align:right}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1990;display:none}
.modal-backdrop.open{display:block}
.modal-sheet{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:2000;display:none;max-height:75dvh;overflow-y:auto}
.modal-sheet.open{display:block;animation:slideUp2 .25s ease-out}
@keyframes slideUp2{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-sheet h3{font-size:15px;margin-bottom:6px;text-align:center}
.typing-dots{letter-spacing:2px;animation:typingPulse 1.2s infinite;display:inline-block}
@keyframes typingPulse{0%,100%{opacity:.3}50%{opacity:1}}

</style>
</head>
<body>
<div class="app" id="app">
  <div class="top-nav" id="topNav"></div>
  <div class="content" id="contentArea"></div>
  <div class="fab hidden" id="fab"></div>
  <div class="composer-wrap" id="composerWrap">
    <div class="composer-card">
      <textarea class="composer-input" id="input" placeholder="إرسال رسالة إلى FOX AI" rows="1"></textarea>
      <div class="composer-toolbar">
        <div class="composer-cluster">
          <button id="micBtn" title="ميكروفون"></button>
          <button id="attachBtn" title="مرفقات"></button>
        </div>
        <div class="composer-cluster">
          <button id="sendBtn" title="إرسال"></button>
        </div>
      </div>
    </div>
  </div>
</div>
<input type="file" id="fileInput" hidden multiple />
<div class="dd-backdrop" id="ddBackdrop"></div>
<div class="dropdown-panel" id="dropdownPanel"></div>
<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="modal-sheet" id="modalSheet"></div>

<script>
'use strict';

/* ============ الأيقونات ============ */
const SVG = {
  search: '<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>',
  user: '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
  chevronDown: '<svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>',
  chevronR: '<svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>',
  folder: '<svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>',
  library: '<svg viewBox="0 0 24 24"><path d="M4 4h3v16H4zM9 4h3v16H9zM15 4.7l3 15.6-2.9.6L12 5.3z"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>',
  spark: '<svg viewBox="0 0 24 24"><path d="M12 2l1.6 5.8L19 9l-5.4 1.2L12 16l-1.6-5.8L5 9l5.4-1.2z"/></svg>',

/* ============ دوال مساعدة ============ */
function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }
function nav(s) { closeDropdown(); S.screen = s; render(); }
function goBack() { nav('home'); }
function setMode(m) { S.mode = m; S.screen = 'home'; render(); }
function iconBtn(svgKey, onclick) { return `<button class="icon-btn" onclick="${onclick}">${SVG[svgKey]}</button>`; }
function toBackendRole(r){ return r==='agent' ? 'assistant' : r; }
function toLocalRole(r){ return r==='assistant' ? 'agent' : r; }
function downloadText(filename,content){const blob=new Blob([content],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),4000)}
async function api(payload){
  let token = localStorage.getItem('foxToken') || '';
  let r = await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...payload,sessionToken:token})});
  if (r.status === 401) {
    const pw = prompt('أدخل كلمة مرور FOX AI');
    if (!pw) throw Error('يلزم تسجيل الدخول');
    const lr = await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',accessPassword:pw})});
    const ld = await lr.json();
    if (!lr.ok || !ld.token) throw Error(ld.error || 'فشل تسجيل الدخول');
    localStorage.setItem('foxToken', ld.token);
    r = await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...payload,sessionToken:ld.token})});
  }
  const d = await r.json().catch(() => ({}));
  return {ok:r.ok,status:r.status,data:d};
}
async function loadModels(){
  try{
    const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'models'})});
    const d=await r.json();
    if(d.models?.length){ S.models=d.models; if(!S.selectedModel||!S.models.find(x=>x.id===S.selectedModel)) S.selectedModel=S.models[0].id; }
  }catch{}
}
function currentModelLabel(){ const m=S.models.find(x=>x.id===S.selectedModel); return m?`${m.name} · ${m.company}`:'اختيار النموذج'; }
async function loadTaskIndex(){
  try{
    const r=await api({action:'list_conversations',limit:50});
    if(!r.ok) return;
    S.chatHistory = r.data.conversations.map(c=>({
      id:c.id, title:c.title, taskId:c.taskId,
      taskStatus:c.taskStatus, taskGoal:c.taskGoal, updatedAt:c.updatedAt,
      favorite: S.favorites.includes(c.id)
    }));
  }catch(e){ toast('تعذر تحميل المحادثات: '+e.message); }
}
function mapStatusLabel(s){
  return {planning:'قيد التخطيط',awaiting_approval:'بانتظار إذن',running:'قيد التنفيذ',recovering:'إعادة محاولة',verifying:'قيد التحقق',paused:'متوقفة مؤقتًا',completed:'مكتملة',failed:'فشلت',cancelled:'ملغاة'}[s] || 'محادثة';
}
function mapStatusGroup(s){
  if(s==='completed') return 'finished';
  if(['failed','cancelled'].includes(s)) return 'finished';
  if(['running','recovering','verifying','awaiting_approval','planning'].includes(s)) return 'progress';
  return 'other';
}

/* ============ القوائم المنسدلة - مصححة للهاتف ============ */
function openDropdown(x, y, items) {
  const panelWidth = 220;
  const panelHeight = items.length * 46 + 20;
  const screenWidth = window.innerWidth;
  const screenHeight = window.innerHeight;
  const appWidth = Math.min(screenWidth, 430);
  
  let leftPos = x - panelWidth + 40;
  if (leftPos < 10) leftPos = 10;
  if (leftPos + panelWidth > appWidth - 10) leftPos = appWidth - panelWidth - 10;
  
  let topPos = y + 10;
  if (topPos + panelHeight > screenHeight - 10) topPos = y - panelHeight - 10;
  if (topPos < 60) topPos = 60;
  
  dropdownPanel.innerHTML = items.map(it => {
    if (it.divider) return '<div class="dd-divider"></div>';
    return `<div class="dd-item ${it.danger ? 'danger' : ''}" onclick="${it.action}">${it.icon}<span>${esc(it.label)}</span></div>`;
  }).join('');
  
  dropdownPanel.style.position = 'fixed';
  dropdownPanel.style.top = topPos + 'px';
  dropdownPanel.style.left = leftPos + 'px';
  dropdownPanel.style.right = 'auto';
  dropdownPanel.style.bottom = 'auto';
  dropdownPanel.style.maxWidth = panelWidth + 'px';
  dropdownPanel.style.width = 'auto';
  dropdownPanel.style.zIndex = '1000';
  
  dropdownPanel.className = 'dropdown-panel open';
  ddBackdrop.classList.add('open');
}

function closeDropdown() { 
  dropdownPanel.classList.remove('open'); 
  ddBackdrop.classList.remove('open'); 
}
function openModal(html){
  const sheet=$('modalSheet'), backdrop=$('modalBackdrop');
  sheet.innerHTML = html;
  sheet.classList.add('open'); backdrop.classList.add('open');
}
function closeModal(){

}

/* ============ تفاصيل المهمة (الوكيل المستقل الحقيقي) ============ */
async function openTask(taskId){
  S.task = {id:taskId}; S.taskPlan=null; S.taskControl=null; S.taskEventsList=[];
  S.screen = 'task'; render();
  await refreshTaskDetail(taskId, true);
}
async function refreshTaskDetail(taskId, isFirstLoad){
  try{
    const r = await api({action:'get_task_control', taskId});
    if(!r.ok){ toast(r.data.error||'تعذر تحميل المهمة'); return; }
    S.task = r.data.task; S.taskPlan = r.data.plan; S.taskControl = r.data.control;
    if(S.screen==='task') renderTaskDetail();
    const status = S.taskControl?.status || S.task?.status;
    if(!['completed','failed','cancelled'].includes(status)) scheduleTaskAdvance(taskId); else stopTaskPolling();
  }catch(e){ toast(e.message); }
}
function scheduleTaskAdvance(taskId){
  if(taskPollTimer && taskPollTimer._id===taskId) return;
  stopTaskPolling();
  taskPollTimer = setInterval(()=>advanceTaskTick(taskId), 3500);
  taskPollTimer._id = taskId;
}
function stopTaskPolling(){ if(taskPollTimer){ clearInterval(taskPollTimer); taskPollTimer=null; } }
async function advanceTaskTick(taskId){
  try{
    const r = await api({action:'advance_task', taskId, maxSteps:1});
    if(r.ok){
      S.task=r.data.task; S.taskPlan=r.data.plan;
      if(S.screen==='task') renderTaskDetail();
    }
    const status=S.task?.status;
    if(['completed','failed','cancelled'].includes(status)) stopTaskPolling();
  }catch{}
}
const STATUS_LABEL = {received:'مستلمة',submitted:'مستلمة',clarifying:'بحاجة توضيح',planning:'قيد التخطيط',awaiting_approval:'بانتظار الاعتماد',waiting_for_input:'بانتظار توضيح منك',running:'قيد التنفيذ الذاتي',verifying:'قيد التحقق',producing:'قيد الإنتاج',recovering:'إعادة محاولة',paused:'متوقفة مؤقتًا',completed:'مكتملة',failed:'فشلت',cancelled:'ملغاة'};
const STEP_LABEL = {pending:'قيد الانتظار',running:'قيد التنفيذ',awaiting_approval:'بانتظار إذن التنفيذ',completed:'مكتملة',failed:'فشلت',retrying:'إعادة محاولة',verifying:'قيد التحقق'};
function renderTaskDetail(){
  const t=S.task, plan=S.taskPlan, control=S.taskControl;
  if(!t){ contentArea.innerHTML='<div class="agent-activity"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="50 20"/></svg><span>جارٍ التحميل...</span></div>'; return; }
  const status = control?.status || t.status;
  const group = mapStatusGroup(status);
  const goal = plan?.goal || t.goal || 'مهمة';
  let html = `<div class="task-goal-card"><b>${esc(goal)}</b><div class="status-line"><span class="status-dot ${group==='progress'?'running':group==='finished'?(status==='completed'?'finished':'failed'):''}"></span>${STATUS_LABEL[status]||status} • Agent Mode</div></div>`;

  if(!plan){ html += `<div class="agent-activity"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="50 20"/></svg><span>جارٍ تحميل الخطة...</span></div>`; contentArea.innerHTML=html; return; }

  const needsApproval = ['planning'].includes(t.status);
  if(needsApproval) html += `<div class="recent-title" style="text-align:right">مراجعة الخطة قبل التنفيذ</div>`;

  html += plan.steps.map((s,i)=>{
    const cls = s.status==='completed'?'done':s.status==='failed'?'fail':s.status==='running'?'run':s.status==='awaiting_approval'?'await':'';
    const icon = s.status==='completed'?'✓':s.status==='failed'?'×':s.status==='running'?'…':s.status==='awaiting_approval'?'!':(i+1);
    const sub = needsApproval ? esc((s.description||'').slice(0,90)) : (STEP_LABEL[s.status]||s.status)+(s.error?' — '+esc(String(s.error).slice(0,90)):'');
    return `<div class="step-row ${cls}"><span class="step-dot">${icon}</span><span style="flex:1"><div class="step-title">${esc(s.title)}</div><div class="step-sub">${sub}</div></span></div>`;
  }).join('');

  if(needsApproval){
    html += `<button class="teach-btn" style="margin-top:10px" onclick="approveTaskClick('${t.id}','${plan.steps[0]?.id||''}')">${SVG.check} اعتماد الخطة وتشغيلها تلقائيًا</button>`;
  } else if(!['completed','failed','cancelled'].includes(t.status)){
    html += `<div class="task-controls">
      <button class="${status==='paused'?'primary':''}" onclick="taskControlAction('${t.id}','${status==='paused'?'resume_task':'pause_task'}')">${status==='paused'?'استئناف':'إيقاف مؤقت'}</button>
      <button class="danger" onclick="if(confirm('إلغاء هذه المهمة نهائيًا؟'))taskControlAction('${t.id}','cancel_task')">إلغاء</button>
      <button onclick="loadTaskEvents('${t.id}')">سجل الأحداث</button>
    </div>`;
  }

  const awaiting = plan.steps.find(s=>s.status==='awaiting_approval' && s.command);
  if(awaiting){
    html += `<div class="approval-box"><b>الخطوة «${esc(awaiting.title)}» تحتاج تنفيذ أمر فعلي:</b><div class="terminal-box">${esc(awaiting.command)}<span class="cursor"></span></div><div class="row"><button class="approve" onclick="approveStepTool('${t.id}','${awaiting.id}')">موافقة وتشغيل</button><button class="reject" onclick="rejectStepTool('${t.id}','${awaiting.id}')">رفض</button></div></div>`;
  } else if(t.status==='waiting_for_input'){
    html += `<div class="approval-box"><b>المهمة تحتاج توضيحًا منك:</b><div style="margin-top:6px">${esc((plan.steps.find(s=>s.id===t.currentStepId)?.output)||'يحتاج الوكيل معلومة إضافية لمتابعة العمل.')}</div></div>`;
  } else {
    const runningExp = plan.steps.find(s=>s.status==='awaiting_approval')?.experimentId;
    if(['running','recovering'].includes(status)){
      const lastDone=[...plan.steps].reverse().find(s=>s.status==='completed'&&s.output);
      if(lastDone) html += `<div class="terminal-box">${esc(String(lastDone.output).slice(-500))}<span class="cursor"></span></div>`;
    }
  }

  if(t.status==='completed'){
    html += `<div class="result-box"><b>✓ اكتملت المهمة</b><button onclick="downloadTaskResult()">⬇ تنزيل النتيجة</button></div>`;
  }

  html += `<div id="eventsPanel"></div>`;
  contentArea.innerHTML = html;
}
async function approveTaskClick(taskId, firstStepId){
  toast('يبدأ التنفيذ الذاتي...');
  try{
    const r = await api({action:'step_control', taskId, stepId:firstStepId, action:'start_step'});
    if(!r.ok) throw Error(r.data.error||'تعذر اعتماد الخطة');
    S.task=r.data.task; S.taskPlan=r.data.plan; renderTaskDetail();
    scheduleTaskAdvance(taskId);
  }catch(e){ toast(e.message); }

async function taskControlAction(taskId, action){
  try{
    const r = await api({action, taskId});
    if(!r.ok) throw Error(r.data.error||'تعذر تغيير حالة المهمة');
    toast(action==='pause_task'?'تم الإيقاف المؤقت':action==='resume_task'?'تم الاستئناف':'تم الإلغاء');
    if(action==='resume_task') scheduleTaskAdvance(taskId); else stopTaskPolling();
    await refreshTaskDetail(taskId);
  }catch(e){ toast(e.message); }

async function steerSend(){
  const note = input.value.trim();
  if(!note || !S.task?.id) return;
  input.value=''; updateSendBtn();
  try{
    const r = await api({action:'task_intervention', taskId:S.task.id, content:note});
    if(!r.ok) throw Error(r.data.error||'تعذر إرسال التوجيه');
    S.task=r.data.task; S.taskPlan=r.data.plan; renderTaskDetail();
    toast('تم إرسال التوجيه دون إلغاء المهمة');
    scheduleTaskAdvance(S.task.id);
  }catch(e){ toast(e.message); }
}
async function approveStepTool(taskId, stepId){
  const step = S.taskPlan?.steps.find(s=>s.id===stepId);
  if(!step) return;
  toast('جارٍ إرسال الأمر إلى GitHub Actions...');
  try{
    const proposal = {id:crypto.randomUUID(), kind:'terminal', command:step.command, language:step.language||'bash'};
    const r = await api({action:'run_tool', chatId:S.task.conversationId, proposal, approved:true, taskId, stepId});
    if(!r.ok){
      if(r.data.needsApproval && /حصة/.test(r.data.reason||'')){
        const choice = prompt('انتهت حصة تنفيذ الطرفية. اكتب 5 أو 10 لمنح إذن جديد.');
        if(choice==='5'||choice==='10'){
          const r2 = await api({action:'run_tool', chatId:S.task.conversationId, proposal, approved:true, taskId, stepId, renewBudget:Number(choice)});
          if(!r2.ok) throw Error(r2.data.error||r2.data.reason||'تعذر تشغيل التجربة');
          toast('تم الإرسال، بانتظار GitHub Actions...'); scheduleTaskAdvance(taskId); return;
        }
      }
      throw Error(r.data.error||r.data.reason||'تعذر تشغيل التجربة');
    }
    toast('تم الإرسال، بانتظار GitHub Actions...');
    S.pendingExperimentId = r.data.experiment.id;
    scheduleTaskAdvance(taskId);
  }catch(e){ toast(e.message); refreshTaskDetail(taskId); }
}

/* ============ إرسال الرسائل ============ */
async function sendMessage() {
  const value = input.value.trim();
  if (!value) return;

  if (S.screen === 'task') { await steerSend(); return; }

  if (!S.currentChatId) S.currentChatId = 'ch'+Date.now();
  const chatId = S.currentChatId;
  S.messages.push({role: 'user', content: value});
  input.value = ''; updateSendBtn();
  S.messages.push({role:'agent', content:'', pending:true});
  render();

  try{
    if (S.mode === 'agent') {
      const r = await api({action:'plan_task', chatId, model:S.selectedModel, task:value});
      S.messages.pop();
      if(!r.ok) throw Error(r.data.error||'تعذر بناء الخطة');
      S.messages.push({role:'agent', content:`أنشأت خطة من ${r.data.plan.steps?.length||0} خطوة/خطوات. جارٍ فتح صفحة المهمة للمراجعة والاعتماد...`});
      render();
      await loadTaskIndex();
      setTimeout(()=>openTask(r.data.task.id), 500);
    } else {
      const history = S.messages.filter(m=>!m.pending).map(m=>({role:toBackendRole(m.role), content:m.content}));
      const r = await api({action:'chat', chatId, model:S.selectedModel, messages:history, attachments:S.pendingAttachments||[]});
      S.messages.pop();
      if(!r.ok||r.data.error) throw Error(r.data.error||'تعذر الاتصال');
      S.messages.push({role:'agent', content:r.data.response||'لا يوجد رد'});
      S.pendingAttachments=[];
      render();
      await loadTaskIndex();
    }
  }catch(e){
    S.messages = S.messages.filter(m=>!m.pending);
    S.messages.push({role:'agent', content:'تعذر إكمال الطلب: '+e.message});
    render();
  }
}

      <div class="file-card">${SVG.file}<div class="fc-info"><b>${esc(f.name)}</b><small>${esc(f.mime)} · ${Math.ceil(Number(f.size||0)/1024)}KB · ${f.storage==='github_release'?'GitHub Release':'D1'}</small></div>
      ${f.asset_id?`<button class="more-btn" onclick="downloadWorkspaceFile('${f.asset_id}','${esc(f.name)}')">${SVG.arrowUp}</button>`:''}
      </div>`).join('') : `<div class="empty-state" style="text-align:center;padding:60px 24px;"><div style="width:48px;height:48px;margin:0 auto 16px;opacity:.6;">${SVG.library}</div><h2>لا توجد ملفات</h2><p>ستظهر ملفاتك هنا</p></div>`);
  }catch(e){ toast(e.message); }
}
async function downloadWorkspaceFile(assetId, name){
  try{
    const token = localStorage.getItem('foxToken')||'';
    const r = await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'download_file', assetId, sessionToken:token})});
    if(!r.ok) throw Error('فشل التنزيل');
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ toast(e.message); }
}
function renderProjects() {
  contentArea.innerHTML = `<div class="recent-title">المشاريع</div><div class="empty-state" style="text-align:center;padding:60px 24px;"><div style="width:48px;height:48px;margin:0 auto 16px;opacity:.6;">${SVG.folder}</div><h2>لا توجد مشاريع</h2><p>هذه الميزة غير مرتبطة بخادم بعد</p></div>`;
}
function renderScheduled() {
  contentArea.innerHTML = `<div class="empty-state" style="text-align:center;padding:60px 24px;"><div style="width:48px;height:48px;margin:0 auto 16px;opacity:.6;">${SVG.clock}</div><h2>لا توجد مهام مجدولة</h2><p>هذه الميزة غير مرتبطة بخادم بعد</p></div>`;
}
function renderFavorites() {
  contentArea.innerHTML = `<div class="empty-state" style="text-align:center;padding:60px 24px;"><div style="width:48px;height:48px;margin:0 auto 16px;opacity:.6;">${SVG.star}</div><h2>لا توجد مفضلات</h2><p>أضف عناصر للمفضلة من القائمة الرئيسية</p></div>`;
}
async function renderSearch(){
  contentArea.innerHTML = `<div id="searchResults" style="margin-top:10px"><p style="text-align:center;color:var(--faint);margin-top:40px">اكتب للبحث في الرسائل والملفات والمحادثات</p></div>`;
  setTimeout(()=>$('searchInput')?.focus(), 100);
}
let searchTimer;
function runSearch(q){
  clearTimeout(searchTimer);
  if(q.trim().length<2){ $('searchResults').innerHTML = `<p style="text-align:center;color:var(--faint);margin-top:40px">اكتب حرفين على الأقل</p>`; return; }
  searchTimer = setTimeout(async()=>{
    try{
      const r = await api({action:'search_all', query:q, chatId:S.currentChatId||null});
      if(!r.ok) throw Error('تعذر البحث');
      const d=r.data;
      const rows = [
        ...(d.conversations||[]).map(c=>`<div class="search-result" onclick="openChat('${c.id}');closeSearch()"><b>${esc(c.title)}</b><small>محادثة</small></div>`),
        ...(d.messages||[]).map(m=>`<div class="search-result" onclick="openChat('${m.chat_id}');closeSearch()"><b>${esc(m.content).slice(0,70)}</b><small>رسالة</small></div>`),
        ...(d.files||[]).map(f=>`<div class="search-result" onclick="openChat('${f.chat_id}');closeSearch()"><b>${esc(f.name)}</b><small>ملف</small></div>`)
      ];
      $('searchResults').innerHTML = rows.length ? rows.join('') : `<p style="text-align:center;color:var(--faint);margin-top:40px">لا توجد نتائج</p>`;
    }catch(e){ toast(e.message); }
  }, 300);
}
function closeSearch(){ nav('home'); }

/* ============ العرض الرئيسي ============ */
function render() {
  renderTopNav();
  updateComposerVisibility();
  renderComposerIcons();
  
  switch (S.screen) {
    case 'home': renderHome(); break;
    case 'task': renderTaskDetail(); break;
    case 'chat': renderChat(); break;
    case 'settings': renderSettings(); break;
    case 'library': renderLibrary(); break;
    case 'projects': renderProjects(); break;
    case 'scheduled': renderScheduled(); break;
    case 'favorites': renderFavorites(); break;
    case 'search': renderSearch(); break;
  }
}

/* ============ الأحداث ============ */
function bindEvents() {
  sendBtn.addEventListener('click', sendMessage);
  micBtn.addEventListener('click', startVoiceInput);
  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', handleFileAttach);
  fab.innerHTML = SVG.plus;
  fab.addEventListener('click', newChat);
  input.addEventListener('input', updateSendBtn);
  input.addEventListener('keydown', (e) => { 
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } 
  });
  ddBackdrop.addEventListener('click', closeDropdown);
  $('modalBackdrop').addEventListener('click', closeModal);
}
function startVoiceInput(){
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Rec){ toast('الصوت غير مدعوم في هذا المتصفح'); return; }
  const r = new Rec(); r.lang='ar-SA';
  r.onresult = e => { input.value += (input.value?' ':'') + e.results[0][0].transcript; updateSendBtn(); };
  r.onerror = () => toast('تعذر التعرف على الصوت');
  r.start(); toast('استمع الآن...');
}
async function readDataUrl(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); }); }
async function handleFileAttach(e){
  const files = Array.from(e.target.files||[]);
  if(!files.length) return;
  S.pendingAttachments = S.pendingAttachments || [];
  for(const f of files){
    if(f.type.startsWith('image/') || f.type==='application/pdf' || !f.type.startsWith('text/')){
      S.pendingAttachments.push({name:f.name, mime:f.type||'application/octet-stream', size:f.size, data: await readDataUrl(f)});
    } else {
      const tx = (await f.text()).slice(0,12000);
      S.pendingAttachments.push({name:f.name, mime:f.type||'text/plain', size:f.size, text:tx});
    }
  }
  toast(`تم إرفاق ${files.length} ملف`);
  e.target.value = '';
}

/* ============ التشغيل ============ */
async function init() {
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.dataset.accent = S.accent;
  bindEvents();
  render();
  await loadModels();
  await loadTaskIndex();
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
