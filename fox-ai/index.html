<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOX// AI</title><style>
:root{--bg:#f7f7f5;--panel:#fff;--side:#efefec;--line:#deded8;--text:#20211f;--muted:#74756f;--accent:#bf654b;--soft:#f2dfd7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;display:flex}button,textarea,select,input{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#app{display:flex;width:100%;height:100%}aside{width:272px;background:var(--side);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:14px}.brand{display:flex;gap:10px;align-items:center;font-weight:750;font-size:17px}.mark{background:linear-gradient(135deg,#d47c60,#98462f);color:#fff;width:31px;height:31px;border-radius:10px 10px 10px 3px;display:grid;place-items:center;font-weight:900}.new{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:11px}.section{color:var(--muted);font-size:12px;padding:4px 8px}.chats{overflow:auto;flex:1}.chat{padding:10px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat.active,.chat:hover{background:var(--soft)}.side-actions{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:7px}.side-actions button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px;color:var(--text)}main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:12px}.top h1{font-size:15px;margin:0;flex:1}.top small{color:var(--muted)}.icon{border:0;background:transparent;color:var(--muted);font-size:18px;padding:8px;min-width:38px;min-height:38px;border-radius:8px}.icon:active{background:var(--soft)}.messages{flex:1;overflow:auto;padding:34px max(18px,calc((100% - 850px)/2));}.welcome{text-align:center;margin:15vh auto;color:var(--muted)}.welcome .mark{margin:auto auto 14px;font-size:20px}.msg{margin:0 0 28px;max-width:850px}.msg.user{margin-right:auto;max-width:680px}.bubble{line-height:1.8;white-space:pre-wrap}.user .bubble{background:#e9e8e2;border-radius:16px 16px 4px 16px;padding:11px 15px}.meta{font-size:11px;color:var(--muted);margin:6px 4px}.tool{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px;margin-top:12px;direction:rtl}.tool code{direction:ltr;display:block;background:#191a18;color:#eee;padding:12px;border-radius:7px;white-space:pre-wrap}.tool button{background:var(--accent);border:0;color:#fff;border-radius:7px;padding:8px 12px;margin-top:8px}.composer{padding:12px 18px 18px}.box{max-width:850px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:7px;display:flex;align-items:end;gap:7px}.box textarea{border:0;outline:0;resize:none;flex:1;background:transparent;min-height:42px;max-height:160px;padding:10px;line-height:1.6}.box select{border:0;background:transparent;color:var(--muted);max-width:145px;padding:8px}.send{border:0;border-radius:10px;background:var(--accent);color:white;width:38px;height:38px}.panel{position:fixed;left:18px;bottom:82px;width:310px;max-width:90vw;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 35px #0002;border-radius:12px;padding:15px;display:none;z-index:5}.panel.open{display:block}#toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(12px);background:#222;color:#fff;padding:10px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:30;font-size:13px}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.backdrop{display:none;position:fixed;inset:0;background:#0006;z-index:8}.backdrop.open{display:block}@media(max-width:720px){aside{position:fixed;display:flex;z-index:10;right:0;top:0;bottom:0;width:290px;transform:translateX(105%);transition:transform .22s ease;box-shadow:-8px 0 28px #0003}aside.open{transform:translateX(0)}.top{position:relative;z-index:2}.panel{left:5vw;bottom:75px;width:90vw}}.panel h3{margin:0 0 12px}.panel textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;padding:8px}.panel button{border:0;background:var(--accent);color:#fff;border-radius:7px;padding:8px 12px;margin-top:8px}@media(max-width:720px){aside{display:none}.top{padding:0 14px}.messages{padding:22px 14px}.composer{padding:10px}.box select{max-width:95px;font-size:11px}}
</style></head><body><div id="app"><div class="backdrop" id="backdrop"></div><div id="toast" role="status" aria-live="polite"></div><aside><div class="brand"><span class="mark">F</span><span>FOX// AI</span></div><button class="new" id="new">＋ محادثة جديدة</button><div class="section">المحادثات</div><div class="chats" id="chats"></div><div class="side-actions"><button id="memory">ذاكرة التسليم</button><button id="theme">تغيير المظهر</button><button id="logout">تسجيل الخروج</button></div></aside><main><header class="top"><button class="icon" id="menu">☰</button><h1 id="title">محادثة جديدة</h1><small id="status">جاهز</small><button class="icon" id="planBtn" title="تحويل المهمة إلى خطوات">☷</button><button class="icon" id="memoryTop">▣</button></header><section class="messages" id="messages"></section><div class="composer"><div class="box"><textarea id="input" placeholder="اكتب مهمتك هنا..."></textarea><select id="models"></select><button class="send" id="send">↑</button></div></div></main></div><div class="panel" id="memoryPanel"><h3>ملخص التسليم السياقي</h3><textarea id="memoryText"></textarea><button id="saveMemory">حفظ الملخص</button></div><script>
const API='https://fox1-ai.abdelrhym096290.workers.dev';let token=localStorage.foxToken||'', chats=JSON.parse(localStorage.foxChats||'[]'), current=localStorage.foxCurrent||'', generating=false, activeRun=null;
const $=id=>document.getElementById(id), messages=$('messages');
function toast(text){const t=$('toast');if(!t)return;t.textContent=text;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2200)}
if(!chats.length){current=Date.now().toString();chats=[{id:current,title:'محادثة جديدة',messages:[]}];save()}if(!chats.find(x=>x.id===current))current=chats[0].id;
function save(){localStorage.foxChats=JSON.stringify(chats);localStorage.foxCurrent=current}function chat(){return chats.find(x=>x.id===current)}
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,sessionToken:token})});const d=await r.json();if(r.status===401){token='';localStorage.removeItem('foxToken');throw Error('انتهت الجلسة')}if(!r.ok||d.error)throw Error(d.error||'تعذر الاتصال');return d}
async function login(){if(token){try{await api({action:'check_session'});return}catch{}}let p=window.prompt('كلمة مرور FOX// AI');if(!p)throw Error('يلزم تسجيل الدخول أولاً');const d=await api({action:'login',accessPassword:p});token=d.token;localStorage.foxToken=token}
function render(){const c=chat();$('title').textContent=c.title; $('chats').innerHTML=chats.map(x=>`<div class="chat ${x.id===current?'active':''}" data-id="${x.id}">${esc(x.title)}</div>`).join('');document.querySelectorAll('.chat').forEach(x=>x.onclick=()=>{current=x.dataset.id;save();render()});messages.innerHTML='';if(!c.messages.length){messages.innerHTML='<div class="welcome"><div class="mark">F</div><h2>كيف يمكنني مساعدتك؟</h2><p>وكيل شخصي يخطط، يتذكر، ويطلب موافقتك قبل التنفيذ.</p></div>';return}c.messages.forEach((m,i)=>{const d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'');d.innerHTML=`<div class="bubble">${m.role==='assistant'?md(m.content):esc(m.content)}</div><div class="meta">${m.role==='assistant'?'FOX// AI':'أنت'}</div>`;messages.appendChild(d)});messages.scrollTop=messages.scrollHeight}
function esc(s){return String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function md(s){return esc(s).replace(/```([\s\S]*?)```/g,'<pre>$1</pre>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
async function models(){try{const d=await api({action:'models'});$('models').innerHTML=d.models.map(x=>`<option value="${x.id}">${x.name} · ${x.company}</option>`).join('');$('models').value=localStorage.foxModel||d.models[0].id}catch(e){$('status').textContent=e.message}}
async function planTask(){const text=$('input').value.trim();if(!text)return;generating=true;$('status').textContent='يبني الخطة...';try{const d=await api({action:'plan_task',chatId:current,model:$('models').value,task:text});const p=d.plan;const c=chat();c.messages.push({role:'assistant',content:`خطة المهمة: ${p.goal}\n\n`+p.steps.map((x,i)=>`${i+1}. ${x.title}\n   ${x.description}\n   التحقق: ${x.verification}`).join('\n')});activeRun=p.id;save();render();const last=messages.lastElementChild;last.insertAdjacentHTML('beforeend',`<div class=\"tool\"><b>الخطة جاهزة — لا تنفيذ قبل موافقتك</b><br><button id=\"approveRun\">موافقة وتشغيل</button></div>`);$('approveRun').onclick=()=>approveRun(p.id);$('status').textContent=`${p.steps.length} خطوات — بانتظار الموافقة`}catch(e){alert(e.message)}generating=false}
async function approveRun(id){try{$('status').textContent='يشغّل الخطوة...';await api({action:'approve_plan',runId:id});let done=false;for(let i=0;i<12&&!done;i++){const d=await api({action:'advance_run',runId:id,model:$('models').value});const r=d.plan;const waiting=r.steps.find(x=>x.status==='awaiting_approval');if(waiting){$('status').textContent='بانتظار موافقة أداة';alert('تحتاج الخطوة موافقة على الأمر: '+waiting.command);break}done=r.status==='completed';if(!done)await new Promise(x=>setTimeout(x,300));}$('status').textContent=done?'اكتملت المهمة':'المهمة متوقفة للمراجعة'}catch(e){$('status').textContent='فشل التنفيذ';alert(e.message)}}
async function send(){if(generating)return;const text=$('input').value.trim();if(!text)return;const c=chat();c.messages.push({role:'user',content:text});if(c.title==='محادثة جديدة')c.title=text.slice(0,35);$('input').value='';save();render();generating=true;$('status').textContent='يفكر...';try{const d=await api({action:'chat',chatId:current,model:$('models').value,messages:c.messages});c.messages.push({role:'assistant',content:d.response});save();render();if(d.pendingExecution){const last=messages.lastElementChild;last.insertAdjacentHTML('beforeend',`<div class="tool"><b>اقتراح أداة — يتطلب موافقتك</b><code>${esc(d.pendingExecution.command)}</code><button onclick="alert('التنفيذ معزول حتى ربط خدمة الأدوات')">مراجعة التنفيذ</button></div>`)}$('status').textContent=d.model.name}catch(e){c.messages.push({role:'assistant',content:'حدث خطأ: '+e.message});save();render();$('status').textContent='خطأ'}generating=false}
async function loadMemory(){try{$('memoryText').value=(await api({action:'get_memory',chatId:current})).content||''}catch(e){$('memoryText').value=e.message}}
$('send').type='button';$('planBtn').type='button';$('memoryTop').type='button';$('send').addEventListener('click',e=>{e.preventDefault();send()});$('planBtn').addEventListener('click',e=>{e.preventDefault();toast('جاري إعداد خطة المهمة');planTask()});$('input').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}};$('new').type='button';$('new').addEventListener('click',()=>{current=Date.now().toString();chats.unshift({id:current,title:'محادثة جديدة',messages:[]});save();render();document.querySelector('aside').classList.remove('open');$('backdrop').classList.remove('open')});$('models').onchange=e=>localStorage.foxModel=e.target.value;$('memory').addEventListener('click',()=>{$('memoryPanel').classList.toggle('open');toast('ذاكرة التسليم');loadMemory()});$('memoryTop').addEventListener('click',()=>{$('memoryPanel').classList.toggle('open');toast('ذاكرة التسليم');loadMemory()});$('saveMemory').onclick=async()=>{await api({action:'memory_update',chatId:current,content:$('memoryText').value});$('saveMemory').textContent='تم الحفظ';setTimeout(()=>$('saveMemory').textContent='حفظ الملخص',1000)};$('theme').type='button';$('theme').addEventListener('click',()=>{document.body.classList.toggle('dark');document.querySelector('aside').classList.remove('open');$('backdrop').classList.remove('open')});$('logout').type='button';$('logout').addEventListener('click',()=>{token='';localStorage.removeItem('foxToken');location.reload()});$('menu').type='button';$('menu').addEventListener('click',e=>{e.preventDefault();toast('تم فتح القائمة');document.querySelector('aside').classList.toggle('open');$('backdrop').classList.toggle('open')});$('backdrop').addEventListener('click',e=>{e.preventDefault();document.querySelector('aside').classList.remove('open');$('backdrop').classList.remove('open')});(async()=>{try{await login();await models();render()}catch(e){alert(e.message)}})();
</script></body></html>
