<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FOX AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- الشريط الجانبي -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">🦊</span>
        <span class="logo-text">FOX AI</span>
      </div>
      <button id="close-sidebar" class="icon-btn" title="إغلاق">✕</button>
    </div>
    
    <button id="new-chat" class="new-chat-btn">
      <span>+</span> محادثة جديدة
    </button>
    
    <div class="sidebar-section">
      <div class="sidebar-label">المحادثات</div>
      <div id="chat-list"></div>
    </div>
    
    <div class="sidebar-footer">
      <button id="theme-toggle" class="theme-btn">
        <span id="theme-icon">🌙</span>
        <span id="theme-text">المظهر الداكن</span>
      </button>
    </div>
  </aside>
  
  <!-- المحتوى الرئيسي -->
  <main id="main">
    <!-- الرأس -->
    <header id="header">
      <button id="menu-btn" class="icon-btn" title="القائمة">☰</button>
      <div class="header-title">
        <span class="logo-icon">🦊</span>
        <span>FOX AI</span>
      </div>
      <div class="header-actions">
        <button id="clear-chat" class="icon-btn" title="مسح المحادثة">🗑️</button>
      </div>
    </header>
    
    <!-- منطقة الرسائل -->
    <div id="messages"></div>
    
    <!-- منطقة الإدخال -->
    <div id="input-area">
      <div id="input-container">
        <textarea id="user-input" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
        <button id="send-btn" title="إرسال">➤</button>
      </div>
      <div id="input-footer">
        FOX AI قد يرتكب أخطاء. تحقق من المعلومات المهمة.
      </div>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
