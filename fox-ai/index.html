<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOX AI</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: sans-serif;
  background: #0d0d1a;
  color: #e8e8f0;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

#sidebar {
  width: 250px;
  background: #16162b;
  border-left: 1px solid #2a2a45;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: margin 0.3s ease;
}
#sidebar.hidden {
  margin-right: -250px;
}
.sidebar-header {
  display: flex;
  align-items: center;
  padding: 15px;
  border-bottom: 1px solid #2a2a45;
  gap: 10px;
}
.new-chat-btn {
  margin: 12px;
  padding: 12px;
  background: #1e3a5f;
  border: none;
  border-radius: 20px;
  color: white;
  cursor: pointer;
  font-size: 14px;
}
.sidebar-label {
  font-size: 12px;
  color: #8888a0;
  padding: 10px 15px;
}
#chat-list {
  flex: 1;
  overflow-y: auto;
}
.chat-item {
  padding: 10px 15px;
  cursor: pointer;
  font-size: 13px;
  border-radius: 20px;
  margin: 4px 8px;
}
.chat-item:hover {
  background: #222240;
}
.chat-item.active {
  background: #1e3a5f;
}
.sidebar-footer {
  padding: 12px;
  border-top: 1px solid #2a2a45;
}
.theme-btn {
  width: 100%;
  padding: 10px;
  background: none;
  border: 1px solid #2a2a45;
  border-radius: 20px;
  color: #e8e8f0;
  cursor: pointer;
  font-size: 13px;
}

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}
#header {
  display: flex;
  align-items: center;
  padding: 15px;
  border-bottom: 1px solid #2a2a45;
  gap: 10px;
}
.menu-btn {
  background: none;
  border: none;
  color: #e8e8f0;
  font-size: 20px;
  cursor: pointer;
  padding: 8px;
  border-radius: 50%;
}
.menu-btn:hover {
  background: #222240;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.message {
  margin-bottom: 15px;
  padding: 12px 16px;
  border-radius: 20px;
  max-width: 80%;
  word-wrap: break-word;
  position: relative;
}
.message.user {
  background: #1e3a5f;
  margin-left: auto;
  border-top-left-radius: 5px;
}
.message.ai {
  background: #1a1a30;
  border: 1px solid #2a2a45;
  border-top-right-radius: 5px;
}

.download-btn {
  background: #2a2a45;
  border: none;
  border-radius: 8px;
  color: white;
  padding: 5px 10px;
  cursor: pointer;
  font-size: 11px;
  margin-top: 8px;
}

#input-area {
  display: flex;
  align-items: center;
  padding: 15px;
  border-top: 1px solid #2a2a45;
  gap: 10px;
}
#input-container {
  flex: 1;
  display: flex;
  align-items: center;
  background: #1a1a30;
  border: 1px solid #2a2a45;
  border-radius: 30px;
  padding: 5px;
}
#user-input {
  flex: 1;
  padding: 10px 15px;
  background: none;
  border: none;
  color: white;
  font-size: 14px;
  outline: none;
}
#send-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #4a9eff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
#send-btn:hover {
  background: #5aafff;
}
#send-btn:active {
  transform: scale(0.95);
}
#send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

body.light {
  background: #f5f5f7;
  color: #1a1a1a;
}
body.light #sidebar {
  background: #ffffff;
  border-color: #ddd;
}
body.light .message.ai {
  background: #ffffff;
  border-color: #ddd;
}
body.light .message.user {
  background: #d0e3ff;
}
body.light #input-container {
  background: #ffffff;
  border-color: #ddd;
}
body.light #user-input {
  color: #1a1a1a;
}
body.light .menu-btn {
  color: #1a1a1a;
}
body.light .menu-btn:hover {
  background: #e0e0e0;
}
body.light .theme-btn {
  color: #1a1a1a;
  border-color: #ddd;
}
body.light .new-chat-btn {
  color: #1a1a1a;
}
body.light .chat-item {
  color: #1a1a1a;
}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <span>🦊</span>
    <strong>FOX AI</strong>
  </div>
  
  <button class="new-chat-btn" id="new-chat-btn">+ محادثة جديدة</button>
  
  <div class="sidebar-label">المحادثات</div>
  <div id="chat-list"></div>
  
  <div class="sidebar-footer">
    <button class="theme-btn" id="theme-btn">🌙 تغيير المظهر</button>
  </div>
</div>

<div id="main">
  <div id="header">
    <button class="menu-btn" id="menu-btn">☰</button>
    <span>🦊</span>
    <strong>FOX AI</strong>
  </div>
  
  <div id="messages">
    <div class="message ai">مرحبًا! أنا FOX AI. كيف يمكنني مساعدتك؟</div>
  </div>
  
  <div id="input-area">
    <div id="input-container">
      <input type="text" id="user-input" placeholder="اكتب رسالتك هنا...">
      <button id="send-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const WORKER_URL = 'https://fox1-ai.abdelrhym096290.workers.dev';

const messagesEl = document.getElementById('messages');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const themeBtn = document.getElementById('theme-btn');
const chatList = document.getElementById('chat-list');
const sidebar = document.getElementById('sidebar');
const menuBtn = document.getElementById('menu-btn');
const newChatBtn = document.getElementById('new-chat-btn');

let darkMode = true;
let currentChatId = localStorage.getItem('fox-current-chat') || Date.now().toString();
let chats = JSON.parse(localStorage.getItem('fox-chats') || '[]');

menuBtn.addEventListener('click', function() {
  sidebar.classList.toggle('hidden');
});

themeBtn.addEventListener('click', function() {
  darkMode = !darkMode;
  
  if (darkMode) {
    document.body.classList.remove('light');
    themeBtn.textContent = '🌙 تغيير المظهر';
    localStorage.setItem('fox-theme', 'dark');
  } else {
    document.body.classList.add('light');
    themeBtn.textContent = '☀️ تغيير المظهر';
    localStorage.setItem('fox-theme', 'light');
  }
});

if (localStorage.getItem('fox-theme') === 'light') {
  darkMode = false;
  document.body.classList.add('light');
  themeBtn.textContent = '☀️ تغيير المظهر';
}

newChatBtn.addEventListener('click', function() {
  currentChatId = Date.now().toString();
  localStorage.setItem('fox-current-chat', currentChatId);
  
  chats.unshift({ id: currentChatId, title: 'محادثة جديدة' });
  localStorage.setItem('fox-chats', JSON.stringify(chats));
  
  messagesEl.innerHTML = '<div class="message ai">مرحبًا! أنا FOX AI. كيف يمكنني مساعدتك؟</div>';
  renderChatList();
  sidebar.classList.add('hidden');
});

function renderChatList() {
  chatList.innerHTML = '';
  
  chats.forEach(chat => {
    const div = document.createElement('div');
    div.className = 'chat-item ' + (chat.id === currentChatId ? 'active' : '');
    div.textContent = chat.title;
    div.addEventListener('click', function() {
      currentChatId = chat.id;
      localStorage.setItem('fox-current-chat', currentChatId);
      loadChatHistory();
      renderChatList();
      sidebar.classList.add('hidden');
    });
    chatList.appendChild(div);
  });
}

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  
  if (text.length > 500) {
    div.textContent = text.substring(0, 500) + '... (رسالة طويلة)';
    
    const downloadBtn = document.createElement('button');
    downloadBtn.className = 'download-btn';
    downloadBtn.textContent = '⬇️ تحميل الرسالة كاملة';
    downloadBtn.addEventListener('click', function() {
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'message.txt';
      a.click();
      URL.revokeObjectURL(url);
    });
    div.appendChild(downloadBtn);
  } else {
    div.textContent = text;
  }
  
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function loadChatHistory() {
  messagesEl.innerHTML = '<div class="message ai">... جارٍ التحميل ...</div>';
  
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'load',
        chatId: currentChatId
      })
    });
    
    const data = await response.json();
    
    if (data.messages && data.messages.length > 0) {
      messagesEl.innerHTML = '';
      data.messages.forEach(msg => addMessage(msg.content, msg.role));
    } else {
      messagesEl.innerHTML = '<div class="message ai">مرحبًا! أنا FOX AI. كيف يمكنني مساعدتك؟</div>';
    }
  } catch (error) {
    messagesEl.innerHTML = '<div class="message ai">مرحبًا! أنا FOX AI. كيف يمكنني مساعدتك؟</div>';
  }
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;
  
  addMessage(text, 'user');
  userInput.value = '';
  sendBtn.disabled = true;
  
  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'message ai';
  loadingDiv.textContent = '...';
  loadingDiv.id = 'loading-msg';
  messagesEl.appendChild(loadingDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'chat',
        chatId: currentChatId,
        messages: [{ role: 'user', content: text }]
      })
    });
    
    const data = await response.json();
    
    document.getElementById('loading-msg')?.remove();
    
    if (data.response) {
      addMessage(data.response, 'ai');
      
      const chat = chats.find(c => c.id === currentChatId);
      if (chat && chat.title === 'محادثة جديدة') {
        chat.title = text.substring(0, 30);
        localStorage.setItem('fox-chats', JSON.stringify(chats));
        renderChatList();
      }
    } else if (data.error) {
      addMessage('خطأ: ' + data.error, 'ai');
    }
  } catch (error) {
    document.getElementById('loading-msg')?.remove();
    addMessage('عذرًا، حدث خطأ في الاتصال.', 'ai');
  }
  
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', sendMessage);

userInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    sendMessage();
  }
});

renderChatList();
loadChatHistory();
</script>

</body>
</html>
