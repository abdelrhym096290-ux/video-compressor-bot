<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOX AI</title>
<style>
  :root{
    --bg:#FAF9F5; --sidebar-bg:#F5F4EE; --border:#E5E3DA;
    --text:#3D3929; --text-soft:#83827D; --accent:#CC785C; --accent-soft:#F0DFD5;
    --bubble-user:#F0EEE6; --bubble-ai:#FFFFFF; --input-bg:#FFFFFF;
  }
  body.dark{
    --bg:#262624; --sidebar-bg:#1F1E1D; --border:#3A3935;
    --text:#F5F4EF; --text-soft:#A8A79E; --accent:#CC785C; --accent-soft:#4A392F;
    --bubble-user:#33322E; --bubble-ai:#2A2A27; --input-bg:#2A2A27;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    background:var(--bg); color:var(--text); height:100vh; display:flex; overflow:hidden;
    transition:background .2s,color .2s;
  }
  #sidebar{
    width:260px; background:var(--sidebar-bg); border-left:1px solid var(--border);
    display:flex; flex-direction:column; flex-shrink:0; transition:margin .25s ease;
  }
  #sidebar.hidden{ margin-right:-260px; }
  .sidebar-header{ display:flex; align-items:center; gap:10px; padding:16px; }
  .logo-mark{
    width:26px;height:26px;border-radius:7px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;
  }
  .new-chat-btn{
    margin:4px 12px 12px; padding:10px 14px; background:var(--accent); border:none;
    border-radius:10px; color:#fff; cursor:pointer; font-size:14px; font-weight:500;
    display:flex; align-items:center; gap:8px; transition:opacity .15s;
  }
  .new-chat-btn:hover{ opacity:.9; }
  .sidebar-label{ font-size:12px; color:var(--text-soft); padding:8px 16px 4px; }
  #chat-list{ flex:1; overflow-y:auto; padding:0 8px; }
  .chat-item{
    padding:9px 12px; cursor:pointer; font-size:13.5px; border-radius:8px; margin:2px 0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text);
  }
  .chat-item:hover{ background:var(--accent-soft); }
  .chat-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:500; }
  .sidebar-footer{ padding:12px; border-top:1px solid var(--border); }
  .theme-btn{
    width:100%; padding:9px; background:none; border:1px solid var(--border);
    border-radius:10px; color:var(--text); cursor:pointer; font-size:13px;
  }
  .theme-btn:hover{ background:var(--accent-soft); }
  #main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #header{
    display:flex; align-items:center; padding:14px 18px; border-bottom:1px solid var(--border); gap:10px;
  }
  .menu-btn{
    background:none; border:none; color:var(--text); font-size:18px; cursor:pointer;
    padding:6px 8px; border-radius:8px; line-height:1;
  }
  .menu-btn:hover{ background:var(--accent-soft); }
  #header strong{ font-size:14.5px; }
  #messages{ flex:1; overflow-y:auto; padding:24px 18px; max-width:820px; width:100%; margin:0 auto; }
  .message{ margin-bottom:22px; max-width:88%; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1;} }
  .message.user{ margin-right:0; margin-left:auto; }
  .message.ai{ margin-left:0; margin-right:auto; max-width:100%; }
  .message-bubble{ padding:12px 16px; border-radius:18px; font-size:15px; line-height:1.75; white-space:pre-wrap; }
  .message.user .message-bubble{ background:var(--bubble-user); border-top-left-radius:6px; }
  .message.ai .message-bubble{ background:var(--bubble-ai); border:1px solid var(--border); padding:14px 18px; }
  #input-area{ padding:12px 18px 18px; }
  #input-container{
    max-width:820px; margin:0 auto; display:flex; align-items:flex-end; gap:6px;
    background:var(--input-bg); border:1px solid var(--border); border-radius:24px; padding:8px 8px 8px 8px;
  }
  #user-input{
    flex:1; padding:8px 12px; background:none; border:none; color:var(--text);
    font-size:15px; outline:none; resize:none; font-family:inherit; max-height:160px;
  }
  #send-btn{
    width:34px; height:34px; border-radius:50%; background:var(--accent); border:none;
    cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:opacity .15s;
  }
  #send-btn:hover{ opacity:.9; }
  #send-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .dots{ display:inline-flex; gap:4px; padding:4px 0; }
  .dots span{
    width:6px; height:6px; border-radius:50%; background:var(--text-soft);
    animation:blink 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2){ animation-delay:.15s; }
  .dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{opacity:.3;} 40%{opacity:1;} }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <div class="logo-mark">F</div>
    <strong>FOX AI</strong>
  </div>
  <button class="new-chat-btn" id="new-chat-btn">＋ محادثة جديدة</button>
  <div class="sidebar-label">المحادثات</div>
  <div id="chat-list"></div>
  <div class="sidebar-footer">
    <button class="theme-btn" id="theme-btn">تغيير المظهر</button>
  </div>
</div>

<div id="main">
  <div id="header">
    <button class="menu-btn" id="menu-btn">☰</button>
    <strong>FOX AI</strong>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <div id="input-container">
      <textarea id="user-input" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
      <button id="send-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const WORKER_URL = 'https://fox1-ai.abdelrhym096290.workers.dev';
const WELCOME = 'مرحبًا! أنا FOX AI. كيف يمكنني مساعدتك؟';

const messagesEl = document.getElementById('messages');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const themeBtn = document.getElementById('theme-btn');
const sidebar = document.getElementById('sidebar');
const menuBtn = document.getElementById('menu-btn');
const newChatBtn = document.getElementById('new-chat-btn');
const chatList = document.getElementById('chat-list');

// chats: [{ id, title, messages: [{role:'user'|'ai', content}] }]
let chats = JSON.parse(localStorage.getItem('fox-chats') || '[]');
let currentChatId = localStorage.getItem('fox-current-chat');

if (!chats.length) {
  const id = Date.now().toString();
  chats.unshift({ id, title: 'محادثة جديدة', messages: [] });
  currentChatId = id;
  saveChats();
} else if (!chats.find(c => c.id === currentChatId)) {
  currentChatId = chats[0].id;
}

function saveChats(){ localStorage.setItem('fox-chats', JSON.stringify(chats)); }
function setCurrent(id){ currentChatId = id; localStorage.setItem('fox-current-chat', id); }
function getCurrentChat(){ return chats.find(c => c.id === currentChatId); }

menuBtn.addEventListener('click', () => sidebar.classList.toggle('hidden'));

themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  localStorage.setItem('fox-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
});
if (localStorage.getItem('fox-theme') === 'dark') document.body.classList.add('dark');

newChatBtn.addEventListener('click', () => {
  const id = Date.now().toString();
  chats.unshift({ id, title: 'محادثة جديدة', messages: [] });
  setCurrent(id);
  saveChats();
  renderChatList();
  renderMessages();
  sidebar.classList.add('hidden');
});

function renderChatList(){
  chatList.innerHTML = '';
  chats.forEach(chat => {
    const div = document.createElement('div');
    div.className = 'chat-item ' + (chat.id === currentChatId ? 'active' : '');
    div.textContent = chat.title;
    div.addEventListener('click', () => {
      setCurrent(chat.id);
      renderChatList();
      renderMessages();
      sidebar.classList.add('hidden');
    });
    chatList.appendChild(div);
  });
}

function renderMessages(){
  const chat = getCurrentChat();
  messagesEl.innerHTML = '';
  if (!chat.messages.length){
    appendBubble(WELCOME, 'ai');
    return;
  }
  chat.messages.forEach(m => appendBubble(m.content, m.role));
}

function appendBubble(text, role){
  const msgDiv = document.createElement('div');
  msgDiv.className = 'message ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.textContent = text;
  msgDiv.appendChild(bubble);
  messagesEl.appendChild(msgDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return msgDiv;
}

function showTyping(){
  const msgDiv = document.createElement('div');
  msgDiv.className = 'message ai';
  msgDiv.id = 'typing-msg';
  msgDiv.innerHTML = '<div class="message-bubble"><span class="dots"><span></span><span></span><span></span></span></div>';
  messagesEl.appendChild(msgDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage(){
  const text = userInput.value.trim();
  if (!text) return;

  const chat = getCurrentChat();
  chat.messages.push({ role: 'user', content: text });
  if (chat.messages.length === 1) chat.title = text.slice(0, 40);
  saveChats();
  renderChatList();
  appendBubble(text, 'user');

  userInput.value = '';
  autoGrow();
  sendBtn.disabled = true;
  showTyping();

  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'chat',
        chatId: currentChatId,
        // send full history so the model has context, not just the last line
        messages: chat.messages.map(m => ({ role: m.role === 'user' ? 'user' : 'model', content: m.content }))
      })
    });

    let data;
    try { data = await response.json(); }
    catch { throw new Error('رد غير صالح من الخادم (status ' + response.status + ')'); }

    document.getElementById('typing-msg')?.remove();

    if (!response.ok || data.error) {
      throw new Error(data.error || ('خطأ HTTP ' + response.status));
    }

    const reply = data.response || 'لا يوجد رد';
    chat.messages.push({ role: 'ai', content: reply });
    saveChats();
    appendBubble(reply, 'ai');
  } catch (error) {
    document.getElementById('typing-msg')?.remove();
    // show the REAL error instead of swallowing it silently
    appendBubble('⚠️ خطأ في الاتصال بالخادم: ' + error.message, 'ai');
    console.error('FOX AI request failed:', error);
  }

  sendBtn.disabled = false;
}

function autoGrow(){
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('input', autoGrow);
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

renderChatList();
renderMessages();
</script>

</body>
</html>
