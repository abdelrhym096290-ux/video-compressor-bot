<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>FOX AI</title>
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;FOX AI&quot;,&quot;short_name&quot;:&quot;FOX AI&quot;,&quot;start_url&quot;:&quot;https://fox1-ai.abdelrhym096290.workers.dev&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%23FAF9F5&quot;,&quot;theme_color&quot;:&quot;%23CC785C&quot;}">
<meta name="theme-color" content="#CC785C">
<style>
  :root{
    --bg:#FAF9F5; --sidebar-bg:#F5F4EE; --border:#E5E3DA;
    --text:#3D3929; --text-soft:#83827D; --accent:#CC785C; --accent-soft:#F0DFD5;
    --bubble-user:#F0EEE6; --bubble-ai:#FFFFFF; --input-bg:#FFFFFF;
  }
  body.dark{
    --bg:#262624; --sidebar-bg:#1F1E1D; --border:#3A3935;
    --text:#F5F4EF; --text-soft:#A8A79E; --accent:#CC785C; --accent-soft:#4A392F;
    --bubble-user:#33322E; --bubble-ai:#2A2A27; --input-bg:#2A2A27;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    background:var(--bg); color:var(--text); display:flex; overflow:hidden;
    transition:background .2s,color .2s;
  }
  button{font-family:inherit;}
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;}
  #backdrop.show{opacity:1;pointer-events:auto;}
  #sidebar{
    position:fixed;top:0;right:0;height:100%;width:280px;max-width:82vw;
    background:var(--sidebar-bg);border-left:1px solid var(--border);
    display:flex;flex-direction:column;z-index:50;
    transform:translateX(100%);transition:transform .25s ease;
    box-shadow:-10px 0 30px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top);
  }
  #sidebar.open{transform:translateX(0);}
  .sidebar-header{display:flex;align-items:center;gap:10px;padding:16px;}
  .sidebar-header strong{font-size:15px;}
  .logo-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;}
  .new-chat-btn{margin:4px 12px 12px;padding:10px 14px;background:var(--accent);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;justify-content:center;}
  .sidebar-label{font-size:12px;color:var(--text-soft);padding:8px 16px 4px;}
  #chat-list{flex:1;overflow-y:auto;padding:0 8px;-webkit-overflow-scrolling:touch;}
  .chat-item{padding:9px 12px;cursor:pointer;font-size:13.5px;border-radius:8px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
  .chat-item:active{background:var(--accent-soft);}
  .chat-item.active{background:var(--accent-soft);color:var(--accent);font-weight:500;}
  .sidebar-footer{padding:12px;border-top:1px solid var(--border);padding-bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;}
  .theme-btn,.logout-btn{width:100%;padding:9px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;font-size:13px;}
  .logout-btn{border-color:#d33;color:#d33;}
  @media (min-width:860px){
    #backdrop{display:none;}
    #sidebar{position:relative;transform:none;box-shadow:none;max-width:none;width:270px;padding-top:0;}
  }

  #main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;}
  #header{display:flex;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0;position:sticky;top:0;z-index:30;background:var(--bg);}
  .icon-square-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:7px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-square-btn:active{background:var(--accent-soft);}
  #header strong{font-size:14.5px;flex:1;text-align:center;}
  .header-icon-btn{background:none;border:none;color:var(--text-soft);cursor:pointer;padding:7px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .2s;font-size:16px;}
  .header-icon-btn:hover{color:var(--accent);}
  .header-icon-btn.active{color:var(--accent);}

  #messages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 16px;max-width:820px;width:100%;margin:0 auto;min-width:0;}
  #messages.empty{display:flex;align-items:center;justify-content:center;}
  .empty-state{text-align:center;padding:24px;}
  .empty-logo{width:48px;height:48px;border-radius:13px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;margin:0 auto 16px;}
  .empty-state h2{font-size:19px;font-weight:600;margin-bottom:20px;}
  .suggestion-chips{display:flex;flex-direction:column;gap:8px;max-width:340px;margin:0 auto;}
  .chip{background:var(--bubble-ai);border:1px solid var(--border);border-radius:14px;padding:11px 14px;font-size:13.5px;color:var(--text);cursor:pointer;text-align:right;}

  .message{margin-bottom:28px;max-width:95%;min-width:0;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;}}
  .message.user{margin-right:0;margin-left:auto;max-width:75%;}
  .message.user .message-bubble{background:var(--bubble-user);border-radius:18px 18px 4px 18px;padding:10px 14px;white-space:pre-wrap;font-size:14.5px;line-height:1.6;overflow-wrap:anywhere;word-break:break-word;}
  .message.ai{margin-left:0;margin-right:auto;max-width:100%;}
  .message.ai .message-bubble{padding:4px 0;font-size:15px;line-height:1.75;overflow-wrap:anywhere;word-break:break-word;}
  .message-bubble p{margin:8px 0;}
  .message-bubble p:first-child{margin-top:0;}
  .message-bubble p:last-child{margin-bottom:0;}
  .message-bubble h1,.message-bubble h2,.message-bubble h3{margin:16px 0 8px;font-weight:600;line-height:1.4;}
  .message-bubble h1:first-child,.message-bubble h2:first-child,.message-bubble h3:first-child{margin-top:0;}
  .message-bubble h1{font-size:1.25em;}.message-bubble h2{font-size:1.15em;}.message-bubble h3{font-size:1.05em;}
  .message-bubble ul,.message-bubble ol{padding-inline-start:22px;margin:8px 0;}
  .message-bubble li{margin:4px 0;}
  .message-bubble a{color:var(--accent);}
  .message-bubble blockquote{border-right:3px solid var(--accent);padding:2px 14px;color:var(--text-soft);margin:10px 0;}
  .message-bubble code{background:var(--accent-soft);padding:2px 6px;border-radius:5px;font-size:.88em;font-family:"SF Mono",Consolas,Monaco,monospace;direction:ltr;unicode-bidi:embed;}
  .message-bubble pre code{background:none;padding:0;}
  .message-bubble img,.message-bubble pre{max-width:100%;}
  .message-bubble hr{border:none;border-top:1px solid var(--border);margin:14px 0;}

  .code-block{margin:12px 0;border-radius:10px;overflow:hidden;background:#1E1E1C;border:1px solid #000;}
  .code-block.terminal{background:#0D0D0D;}
  .code-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#161615;border-bottom:1px solid #2A2A28;direction:ltr;}
  .code-block.terminal .code-header{background:#1A1A1A;}
  .code-header-left{display:flex;align-items:center;gap:8px;}
  .term-dots{display:inline-flex;gap:6px;}
  .term-dots i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .term-dots i:nth-child(1){background:#FF5F57;}.term-dots i:nth-child(2){background:#FEBC2E;}.term-dots i:nth-child(3){background:#28C840;}
  .code-lang{font-size:12px;color:#9A9992;font-family:"SF Mono",Consolas,monospace;}
  .code-copy-btn{background:none;border:none;color:#9A9992;font-size:12px;cursor:pointer;padding:4px 8px;border-radius:6px;display:flex;align-items:center;gap:5px;}
  .code-copy-btn:active{background:#2A2A28;color:#fff;}
  .code-block pre{margin:0;padding:14px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .code-block pre code{color:#E8E6E1;font-family:"SF Mono",Consolas,Monaco,monospace;font-size:13px;line-height:1.6;direction:ltr;text-align:left;display:block;white-space:pre;}

  .msg-actions{display:flex;gap:1px;margin-top:6px;}
  .message.user .msg-actions{justify-content:flex-end;}
  .icon-btn{background:none;border:none;color:var(--text-soft);cursor:pointer;padding:5px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .icon-btn:active{background:var(--accent-soft);color:var(--text);}
  .icon-btn.active{color:var(--accent);}

  .execution-steps{margin:10px 0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bubble-ai);}
  .exec-step{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;transition:background .15s;}
  .exec-step:last-child{border-bottom:none;}
  .exec-step:active{background:var(--accent-soft);}
  .exec-step-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}
  .exec-step-icon.done{background:#28C840;color:#fff;}
  .exec-step-icon.running{background:var(--accent);color:#fff;animation:pulse 1.5s infinite;}
  .exec-step-icon.failed{background:#d33;color:#fff;}
  .exec-step-icon.pending{background:var(--border);color:var(--text-soft);}
  .exec-step-detail{display:none;padding:8px 14px;background:var(--sidebar-bg);font-size:12px;color:var(--text-soft);white-space:pre-wrap;font-family:"SF Mono",Consolas,monospace;direction:ltr;text-align:left;max-height:200px;overflow-y:auto;}
  .exec-step-detail.open{display:block;}

  .dots{display:inline-flex;gap:4px;padding:4px 2px;}
  .dots span{width:6px;height:6px;border-radius:50%;background:var(--text-soft);animation:blink 1.2s infinite ease-in-out;}
  .dots span:nth-child(2){animation-delay:.15s;}.dots span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.3;}40%{opacity:1;}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

  #input-area{padding:10px 14px calc(14px + env(safe-area-inset-bottom));flex-shrink:0;}
  #input-container{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:4px;background:var(--input-bg);border:1px solid var(--border);border-radius:20px;padding:4px 4px 4px 6px;min-width:0;}
  .model-select{background:none;color:var(--text-soft);border:none;font-size:11px;cursor:pointer;outline:none;font-family:inherit;max-width:110px;flex-shrink:0;padding:4px 2px;}
  .model-select:hover{color:var(--accent);}
  #user-input{flex:1;min-width:0;padding:8px 6px;background:none;border:none;color:var(--text);font-size:15px;outline:none;resize:none;font-family:inherit;max-height:160px;overflow-wrap:anywhere;line-height:1.5;}
  #send-btn{width:32px;height:32px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #send-btn:disabled{opacity:.4;cursor:not-allowed;}
  #send-btn.generating{background:var(--text-soft);}
  .input-action-btn{background:none;border:none;color:var(--text-soft);cursor:pointer;padding:6px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
  .input-action-btn:active{background:var(--accent-soft);color:var(--text);}
  .input-action-btn.recording{color:#d33;animation:pulse 1s infinite;}

  #lock-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
  .lock-box{background:var(--bubble-ai);border:1px solid var(--border);border-radius:16px;padding:24px 20px;width:300px;max-width:90vw;text-align:center;}
  .lock-box h2{font-size:17px;margin-bottom:16px;color:var(--text);}
  .lock-input{width:100%;padding:10px 14px;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:15px;outline:none;text-align:center;font-family:inherit;}
  .lock-input:focus{border-color:var(--accent);}
  .lock-btn{width:100%;margin-top:12px;padding:10px;background:var(--accent);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:14px;font-weight:500;}
  .lock-error{font-size:12.5px;color:#d33;margin-top:8px;display:none;}
  #file-input{display:none;}
  #file-preview{display:none;max-width:820px;margin:0 auto 8px;padding:8px;gap:8px;flex-wrap:wrap;}
  #file-preview.open{display:flex;}
  .preview-item{position:relative;}
  .preview-item img{max-width:80px;max-height:80px;border-radius:8px;border:1px solid var(--border);}
  .preview-item .remove-btn{position:absolute;top:-6px;left:-6px;background:#d33;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .scroll-btn{position:fixed;left:16px;bottom:100px;background:var(--accent);border:none;border-radius:50%;width:38px;height:38px;cursor:pointer;z-index:35;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);transition:opacity .2s;}
  .scroll-btn.down{bottom:52px;}
  .scroll-btn.hidden{opacity:0;pointer-events:none;}
  #usage-panel,#experiments-panel,#memory-panel{display:none;flex-shrink:0;border-top:1px solid var(--border);padding:12px 14px;background:var(--sidebar-bg);max-height:35vh;overflow-y:auto;}
  #usage-panel.open,#experiments-panel.open,#memory-panel.open{display:block;}
  .usage-content,.experiments-list{font-size:13px;color:var(--text);white-space:pre-wrap;line-height:1.7;}
  .memory-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .memory-header span{font-size:13px;font-weight:600;color:var(--text-soft);}
  #memory-content{width:100%;min-height:120px;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;resize:vertical;font-family:inherit;outline:none;}
  #memory-content:focus{border-color:var(--accent);}
  .memory-save-btn{margin-top:8px;padding:7px 16px;background:var(--accent);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:12.5px;font-weight:500;}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <div class="logo-mark" style="margin:0 auto 12px;width:32px;height:32px;font-size:16px;">🦊</div>
    <h2>أدخل كلمة المرور</h2>
    <input type="password" id="lock-input" class="lock-input" placeholder="••••••••" autocomplete="off">
    <button id="lock-btn" class="lock-btn" type="button">دخول</button>
    <div id="lock-error" class="lock-error">كلمة المرور غير صحيحة</div>
  </div>
</div>

<div id="backdrop"></div>
<div id="sidebar">
  <div class="sidebar-header"><div class="logo-mark">🦊</div><strong>FOX AI</strong></div>
  <button class="new-chat-btn" id="new-chat-btn" type="button">＋ محادثة جديدة</button>
  <div class="sidebar-label">المحادثات</div>
  <div id="chat-list"></div>
  <div class="sidebar-footer">
    <button class="theme-btn" id="theme-btn" type="button">تغيير المظهر</button>
    <button class="logout-btn" id="logout-btn" type="button">تسجيل خروج</button>
  </div>
</div>

<div id="main">
  <div id="header">
    <button class="icon-square-btn" id="menu-btn" type="button" aria-label="القائمة">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <strong>FOX AI</strong>
    <button class="header-icon-btn" id="experiments-toggle-btn" type="button" title="سجل التجارب">⏱</button>
    <button class="header-icon-btn" id="usage-toggle-btn" type="button" title="الاستهلاك">📊</button>
    <button class="header-icon-btn" id="memory-toggle-btn" type="button" title="ذاكرة المشروع">📝</button>
    <button class="icon-square-btn" id="header-new-btn" type="button" aria-label="محادثة جديدة">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
  </div>

  <div id="messages"></div>

  <div id="experiments-panel">
    <div class="memory-header"><span>سجل التجارب</span><button class="icon-square-btn" id="experiments-close-btn" type="button">✕</button></div>
    <div id="experiments-content" class="experiments-list">اضغط تحديث...</div>
    <button class="memory-save-btn" id="experiments-load-btn" type="button">تحديث</button>
  </div>

  <div id="usage-panel">
    <div class="memory-header"><span>استهلاك Workers AI</span><button class="icon-square-btn" id="usage-close-btn" type="button">✕</button></div>
    <div id="usage-content" class="usage-content">اضغط تحديث...</div>
    <button class="memory-save-btn" id="usage-load-btn" type="button">تحديث</button>
  </div>

  <div id="memory-panel">
    <div class="memory-header"><span>ذاكرة المشروع</span><button class="icon-square-btn" id="memory-close-btn" type="button">✕</button></div>
    <textarea id="memory-content" placeholder="لا توجد ذاكرة بعد..."></textarea>
    <button class="memory-save-btn" id="memory-save-btn" type="button">حفظ</button>
  </div>

  <div id="file-preview"></div>

  <div id="input-area">
    <div id="input-container">
      <button class="input-action-btn" id="mic-btn" type="button" title="إدخال صوتي">🎤</button>
      <button class="input-action-btn" id="file-btn" type="button" title="رفع ملف">📎</button>
      <textarea id="user-input" rows="1" placeholder="اكتب رسالة..." enterkeyhint="enter" autocomplete="off" autocorrect="on"></textarea>
      <select id="modelSelect" class="model-select" title="النموذج"></select>
      <button id="send-btn" type="button" title="إرسال"></button>
    </div>
  </div>
  <input type="file" id="file-input" multiple accept="image/*,.txt,.js,.py,.md,.json,.html,.css">
</div>

<button class="scroll-btn hidden" id="scroll-up-btn" type="button" title="أعلى">↑</button>
<button class="scroll-btn down hidden" id="scroll-down-btn" type="button" title="أسفل">↓</button>

<script>
'use strict';

const ICONS = {
  send:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
  stop:  '<svg width="13" height="13" viewBox="0 0 24 24" fill="white"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
  copy:  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  check: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  thumbUp: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h2.76a2 2 0 0 0 1.79-1.11L12 2h.5A2.5 2.5 0 0 1 15 4.5z"/></svg>',
  retry: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>',
  speaker: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>',
};
const TERMINAL_LANGS = ['bash','sh','shell','zsh','console','terminal','powershell','cmd','bat'];
const WORKER_URL = 'https://fox1-ai.abdelrhym096290.workers.dev';

// عناصر DOM
const messagesEl = document.getElementById('messages');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const themeBtn = document.getElementById('theme-btn');
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
const menuBtn = document.getElementById('menu-btn');
const newChatBtn = document.getElementById('new-chat-btn');

async function login(){
  const password = lockInput.value.trim();
  if (!password) return;
  lockBtn.textContent = '...';
  lockError.style.display = 'none';
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', accessPassword: password })
    });
    const data = await response.json();
    if (data.success && data.token) {
      sessionToken = data.token;
      localStorage.setItem('fox-session', sessionToken);
      lockScreen.style.display = 'none';
      lockInput.value = '';
    } else {
      lockError.textContent = data.error || 'كلمة المرور غير صحيحة';
      lockError.style.display = 'block';
      lockInput.focus();
    }
  } catch (error) {
    lockError.textContent = 'خطأ في الاتصال: ' + error.message;
    lockError.style.display = 'block';
  }
  lockBtn.textContent = 'دخول';
}

async function checkSession(){
  if (!sessionToken) { lockScreen.style.display = 'flex'; lockInput.focus(); return; }
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'check_session', sessionToken: sessionToken })
    });
    const data = await response.json();
    if (!data.valid) {
      localStorage.removeItem('fox-session');
      sessionToken = '';
      lockScreen.style.display = 'flex';
      lockInput.focus();
    } else {
      lockScreen.style.display = 'none';
    }
  } catch (error) { lockScreen.style.display = 'flex'; }
}

logoutBtn.addEventListener('click', async function(){

  }
  localStorage.removeItem('fox-session');
  sessionToken = '';

});

async function loadExperiments(){
  experimentsContent.textContent = 'جاري التحميل...';
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'get_experiments', sessionToken })
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    if (!data.experiments || !data.experiments.length) {
      experimentsContent.textContent = 'لا توجد تجارب بعد';
      return;
    }
    let html = '';
    data.experiments.forEach(function(exp){
      const date = new Date(exp.created_at).toLocaleString('ar');
      const statusLabel = exp.status === 'completed' ? '✓ نجحت' : exp.status === 'failed' ? '✕ فشلت' : exp.status;
      html += '• ' + statusLabel + ' | ' + (exp.command || '').substring(0, 100) + ' | ' + date + '\n';
      if (exp.output) html += '  ' + exp.output.substring(0, 80) + '\n';
      html += '\n';
    });
    experimentsContent.textContent = html;
  } catch (e) {
    experimentsContent.textContent = 'خطأ: ' + e.message;
  }
}

async function loadUsage(){
  usageContent.textContent = 'جاري التحميل...';
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'usage', sessionToken })
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    const totalTokens = data.totals?.totalTokens || 0;
    const DAILY = 10000;
    const used = Math.round(totalTokens * 0.2);
    const remaining = Math.max(0, DAILY - used);
    const pct = Math.min(100, used / DAILY * 100);
    usageContent.textContent =
      'الحصة اليومية: ' + DAILY.toLocaleString('ar') + ' Neuron\n' +
      'المستهلك تقريبًا: ' + used.toLocaleString('ar') + '\n' +
      'المتبقي: ' + remaining.toLocaleString('ar') + ' (' + (100 - pct).toFixed(1) + '%)\n\n' +
      'الطلبات اليوم: ' + (data.totals?.requests || 0) + '\n' +
      'إجمالي التوكنات: ' + totalTokens.toLocaleString('ar');
  } catch (e) {
    usageContent.textContent = 'خطأ: ' + e.message;
  }
}

micBtn.addEventListener('click', function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  if (!recognition) {
    recognition = new SR();
    recognition.lang = 'ar-SA';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = function(e){
      userInput.value = e.results[0][0].transcript;
      autoGrow();
      isRecording = false;
      micBtn.classList.remove('recording');
    };
    recognition.onend = function(){
      isRecording = false;
      micBtn.classList.remove('recording');
    };
    recognition.onerror = function(){
      isRecording = false;
      micBtn.classList.remove('recording');
    };
  }
  if (isRecording) {
    recognition.stop();
    isRecording = false;
    micBtn.classList.remove('recording');
  } else {
    recognition.start();
    isRecording = true;
    micBtn.classList.add('recording');
  }
});

fileBtn.addEventListener('click', function(){ fileInput.click(); });
fileInput.addEventListener('change', function(){
  const files = fileInput.files;
  if (!files.length) return;
  filePreview.innerHTML = '';
  filePreview.classList.add('open');
  pendingFiles = [];
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    pendingFiles.push(file);
    const item = document.createElement('div');
    item.className = 'preview-item';
    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = function(e){
        const img = document.createElement('img');
        img.src = e.target.result;
        item.insertBefore(img, item.firstChild);
      };
      reader.readAsDataURL(file);
    } else {
      const badge = document.createElement('div');
      badge.style.cssText = 'max-width:80px;padding:6px;font-size:10px;border:1px solid var(--border);border-radius:6px;background:var(--bubble-ai);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      badge.textContent = file.name.substring(0, 15);
      item.appendChild(badge);
    }
    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', function(){
      item.remove();
      pendingFiles = pendingFiles.filter(f => f !== file);
      if (!pendingFiles.length) filePreview.classList.remove('open');
    });
    item.appendChild(removeBtn);
    filePreview.appendChild(item);
  }
  fileInput.value = '';
});

    div.className = 'chat-item ' + (chat.id === currentChatId ? 'active' : '');

    div.addEventListener('click', function(){
      if (chat.id === currentChatId) {
        closeSidebar();

      if (isGenerating && currentController) currentController.abort();
      setCurrent(chat.id);
      renderChatList();
      renderMessages();
      closeSidebar();
      if (memoryPanel.classList.contains('open')) loadMemory();
    });
    chatList.appendChild(div);
  });
}

// ============ Markdown ============
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderMarkdown(raw){
  const blocks = [];
  let text = raw.replace(/```(\w*)\n?([\s\S]*?)```/g, function(m, lang, code){
    blocks.push({ lang: lang.trim(), code: code.replace(/\n$/,'') });
    return '\u0000CODEBLOCK' + (blocks.length - 1) + '\u0000';
  });
  text = escapeHtml(text);
  text = text.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  
  const lines = text.split('\n');
  let html = '';
  let listType = null;
  let paragraph = [];
  
  function flushParagraph(){
    if (paragraph.length) {
      html += '<p>' + paragraph.join('<br>') + '</p>';
      paragraph = [];
    }
  }
  function closeList(){
    if (listType) {
      html += '</' + listType + '>';
      listType = null;
    }
  }
  
  lines.forEach(function(line){
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    const ul = line.match(/^[-*]\s+(.*)$/);
    const ol = line.match(/^\d+\.\s+(.*)$/);
    const bq = line.match(/^&gt;\s?(.*)$/);
    const hr = /^-{3,}$/.test(line.trim());
    const isCode = /^\u0000CODEBLOCK\d+\u0000$/.test(line.trim());
    
    if (isCode) {
      flushParagraph();
      closeList();
      html += line.trim();
    } else if (h) {
      flushParagraph();
      closeList();
      html += '<h' + h[1].length + '>' + h[2] + '</h' + h[1].length + '>';
    } else if (ul) {
      flushParagraph();
      if (listType !== 'ul') {
        closeList();
        html += '<ul>';
        listType = 'ul';
      }
      html += '<li>' + ul[1] + '</li>';
    } else if (ol) {
      flushParagraph();
      if (listType !== 'ol') {
        closeList();
        html += '<ol>';
        listType = 'ol';
      }
      html += '<li>' + ol[1] + '</li>';
    } else if (bq) {
      flushParagraph();
      closeList();
      html += '<blockquote>' + bq[1] + '</blockquote>';
    } else if (hr) {
      flushParagraph();
      closeList();
      html += '<hr>';
    } else if (line.trim() === '') {
      flushParagraph();
      closeList();
    } else {
      closeList();
      paragraph.push(line);
    }
  });
  
  flushParagraph();
  closeList();
  
  html = html.replace(/\u0000CODEBLOCK(\d+)\u0000/g, function(m, i){
    const b = blocks[Number(i)];
    return '<pre><code class="language-' + (b.lang || 'text') + '">' + escapeHtml(b.code) + '</code></pre>';
  });
  
  return html;
}
function isTerminalLang(lang){
  return TERMINAL_LANGS.indexOf((lang || '').toLowerCase()) !== -1;
}
function enhanceCodeBlocks(container){
  container.querySelectorAll('pre > code').forEach(function(codeEl){
    const pre = codeEl.parentElement;
    const langMatch = Array.prototype.find.call(codeEl.classList, c => c.indexOf('language-') === 0);
    const lang = langMatch ? langMatch.replace('language-', '') : '';
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block' + (isTerminalLang(lang) ? ' terminal' : '');
    const header = document.createElement('div');
    header.className = 'code-header';
    const left = document.createElement('div');
    left.className = 'code-header-left';
    if (isTerminalLang(lang)) {
      left.innerHTML = '<span class="term-dots"><i></i><i></i><i></i></span><span class="code-lang">' + (lang || 'terminal') + '</span>';
    } else {
      left.innerHTML = '<span class="code-lang">' + (lang || 'text') + '</span>';
    }
    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'code-copy-btn';
    copyBtn.innerHTML = ICONS.copy + '<span>نسخ</span>';
    copyBtn.addEventListener('click', function(){
      navigator.clipboard.writeText(codeEl.textContent);
      copyBtn.innerHTML = ICONS.check + '<span>تم</span>';
      setTimeout(() => { copyBtn.innerHTML = ICONS.copy + '<span>نسخ</span>'; }, 1500);
    });
    header.appendChild(left);
    header.appendChild(copyBtn);
    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);
  });
}

// ============ خطوات التنفيذ ============
function renderExecutionSteps(steps, container){
  if (!steps || !steps.length) return;
  const wrapper = document.createElement('div');
  wrapper.className = 'execution-steps';
  steps.forEach(function(step){
    const row = document.createElement('div');
    row.className = 'exec-step';
    const icon = document.createElement('div');
    icon.className = 'exec-step-icon ' + step.status;
    icon.textContent = step.status === 'completed' ? '✓' : step.status === 'running' ? '...' : step.status === 'failed' ? '✕' : '•';
    const label = document.createElement('span');
    label.textContent = step.label;
    row.appendChild(icon);
    row.appendChild(label);
    if (step.detail) {
      const detail = document.createElement('div');
      detail.className = 'exec-step-detail';
      detail.textContent = step.detail;
      row.addEventListener('click', function(){
        detail.classList.toggle('open');
      });
      wrapper.appendChild(row);
      wrapper.appendChild(detail);
    } else {
      wrapper.appendChild(row);
    }
  });
  container.appendChild(wrapper);
}

function makeIconBtn(icon, title, onClick){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'icon-btn';
  btn.title = title;
  btn.innerHTML = icon;
  btn.addEventListener('click', onClick);
  return btn;
}

function appendBubble(text, role, index, chat, opts){
  opts = opts || {};
  const msgDiv = document.createElement('div');
  msgDiv.className = 'message ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  if (role === 'ai') {
    bubble.innerHTML = renderMarkdown(text);
    enhanceCodeBlocks(bubble);
  } else {
    bubble.textContent = text;
  }
  msgDiv.appendChild(bubble);
  if (opts.steps) renderExecutionSteps(opts.steps, msgDiv);
  if (!opts.ephemeral) {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    actions.appendChild(makeIconBtn(ICONS.copy, 'نسخ', function(){
      navigator.clipboard.writeText(text);
    }));
    if (role === 'ai') {
      actions.appendChild(makeIconBtn(ICONS.speaker, 'قراءة', function(){
        const clean = text.replace(/<[^>]*>/g, ' ').replace(/```[\s\S]*?```/g, ' ');
        const utterance = new SpeechSynthesisUtterance(clean);
        utterance.lang = 'ar-SA';
        speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
      }));
      const upBtn = makeIconBtn(ICONS.thumbUp, 'إعجاب', function(){
        upBtn.classList.toggle('active');
      });
      actions.appendChild(upBtn);
      if (index === chat.messages.length - 1) {
        actions.appendChild(makeIconBtn(ICONS.retry, 'إعادة', function(){
          regenerate(chat);
        }));
      }
    }
    msgDiv.appendChild(actions);
  }
  messagesEl.appendChild(msgDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return msgDiv;
}

function renderMessages(){
  const chat = getCurrentChat();
  messagesEl.innerHTML = '';
  if (!chat.messages.length) {
    renderEmptyState();
    return;
  }
  messagesEl.classList.remove('empty');
  chat.messages.forEach(function(m, i){
    appendBubble(m.content, m.role, i, chat);
  });
}

function renderEmptyState(){
  messagesEl.classList.add('empty');
  const wrap = document.createElement('div');
  wrap.className = 'empty-state';
  wrap.innerHTML = '<div class="empty-logo">🦊</div><h2>مرحبًا، كيف يمكنني مساعدتك؟</h2><div class="suggestion-chips">' +
    '<button class="chip">اشرح لي مفهومًا معقدًا</button>' +
    '<button class="chip">ساعدني في تصحيح كود</button>' +
    '<button class="chip">اكتب لي بريدًا احترافيًا</button></div>';
  wrap.querySelectorAll('.chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      userInput.value = chip.textContent;
      autoGrow();
      userInput.focus();
    });
  });
  messagesEl.appendChild(wrap);
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typing-msg';
  div.innerHTML = '<div class="message-bubble"><span class="dots"><span></span><span></span><span></span></span></div>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setGeneratingUI(active){
  isGenerating = active;
  sendBtn.classList.toggle('generating', active);
  sendBtn.innerHTML = active ? ICONS.stop : ICONS.send;
}
setGeneratingUI(false);

function requestAIResponse(chat){
  setGeneratingUI(true);
  currentController = new AbortController();
  showTyping();
  return fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'chat',
      chatId: currentChatId,
      provider: getSelectedProvider(),
      messages: chat.messages.map(function(m){
        return { role: m.role === 'user' ? 'user' : 'model', content: m.content };
      }),
      sessionToken: sessionToken
    }),
    signal: currentController.signal
  }).then(function(response){
    return response.json().catch(function(){
      throw new Error('رد غير صالح من الخادم');
    }).then(function(data){
      const typingEl = document.getElementById('typing-msg');
      if (typingEl) typingEl.remove();
      if (!response.ok || data.error) throw new Error(data.error || 'خطأ HTTP');
      const reply = data.response || 'لا يوجد رد';
      chat.messages.push({ role: 'ai', content: reply });
      saveChats();
      appendBubble(reply, 'ai', chat.messages.length - 1, chat, { steps: data.steps });
      renderChatList();
      if (data.memory && memoryPanel.classList.contains('open')) {
        memoryContent.value = data.memory;
      }
    });
  }).catch(function(error){
    const typingEl = document.getElementById('typing-msg');
    if (typingEl) typingEl.remove();
    if (error.name !== 'AbortError') {
      appendBubble('⚠️ ' + error.message, 'ai', -1, chat, { ephemeral: true });
    }
  }).then(function(){
    setGeneratingUI(false);
  });
}

function regenerate(chat){
  if (isGenerating) return;
  const last = chat.messages.length - 1;
  if (!chat.messages[last] || chat.messages[last].role !== 'ai') return;
  chat.messages.splice(last, 1);
  saveChats();
  renderMessages();
  requestAIResponse(chat);
}

function sendMessage(){
  const text = userInput.value.trim();
  if (!text || isGenerating) return;
  const chat = getCurrentChat();
  let finalText = text;
  if (pendingFiles.length) {
    finalText += '\n\n[مرفقات: ' + pendingFiles.map(function(f){ return f.name; }).join(', ') + ']';
  }
  chat.messages.push({ role: 'user', content: finalText });
  if (chat.messages.length === 1) {
    chat.title = text.slice(0, 40);
  }
  saveChats();
  renderChatList();
  if (messagesEl.classList.contains('empty')) {
    messagesEl.innerHTML = '';
    messagesEl.classList.remove('empty');
  }
  appendBubble(finalText, 'user', chat.messages.length - 1, chat);
  userInput.value = '';
  autoGrow();
  pendingFiles = [];
  filePreview.innerHTML = '';
  filePreview.classList.remove('open');
  requestAIResponse(chat);
}

// ============ أزرار التمرير ============
scrollUpBtn.addEventListener('click', function(){
  messagesEl.scrollTo({ top: 0, behavior: 'smooth' });
});
scrollDownBtn.addEventListener('click', function(){
  messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
});
messagesEl.addEventListener('scroll', function(){
  const atTop = messagesEl.scrollTop < 50;
  const atBottom = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 50;
  scrollUpBtn.classList.toggle('hidden', atTop);
  scrollDownBtn.classList.toggle('hidden', atBottom);
});

// ============ التهيئة ============
initModelSelect();
renderChatList();
renderMessages();
</script>
</body>
</html>
