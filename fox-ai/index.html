<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>FOX AI</title>
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;FOX AI&quot;,&quot;short_name&quot;:&quot;FOX AI&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%23FAF9F5&quot;,&quot;theme_color&quot;:&quot;%23CC785C&quot;}">
<meta name="theme-color" content="#CC785C">
<style>
  :root{
    --bg:#FAF9F5; --sidebar-bg:#F5F4EE; --border:#E5E3DA;
    --text:#3D3929; --text-soft:#83827D; --accent:#CC785C; --accent-soft:#F0DFD5;
    --bubble-user:#F0EEE6; --bubble-ai:#FFFFFF; --input-bg:#FFFFFF; --sheet-bg:#FFFFFF;
    --danger:#C0362C; --success:#2E9E4F;
  }
  body.dark{
    --bg:#262624; --sidebar-bg:#1F1E1D; --border:#3A3935;
    --text:#F5F4EF; --text-soft:#A8A79E; --accent:#CC785C; --accent-soft:#4A392F;
    --bubble-user:#33322E; --bubble-ai:#2A2A27; --input-bg:#2A2A27; --sheet-bg:#1F1E1D;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden;}
  button{font-family:inherit;}
  .fox-mark{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .fox-mark svg{display:block;}

  /* ---------- lock screen ---------- */
  #lock-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
  .lock-box{background:var(--bubble-ai);border:1px solid var(--border);border-radius:16px;padding:28px 22px;width:300px;max-width:90vw;text-align:center;}
  .lock-box .fox-mark{width:40px;height:40px;margin:0 auto 14px;}
  .lock-box h2{font-size:16.5px;margin-bottom:16px;font-weight:600;}
  .lock-input{width:100%;padding:11px 14px;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:15px;outline:none;text-align:center;font-family:inherit;}
  .lock-input:focus{border-color:var(--accent);}
  .lock-btn{width:100%;margin-top:12px;padding:10px;background:var(--accent);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:14px;font-weight:500;}
  .lock-error{font-size:12.5px;color:var(--danger);margin-top:8px;display:none;}

  /* ---------- overlays ---------- */
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;}
  #backdrop.show{opacity:1;pointer-events:auto;}

  /* ---------- sidebar ---------- */
  #sidebar{position:fixed;top:0;right:0;height:100%;width:280px;max-width:82vw;background:var(--sidebar-bg);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:50;transform:translateX(100%);transition:transform .25s ease;box-shadow:-10px 0 30px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top);}
  #sidebar.open{transform:translateX(0);}
  .sidebar-header{display:flex;align-items:center;gap:10px;padding:16px;}
  .sidebar-header strong{font-size:15px;}
  .new-chat-btn{margin:4px 12px 12px;padding:10px 14px;background:var(--accent);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;justify-content:center;}
  .sidebar-label{font-size:12px;color:var(--text-soft);padding:8px 16px 4px;}
  #chat-list{flex:1;overflow-y:auto;padding:0 8px;-webkit-overflow-scrolling:touch;}
  .chat-item{padding:9px 12px;cursor:pointer;font-size:13.5px;border-radius:8px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
  .chat-item:active{background:var(--accent-soft);}
  .chat-item.active{background:var(--accent-soft);color:var(--accent);font-weight:500;}
  .sidebar-footer{padding:10px;border-top:1px solid var(--border);padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;}
  .footer-btn{padding:9px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .footer-btn:active{background:var(--accent-soft);}
  .footer-btn.danger{color:var(--danger);border-color:var(--danger);}
  @media (min-width:860px){#backdrop{display:none;}#sidebar{position:relative;transform:none;box-shadow:none;max-width:none;width:270px;padding-top:0;}}

  /* ---------- main / header ---------- */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;}
  #header{display:flex;align-items:center;padding:calc(9px + env(safe-area-inset-top)) 8px 9px;gap:2px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:30;background:var(--bg);}
  .icon-square-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:8px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-square-btn:active{background:var(--accent-soft);}
  .icon-square-btn.active{color:var(--accent);}
  .model-pill{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:7px 10px;border-radius:20px;background:none;border:none;cursor:pointer;color:var(--text);font-size:13px;font-weight:500;max-width:56%;margin:0 auto;}
  .model-pill:active{background:var(--accent-soft);}
  .model-pill .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .model-pill .badge{flex-shrink:0;}
  .model-pill svg.chev{flex-shrink:0;color:var(--text-soft);}

  .tools-popover{position:absolute;left:8px;top:calc(100% + 4px);z-index:60;background:var(--sheet-bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);overflow:hidden;min-width:180px;display:none;}
  .tools-popover.open{display:block;}
  .tools-popover button{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:11px 14px;background:none;border:none;color:var(--text);font-size:13.5px;cursor:pointer;}
  .tools-popover button:active{background:var(--accent-soft);}

  /* ---------- messages ---------- */
  #messages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 16px;max-width:820px;width:100%;margin:0 auto;min-width:0;}
  #messages.empty{display:flex;align-items:center;justify-content:center;}
  .empty-state{text-align:center;padding:24px;}
  .empty-state .fox-mark{width:50px;height:50px;margin:0 auto 16px;}
  .empty-state h2{font-size:19px;font-weight:600;margin-bottom:20px;}
  .suggestion-chips{display:flex;flex-direction:column;gap:8px;max-width:340px;margin:0 auto;}
  .chip{background:var(--bubble-ai);border:1px solid var(--border);border-radius:14px;padding:11px 14px;font-size:13.5px;color:var(--text);cursor:pointer;text-align:right;}

  .message{margin-bottom:26px;max-width:92%;min-width:0;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;}}
  .message.user{margin-right:0;margin-left:auto;max-width:78%;}
  .message.user .message-bubble{background:var(--bubble-user);border-radius:18px 18px 4px 18px;padding:11px 15px;white-space:pre-wrap;font-size:14.5px;line-height:1.65;overflow-wrap:anywhere;word-break:break-word;}
  .message.ai{margin-left:0;margin-right:auto;max-width:100%;}
  .message.ai .message-bubble{padding:2px 0;font-size:15px;line-height:1.75;overflow-wrap:anywhere;word-break:break-word;}

  .message-bubble p{margin:8px 0;}
  .message-bubble p:first-child{margin-top:0;}.message-bubble p:last-child{margin-bottom:0;}
  .message-bubble h1,.message-bubble h2,.message-bubble h3{margin:16px 0 8px;font-weight:600;line-height:1.4;}
  .message-bubble h1:first-child,.message-bubble h2:first-child,.message-bubble h3:first-child{margin-top:0;}
  .message-bubble h1{font-size:1.25em;}.message-bubble h2{font-size:1.15em;}.message-bubble h3{font-size:1.05em;}
  .message-bubble ul,.message-bubble ol{padding-inline-start:22px;margin:8px 0;}
  .message-bubble li{margin:4px 0;}
  .message-bubble a{color:var(--accent);}
  .message-bubble blockquote{border-right:3px solid var(--accent);padding:2px 14px;color:var(--text-soft);margin:10px 0;}
  .message-bubble code{background:var(--accent-soft);padding:2px 6px;border-radius:5px;font-size:.88em;font-family:"SF Mono",Consolas,Monaco,monospace;direction:ltr;unicode-bidi:embed;}
  .message-bubble pre code{background:none;padding:0;}
  .message-bubble img,.message-bubble pre{max-width:100%;}
  .message-bubble hr{border:none;border-top:1px solid var(--border);margin:14px 0;}

  .code-block{margin:12px 0;border-radius:10px;overflow:hidden;background:#1E1E1C;border:1px solid #000;}
  .code-block.terminal{background:#0D0D0D;}
  .code-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#161615;border-bottom:1px solid #2A2A28;direction:ltr;}
  .code-block.terminal .code-header{background:#1A1A1A;}
  .code-header-left{display:flex;align-items:center;gap:8px;}
  .term-dots{display:inline-flex;gap:6px;}
  .term-dots i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .term-dots i:nth-child(1){background:#FF5F57;}.term-dots i:nth-child(2){background:#FEBC2E;}.term-dots i:nth-child(3){background:#28C840;}
  .code-lang{font-size:12px;color:#9A9992;font-family:"SF Mono",Consolas,monospace;}
  .code-copy-btn{background:none;border:none;color:#9A9992;font-size:12px;cursor:pointer;padding:4px 8px;border-radius:6px;display:flex;align-items:center;gap:5px;}
  .code-copy-btn:active{background:#2A2A28;color:#fff;}
  .code-block pre{margin:0;padding:14px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .code-block pre code{color:#E8E6E1;font-family:"SF Mono",Consolas,Monaco,monospace;font-size:13px;line-height:1.6;direction:ltr;text-align:left;display:block;white-space:pre;}

  .msg-actions{display:flex;gap:1px;margin-top:6px;}
  .message.user .msg-actions{justify-content:flex-end;}
  .icon-btn{background:none;border:none;color:var(--text-soft);cursor:pointer;padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .icon-btn:active{background:var(--accent-soft);color:var(--text);}
  .icon-btn.active{color:var(--accent);}

  .dots{display:inline-flex;gap:4px;padding:4px 2px;}
  .dots span{width:6px;height:6px;border-radius:50%;background:var(--text-soft);animation:blink 1.2s infinite ease-in-out;}
  .dots span:nth-child(2){animation-delay:.15s;}.dots span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.3;}40%{opacity:1;}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}

  /* ---------- execution proposal / steps ---------- */
  .exec-card{margin:12px 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bubble-ai);}
  .exec-card-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--accent-soft);font-size:13px;font-weight:600;color:var(--text);}
  .exec-card-body{padding:12px 14px;}
  .exec-actions{display:flex;gap:8px;margin-top:4px;}
  .exec-btn{flex:1;padding:9px;border-radius:9px;border:1px solid var(--border);background:none;color:var(--text);font-size:13px;cursor:pointer;}
  .exec-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;}
  .exec-btn.primary:disabled{opacity:.5;}
  .exec-steps{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .exec-step{display:flex;align-items:flex-start;gap:8px;font-size:13px;}
  .exec-step-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
  .exec-step-icon.done{background:var(--success);color:#fff;}
  .exec-step-icon.running{background:var(--accent);color:#fff;animation:pulse 1.4s infinite;}
  .exec-step-icon.failed{background:var(--danger);color:#fff;}
  .exec-step-icon.pending{background:var(--border);color:var(--text-soft);}
  .exec-step-label{flex:1;padding-top:1px;}
  .exec-output{margin-top:8px;padding:10px 12px;background:#1E1E1C;border-radius:8px;color:#E8E6E1;font-family:"SF Mono",Consolas,monospace;font-size:12px;white-space:pre-wrap;direction:ltr;text-align:left;max-height:220px;overflow-y:auto;}
  .exec-edit-box{width:100%;margin-top:10px;padding:10px;border:1px solid var(--accent);border-radius:8px;background:#1E1E1C;color:#E8E6E1;font-family:"SF Mono",Consolas,monospace;font-size:12.5px;direction:ltr;text-align:left;resize:vertical;min-height:70px;}

  /* ---------- input ---------- */
  #file-preview{display:none;max-width:820px;margin:0 auto 8px;padding:0 16px;gap:8px;flex-wrap:wrap;}
  #file-preview.open{display:flex;}
  .preview-item{position:relative;}
  .preview-item img{max-width:70px;max-height:70px;border-radius:8px;border:1px solid var(--border);display:block;}
  .preview-item .file-badge{max-width:70px;padding:8px 6px;font-size:10px;border:1px solid var(--border);border-radius:8px;background:var(--bubble-ai);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .preview-item .remove-btn{position:absolute;top:-6px;left:-6px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}

  #input-area{padding:8px 14px calc(12px + env(safe-area-inset-bottom));flex-shrink:0;}
  #input-container{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:2px;background:var(--input-bg);border:1px solid var(--border);border-radius:22px;padding:5px 5px 5px 7px;min-width:0;}
  #user-input{flex:1;min-width:0;padding:8px 6px;background:none;border:none;color:var(--text);font-size:16px;outline:none;resize:none;font-family:inherit;max-height:160px;overflow-wrap:anywhere;line-height:1.5;}
  #send-btn{width:33px;height:33px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #send-btn:disabled{opacity:.4;cursor:not-allowed;}
  #send-btn.generating{background:var(--text-soft);}
  .input-action-btn{background:none;border:none;color:var(--text-soft);cursor:pointer;width:33px;height:33px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .input-action-btn:active{background:var(--accent-soft);color:var(--text);}
  .input-action-btn.recording{color:var(--danger);animation:pulse 1s infinite;}
  #file-input{display:none;}

  .scroll-btn{position:fixed;left:16px;bottom:96px;background:var(--accent);border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;z-index:35;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);transition:opacity .2s;}
  .scroll-btn.hidden{opacity:0;pointer-events:none;}

  /* ---------- sheets (model picker + generic tool sheet) ---------- */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:70;}
  .sheet-backdrop.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:84vh;background:var(--sheet-bg);border-radius:20px 20px 0 0;z-index:71;transform:translateY(100%);transition:transform .25s ease;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);}
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:10px auto 4px;}
  .sheet-title{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;padding:6px 16px 12px;border-bottom:1px solid var(--border);}
  .sheet-body{overflow-y:auto;padding:8px 12px 20px;-webkit-overflow-scrolling:touch;}

  .model-group-label{display:flex;align-items:center;gap:8px;padding:14px 8px 6px;font-size:12.5px;font-weight:600;color:var(--text-soft);}
  .model-row{display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:12px;cursor:pointer;}
  .model-row:active{background:var(--accent-soft);}
  .model-row.selected{background:var(--accent-soft);}
  .model-row .badge{flex-shrink:0;}
  .model-row .info{flex:1;min-width:0;}
  .model-row .info .mname{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;}
  .model-row .info .mdesc{font-size:11.5px;color:var(--text-soft);margin-top:2px;line-height:1.5;}
  .power-dots{display:inline-flex;gap:2px;flex-shrink:0;}
  .power-dots i{width:5px;height:5px;border-radius:50%;background:var(--border);display:inline-block;}
  .power-dots i.filled{background:var(--accent);}
  .via-tag{font-size:10px;color:var(--text-soft);background:var(--sidebar-bg);border:1px solid var(--border);padding:2px 6px;border-radius:6px;display:inline-flex;align-items:center;gap:3px;margin-top:4px;}
  .model-row .check{color:var(--accent);flex-shrink:0;}

  .tool-textarea{width:100%;min-height:220px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:13.5px;font-family:"SF Mono",Consolas,monospace;resize:vertical;direction:rtl;}
  .tool-save-btn{margin-top:10px;width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer;}
  .tool-refresh-btn{margin-top:10px;width:100%;padding:10px;background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;font-size:13px;cursor:pointer;}
  .tool-list-item{padding:10px 4px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.6;}
  .tool-list-item:last-child{border-bottom:none;}
  .tool-list-item .tli-top{display:flex;justify-content:space-between;gap:8px;color:var(--text-soft);font-size:11.5px;}
  .tool-list-item .tli-cmd{font-family:"SF Mono",Consolas,monospace;direction:ltr;text-align:left;margin-top:4px;font-size:12px;}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <div class="fox-mark" data-fox="40"></div>
    <h2>أدخل كلمة المرور</h2>
    <input type="password" id="lock-input" class="lock-input" placeholder="••••••••" autocomplete="off">
    <button id="lock-btn" class="lock-btn" type="button">دخول</button>
    <div id="lock-error" class="lock-error"></div>
  </div>
</div>

<div id="backdrop"></div>
<div id="sidebar">
  <div class="sidebar-header"><span class="fox-mark" style="width:24px;height:24px;" data-fox="18"></span><strong>FOX AI</strong></div>
  <button class="new-chat-btn" id="new-chat-btn" type="button">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    محادثة جديدة
  </button>
  <div class="sidebar-label">المحادثات</div>
  <div id="chat-list"></div>
  <div class="sidebar-footer">
    <button class="footer-btn" id="theme-btn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      تغيير المظهر
    </button>
    <button class="footer-btn danger" id="logout-btn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      تسجيل خروج
    </button>
  </div>
</div>

<div id="main">
  <div id="header">
    <button class="icon-square-btn" id="menu-btn" type="button" aria-label="القائمة">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <button class="model-pill" id="model-pill-btn" type="button">
      <span class="badge" id="model-pill-icon" style="width:16px;height:16px;"></span>
      <span class="name" id="model-pill-name">اختر نموذجًا</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div style="position:relative;">
      <button class="icon-square-btn" id="tools-btn" type="button" aria-label="أدوات">

/* ============================================================

   ============================================================ */
lockBtn.addEventListener('click', login);

async function login(){
  const password = lockInput.value.trim();
  if (!password) return;
  lockBtn.textContent = '...'; lockError.style.display = 'none';
  try {
    const response = await fetch(WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'login', accessPassword: password }) });
    const data = await response.json();
    if (data.success && data.token) {
      sessionToken = data.token;
      localStorage.setItem('fox-session', sessionToken);
      lockScreen.style.display = 'none';
      lockInput.value = '';
    } else {
      lockError.textContent = data.error || 'كلمة المرور غير صحيحة';
      lockError.style.display = 'block';
      lockInput.focus();
    }
  } catch (error) {
    lockError.textContent = 'خطأ في الاتصال: ' + error.message;
    lockError.style.display = 'block';
  }
  lockBtn.textContent = 'دخول';
}

async function checkSession(){
  if (!sessionToken) { lockScreen.style.display = 'flex'; lockInput.focus(); return; }
  try {
    const response = await fetch(WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'check_session', sessionToken }) });
    const data = await response.json();
    if (!data.valid) { localStorage.removeItem('fox-session'); sessionToken = ''; lockScreen.style.display = 'flex'; lockInput.focus(); }
    else { lockScreen.style.display = 'none'; }
  } catch (error) { lockScreen.style.display = 'flex'; }
}

logoutBtn.addEventListener('click', async function(){
  if (sessionToken) await fetch(WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'logout', sessionToken }) }).catch(function(){});
  localStorage.removeItem('fox-session'); sessionToken = '';
  lockScreen.style.display = 'flex'; lockInput.focus();
  closeSidebar();
});

if (sessionToken) checkSession(); else { lockScreen.style.display = 'flex'; lockInput.focus(); }

function findModel(id){ return ALL_MODELS.find(function(m){ return m.id === id; }) || ALL_MODELS[0]; }

function powerDots(power){
  let html = '<span class="power-dots">';
  for (let i = 1; i <= 3; i++) html += '<i class="' + (i <= power ? 'filled' : '') + '"></i>';
  return html + '</span>';
}

function renderModelPill(){
  const m = findModel(selectedModelId);
  modelPillIcon.innerHTML = m.companyIcon;
  modelPillName.textContent = m.name;
}

function renderModelSheet(){
  modelSheetBody.innerHTML = '';
  MODEL_CATALOG.forEach(function(group){
    const label = document.createElement('div');
    label.className = 'model-group-label';
    label.innerHTML = '<span class="badge" style="width:16px;height:16px;">' + group.icon + '</span><span>' + group.name + '</span>';
    modelSheetBody.appendChild(label);

    group.models.forEach(function(m){
      const row = document.createElement('div');
      row.className = 'model-row' + (m.id === selectedModelId ? ' selected' : '');
      row.innerHTML =
        '<span class="badge" style="width:28px;height:28px;">' + group.icon + '</span>' +
        '<span class="info">' +
          '<span class="mname">' + m.name + powerDots(m.power) + '</span>' +
          '<span class="mdesc">' + m.desc + '</span>' +
          (m.via === 'cloudflare' ? '<span class="via-tag">' + BRAND.cloudflare + ' Workers AI</span>' : '') +
        '</span>' +
        (m.id === selectedModelId ? '<span class="check">' + ICONS.check + '</span>' : '');
      row.addEventListener('click', function(){
        selectedModelId = m.id;
        localStorage.setItem('fox-model', selectedModelId);
        renderModelPill(); renderModelSheet(); closeModelSheet();
      });
      modelSheetBody.appendChild(row);
    });
  });
}

function openModelSheet(){ renderModelSheet(); modelSheet.classList.add('open'); modelSheetBackdrop.classList.add('show'); }

function openUsageTool(){
  toolSheetTitle.textContent = 'استهلاك Workers AI';
  toolSheetBody.innerHTML = '<div id="usage-content" style="font-size:13.5px;line-height:1.9;">جارٍ التحميل...</div><button class="tool-refresh-btn" id="usage-refresh-btn" type="button">تحديث</button>';
  openToolSheet();

function loadUsage(){
  const el = document.getElementById('usage-content'); if (!el) return;
  el.textContent = 'جارٍ التحميل...';
  fetch(WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'usage', sessionToken }) })
    .then(function(r){ return r.json(); }).then(function(data){
      if (data.error) throw new Error(data.error);
      const totalTokens = data.totals?.totalTokens || 0;
      const DAILY = 10000, used = Math.round(totalTokens * 0.2), remaining = Math.max(0, DAILY - used), pct = Math.min(100, used / DAILY * 100);
      el.innerHTML = 'الحصة اليومية: <b>' + DAILY.toLocaleString('ar') + '</b> Neuron<br>' +
        'المستهلك تقريبًا: <b>' + used.toLocaleString('ar') + '</b><br>' +
        'المتبقي: <b>' + remaining.toLocaleString('ar') + '</b> (' + (100 - pct).toFixed(0) + '%)<br><br>' +
        'الطلبات اليوم: ' + (data.totals?.requests || 0) + '<br>' +
        'إجمالي التوكنات: ' + totalTokens.toLocaleString('ar');
    }).catch(function(e){ el.textContent = 'خطأ: ' + e.message; });
}

function openExperimentsTool(){
  toolSheetTitle.textContent = 'سجل التجارب';
  toolSheetBody.innerHTML = '<div id="experiments-content">جارٍ التحميل...</div><button class="tool-refresh-btn" id="experiments-refresh-btn" type="button">تحديث</button>';
  openToolSheet();
  loadExperiments();

function loadExperiments(){
  const el = document.getElementById('experiments-content'); if (!el) return;
  el.textContent = 'جارٍ التحميل...';
  fetch(WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'get_experiments', sessionToken }) })
    .then(function(r){ return r.json(); }).then(function(data){
      if (data.error) throw new Error(data.error);
      if (!data.experiments || !data.experiments.length) { el.textContent = 'لا توجد تجارب بعد'; return; }
      el.innerHTML = '';
      data.experiments.forEach(function(exp){
        const div = document.createElement('div'); div.className = 'tool-list-item';
        const statusLabel = exp.status === 'completed' ? '✓ نجحت' : exp.status === 'failed' ? '✕ فشلت' : exp.status;
        div.innerHTML = '<div class="tli-top"><span>' + statusLabel + '</span><span>' + new Date(exp.created_at).toLocaleString('ar') + '</span></div>' +
          '<div class="tli-cmd">' + escapeHtml((exp.command || '').slice(0, 200)) + '</div>';
        el.appendChild(div);
      });
    }).catch(function(e){ el.textContent = 'خطأ: ' + e.message; });
}

micBtn.addEventListener('click', function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  if (!recognition) {
    recognition = new SR();
    recognition.lang = 'ar-SA'; recognition.continuous = false; recognition.interimResults = false;
    recognition.onresult = function(e){ userInput.value = e.results[0][0].transcript; autoGrow(); isRecording = false; micBtn.classList.remove('recording'); };
    recognition.onend = function(){ isRecording = false; micBtn.classList.remove('recording'); };
    recognition.onerror = function(){ isRecording = false; micBtn.classList.remove('recording'); };
  }
  if (isRecording) { recognition.stop(); isRecording = false; micBtn.classList.remove('recording'); }
  else { recognition.start(); isRecording = true; micBtn.classList.add('recording'); }
});

/* ============================================================
   FILE ATTACH (note: filenames only are sent as text context —
   the worker cannot currently read actual file contents)
   ============================================================ */
fileBtn.addEventListener('click', function(){ fileInput.click(); });
fileInput.addEventListener('change', function(){
  const files = fileInput.files; if (!files.length) return;
  filePreview.innerHTML = ''; filePreview.classList.add('open'); pendingFiles = [];
  for (let i = 0; i < files.length; i++) {
    const file = files[i]; pendingFiles.push(file);
    const item = document.createElement('div'); item.className = 'preview-item';
    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = function(e){ const img = document.createElement('img'); img.src = e.target.result; item.insertBefore(img, item.firstChild); };
      reader.readAsDataURL(file);
    } else {
      const badge = document.createElement('div'); badge.className = 'file-badge'; badge.textContent = file.name;
      item.appendChild(badge);
    }
    const removeBtn = document.createElement('button'); removeBtn.className = 'remove-btn'; removeBtn.innerHTML = '×';
    removeBtn.addEventListener('click', function(){ item.remove(); pendingFiles = pendingFiles.filter(function(f){ return f !== file; }); if (!pendingFiles.length) filePreview.classList.remove('open'); });
    item.appendChild(removeBtn);
    filePreview.appendChild(item);
  }
  fileInput.value = '';
});
