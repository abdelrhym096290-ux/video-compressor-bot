<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>FOX AI</title>
<style>
  :root{
    --bg:#FAF9F5; --sidebar-bg:#F5F4EE; --border:#E5E3DA;
    --text:#3D3929; --text-soft:#83827D; --accent:#CC785C; --accent-soft:#F0DFD5;
    --bubble-user:#F0EEE6; --bubble-ai:#FFFFFF; --input-bg:#FFFFFF;
  }
  body.dark{
    --bg:#262624; --sidebar-bg:#1F1E1D; --border:#3A3935;
    --text:#F5F4EF; --text-soft:#A8A79E; --accent:#CC785C; --accent-soft:#4A392F;
    --bubble-user:#33322E; --bubble-ai:#2A2A27; --input-bg:#2A2A27;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    background:var(--bg); color:var(--text); display:flex; overflow:hidden;
    transition:background .2s,color .2s;
  }

  #backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.4); opacity:0; pointer-events:none;
    transition:opacity .25s; z-index:40;
  }
  #backdrop.show{ opacity:1; pointer-events:auto; }
  #sidebar{
    position:fixed; top:0; right:0; height:100%; width:280px; max-width:82vw;
    background:var(--sidebar-bg); border-left:1px solid var(--border);
    display:flex; flex-direction:column; z-index:50;
    transform:translateX(100%); transition:transform .25s ease;
    box-shadow:-10px 0 30px rgba(0,0,0,.18);
    padding-top:env(safe-area-inset-top);
  }
  #sidebar.open{ transform:translateX(0); }
  .sidebar-header{ display:flex; align-items:center; gap:10px; padding:16px; }
  .logo-mark{
    width:26px;height:26px;border-radius:7px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;
  }
  .new-chat-btn{
    margin:4px 12px 12px; padding:10px 14px; background:var(--accent); border:none;
    border-radius:10px; color:#fff; cursor:pointer; font-size:14px; font-weight:500;
  }
  .sidebar-label{ font-size:12px; color:var(--text-soft); padding:8px 16px 4px; }
  #chat-list{ flex:1; overflow-y:auto; padding:0 8px; -webkit-overflow-scrolling:touch; }
  .chat-item{
    padding:9px 12px; cursor:pointer; font-size:13.5px; border-radius:8px; margin:2px 0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text);
  }
  .chat-item:hover{ background:var(--accent-soft); }
  .chat-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:500; }
  .sidebar-footer{ padding:12px; border-top:1px solid var(--border); padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
  .theme-btn{
    width:100%; padding:9px; background:none; border:1px solid var(--border);
    border-radius:10px; color:var(--text); cursor:pointer; font-size:13px;
  }

  @media (min-width:860px){
    #backdrop{ display:none; }
    #sidebar{ position:relative; transform:none; box-shadow:none; max-width:none; width:270px; padding-top:0; }
  }

  #main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100%; }
  #header{
    display:flex; align-items:center; padding:calc(12px + env(safe-area-inset-top)) 14px 12px; gap:6px;
    border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap;
  }
  .icon-square-btn{
    background:none; border:none; color:var(--text); cursor:pointer;
    padding:7px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .icon-square-btn:active{ background:var(--accent-soft); }
  #header strong{ font-size:14.5px; flex:1; text-align:center; }

  .model-select{
    background:var(--input-bg);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:5px 8px;
    font-size:12px;
    cursor:pointer;
    outline:none;
    font-family:inherit;
    max-width:150px;
    flex-shrink:0;
  }
  .model-select:hover{ border-color:var(--text-soft); }
  .model-select:focus{ border-color:var(--accent); }

  .model-desc{
    font-size:10.5px; color:var(--text-soft); text-align:center;
    width:100%; padding:0 4px; flex-basis:100%;
  }

  .memory-toggle-btn{
    background:none; border:none; color:var(--text-soft); cursor:pointer;
    padding:7px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .memory-toggle-btn:active{ background:var(--accent-soft); }
  .memory-toggle-btn.active{ color:var(--accent); }

  #memory-panel{
    display:none; flex-shrink:0; border-top:1px solid var(--border);
    padding:12px 14px; background:var(--sidebar-bg); max-height:35vh;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  #memory-panel.open{ display:block; }
  .memory-header{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;
  }
  .memory-header span{ font-size:13px; font-weight:600; color:var(--text-soft); }
  #memory-content{
    width:100%; min-height:120px; background:var(--input-bg); color:var(--text);
    border:1px solid var(--border); border-radius:10px; padding:10px 12px;
    font-size:13px; line-height:1.6; resize:vertical; font-family:inherit; outline:none;
  }
  #memory-content:focus{ border-color:var(--accent); }
  .memory-save-btn{
    margin-top:8px; padding:7px 16px; background:var(--accent); border:none;
    border-radius:8px; color:#fff; cursor:pointer; font-size:12.5px; font-weight:500;
  }

  #messages{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:20px 16px; max-width:820px; width:100%; margin:0 auto; min-width:0;
  }
  #messages.empty{ display:flex; align-items:center; justify-content:center; }

  .empty-state{ text-align:center; padding:24px; }
  .empty-logo{
    width:48px;height:48px;border-radius:13px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;margin:0 auto 16px;
  }
  .empty-state h2{ font-size:19px; font-weight:600; margin-bottom:20px; }
  .suggestion-chips{ display:flex; flex-direction:column; gap:8px; max-width:340px; margin:0 auto; }
  .chip{
    background:var(--bubble-ai); border:1px solid var(--border); border-radius:14px;
    padding:11px 14px; font-size:13.5px; color:var(--text); cursor:pointer; text-align:right;
  }

  .message{ margin-bottom:22px; max-width:88%; min-width:0; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1;} }
  .message.user{ margin-right:0; margin-left:auto; }
  .message.ai{ margin-left:0; margin-right:auto; max-width:100%; }
  .message-bubble{
    padding:12px 16px; border-radius:18px; font-size:15px; line-height:1.75;
    overflow-wrap:anywhere; word-break:break-word;
  }
  .message.user .message-bubble{ background:var(--bubble-user); border-top-left-radius:6px; white-space:pre-wrap; }
  .message.ai .message-bubble{ background:var(--bubble-ai); border:1px solid var(--border); padding:14px 18px; }

  .message-bubble p{ margin:8px 0; }
  .message-bubble p:first-child{ margin-top:0; }
  .message-bubble p:last-child{ margin-bottom:0; }
  .message-bubble h1,.message-bubble h2,.message-bubble h3{ margin:16px 0 8px; font-weight:600; line-height:1.4; }
  .message-bubble h1:first-child,.message-bubble h2:first-child,.message-bubble h3:first-child{ margin-top:0; }
  .message-bubble h1{ font-size:1.25em; } .message-bubble h2{ font-size:1.15em; } .message-bubble h3{ font-size:1.05em; }
  .message-bubble ul,.message-bubble ol{ padding-inline-start:22px; margin:8px 0; }
  .message-bubble li{ margin:4px 0; }
  .message-bubble a{ color:var(--accent); }
  .message-bubble blockquote{
    border-right:3px solid var(--accent); padding:2px 14px; color:var(--text-soft); margin:10px 0;
  }
  .message-bubble code{
    background:var(--accent-soft); padding:2px 6px; border-radius:5px; font-size:.88em;
    font-family:"SF Mono",Consolas,Monaco,monospace; direction:ltr; unicode-bidi:embed;
  }
  .message-bubble pre code{ background:none; padding:0; }
  .message-bubble img,.message-bubble pre{ max-width:100%; }
  .message-bubble hr{ border:none; border-top:1px solid var(--border); margin:14px 0; }

  .code-block{ margin:12px 0; border-radius:10px; overflow:hidden; background:#1E1E1C; border:1px solid #000; }
  .code-block.terminal{ background:#0D0D0D; }
  .code-header{
    display:flex; align-items:center; justify-content:space-between; padding:8px 14px;
    background:#161615; border-bottom:1px solid #2A2A28; direction:ltr;
  }
  .code-block.terminal .code-header{ background:#1A1A1A; }
  .code-header-left{ display:flex; align-items:center; gap:8px; }
  .term-dots{ display:inline-flex; gap:6px; }
  .term-dots i{ width:9px;height:9px;border-radius:50%;display:inline-block; }
  .term-dots i:nth-child(1){ background:#FF5F57; } .term-dots i:nth-child(2){ background:#FEBC2E; } .term-dots i:nth-child(3){ background:#28C840; }
  .code-lang{ font-size:12px; color:#9A9992; font-family:"SF Mono",Consolas,monospace; }
  .code-copy-btn{
    background:none; border:none; color:#9A9992; font-size:12px; cursor:pointer;
    padding:4px 8px; border-radius:6px; display:flex; align-items:center; gap:5px;
  }
  .code-copy-btn:active{ background:#2A2A28; color:#fff; }
  .code-block pre{ margin:0; padding:14px 16px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .code-block pre code{
    color:#E8E6E1; font-family:"SF Mono",Consolas,Monaco,monospace; font-size:13px; line-height:1.6;
    direction:ltr; text-align:left; display:block; white-space:pre;
  }

  .msg-actions{ display:flex; gap:1px; margin-top:4px; }
  .message.user .msg-actions{ justify-content:flex-end; }
  .icon-btn{
    background:none; border:none; color:var(--text-soft); cursor:pointer;
    padding:6px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active{ background:var(--accent-soft); color:var(--text); }
  .icon-btn.active{ color:var(--accent); }

  .dots{ display:inline-flex; gap:4px; padding:4px 2px; }
  .dots span{ width:6px; height:6px; border-radius:50%; background:var(--text-soft); animation:blink 1.2s infinite ease-in-out; }
  .dots span:nth-child(2){ animation-delay:.15s; } .dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{opacity:.3;} 40%{opacity:1;} }

  #input-area{ padding:10px 14px calc(14px + env(safe-area-inset-bottom)); flex-shrink:0; }
  #input-container{
    max-width:820px; margin:0 auto; display:flex; align-items:flex-end; gap:6px;
    background:var(--input-bg); border:1px solid var(--border); border-radius:24px; padding:6px 6px 6px 8px;
    min-width:0;
  }
  #user-input{
    flex:1; min-width:0; padding:8px 10px; background:none; border:none; color:var(--text);
    font-size:16px; outline:none; resize:none; font-family:inherit; max-height:160px;
    overflow-wrap:anywhere; line-height:1.5;
  }
  #send-btn{
    width:34px; height:34px; border-radius:50%; background:var(--accent); border:none;
    cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  #send-btn:disabled{ opacity:.4; cursor:not-allowed; }
  #send-btn.generating{ background:var(--text-soft); }

  /* ============ شاشة القفل ============ */
  #lock-screen{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
  }
  .lock-box{
    background:var(--bubble-ai); border:1px solid var(--border); border-radius:16px;
    padding:24px 20px; width:300px; max-width:90vw; text-align:center;
  }
  .lock-box h2{ font-size:17px; margin-bottom:16px; color:var(--text); }
  .lock-input{
    width:100%; padding:10px 14px; background:var(--input-bg); color:var(--text);
    border:1px solid var(--border); border-radius:10px; font-size:15px; outline:none;
    text-align:center; font-family:inherit;
  }
  .lock-input:focus{ border-color:var(--accent); }
  .lock-btn{
    width:100%; margin-top:12px; padding:10px; background:var(--accent); border:none;
    border-radius:10px; color:#fff; cursor:pointer; font-size:14px; font-weight:500;
  }
  .lock-error{ font-size:12.5px; color:#d33; margin-top:8px; display:none; }
</style>
</head>
<body>

<!-- شاشة القفل -->
<div id="lock-screen">
  <div class="lock-box">
    <div class="logo-mark" style="margin:0 auto 12px; width:32px; height:32px; font-size:16px;">F</div>
    <h2>أدخل كلمة المرور</h2>
    <input type="password" id="lock-input" class="lock-input" placeholder="••••••••" autocomplete="off">
    <button id="lock-btn" class="lock-btn" type="button">دخول</button>
    <div id="lock-error" class="lock-error">كلمة المرور غير صحيحة</div>
  </div>
</div>

<div id="backdrop"></div>

<div id="sidebar">
  <div class="sidebar-header">
    <div class="logo-mark">F</div>
    <strong>FOX AI</strong>
  </div>
  <button class="new-chat-btn" id="new-chat-btn" type="button">＋ محادثة جديدة</button>
  <div class="sidebar-label">المحادثات</div>
  <div id="chat-list"></div>
  <div class="sidebar-footer">
    <button class="theme-btn" id="theme-btn" type="button">تغيير المظهر</button>
  </div>
</div>

<div id="main">
  <div id="header">
    <button class="icon-square-btn" id="menu-btn" type="button" aria-label="القائمة">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <strong>FOX AI</strong>
    <select id="modelSelect" class="model-select" title="اختيار النموذج"></select>
    <button class="memory-toggle-btn" id="memory-toggle-btn" type="button" title="ذاكرة المشروع">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
    </button>
    <button class="icon-square-btn" id="header-new-btn" type="button" aria-label="محادثة جديدة">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <div id="model-desc" class="model-desc"></div>
  </div>

  <div id="messages"></div>

  <div id="memory-panel">
    <div class="memory-header">
      <span>ذاكرة المشروع</span>
      <button class="icon-square-btn" id="memory-close-btn" type="button" aria-label="إغلاق">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <textarea id="memory-content" placeholder="لا توجد ذاكرة بعد. ابدأ محادثة وسيتم إنشاؤها تلقائياً..."></textarea>
    <button class="memory-save-btn" id="memory-save-btn" type="button">حفظ</button>
  </div>

  <div id="input-area">
    <div id="input-container">
      <textarea id="user-input" rows="1" placeholder="اكتب رسالتك هنا..." enterkeyhint="enter" autocomplete="off" autocorrect="on"></textarea>
      <button id="send-btn" type="button" title="إرسال"></button>
    </div>
  </div>
</div>

<script>
'use strict';

const ICONS = {
  send:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
  stop:  '<svg width="13" height="13" viewBox="0 0 24 24" fill="white"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
  copy:  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  check: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  thumbUp: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h2.76a2 2 0 0 0 1.79-1.11L12 2h.5A2.5 2.5 0 0 1 15 4.5z"/></svg>',
  retry: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>',
};
const TERMINAL_LANGS = ['bash','sh','shell','zsh','console','terminal','powershell','cmd','bat'];
const WORKER_URL = 'https://fox1-ai.abdelrhym096290.workers.dev';

const messagesEl = document.getElementById('messages');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const themeBtn = document.getElementById('theme-btn');
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
const menuBtn = document.getElementById('menu-btn');
const newChatBtn = document.getElementById('new-chat-btn');
const headerNewBtn = document.getElementById('header-new-btn');
const chatList = document.getElementById('chat-list');
const modelSelect = document.getElementById('modelSelect');
const modelDesc = document.getElementById('model-desc');
const memoryToggleBtn = document.getElementById('memory-toggle-btn');
const memoryCloseBtn = document.getElementById('memory-close-btn');
const memoryPanel = document.getElementById('memory-panel');
const memoryContent = document.getElementById('memory-content');
const memorySaveBtn = document.getElementById('memory-save-btn');
const lockScreen = document.getElementById('lock-screen');
const lockInput = document.getElementById('lock-input');
const lockBtn = document.getElementById('lock-btn');
const lockError = document.getElementById('lock-error');

/* ============ كلمة المرور ============ */
let accessPassword = localStorage.getItem('fox-pass') || '';

lockBtn.addEventListener('click', verifyPassword);
lockInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter') verifyPassword();
});

function verifyPassword(){
  const entered = lockInput.value.trim();
  if (!entered) return;
  accessPassword = entered;
  localStorage.setItem('fox-pass', entered);
  checkPassword();
}

async function checkPassword(){
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'get_memory',
        chatId: 'auth-check',
        accessPassword: accessPassword
      })
    });
    const data = await response.json();
    if (data.authRequired) {
      lockError.style.display = 'block';
      localStorage.removeItem('fox-pass');
      accessPassword = '';
      lockInput.value = '';
      lockInput.focus();
    } else {
      lockScreen.style.display = 'none';
    }
  } catch (error) {
    lockError.style.display = 'block';
  }
}

if (accessPassword) {
  checkPassword();
} else {
  lockScreen.style.display = 'flex';
  lockInput.focus();
}

/* ============ النماذج ============ */
const PROVIDERS = [
  { value: 'gemini', label: 'Gemini', desc: 'Google — عام سريع، حصة منفصلة 20/يوم' },
  { value: 'cf-glm-flash', label: 'GLM 4.7 Flash', desc: 'Z.ai — برمجة + Agents + سياق 131K' },
  { value: 'cf-qwen3-coder', label: 'Qwen3.8 27B', desc: 'Alibaba — برمجة + رؤية + سياق 262K' },
  { value: 'cf-coder', label: 'Qwen Coder 32B', desc: 'Alibaba — كود معقد + سياق 32K' },
  { value: 'cf-qwen3', label: 'Qwen3 30B', desc: 'Alibaba — برمجة + متعدد اللغات' },
  { value: 'cf-gpt-oss-20b', label: 'GPT-OSS 20B', desc: 'OpenAI — كود + سرعة' },
  { value: 'cf-gemma-4', label: 'Gemma 4 26B', desc: 'Google — تفكير + عملاء + رؤية' },
  { value: 'cf-nemotron', label: 'Nemotron 3 120B', desc: 'NVIDIA — تفكير عميق + عملاء' },
  { value: 'cf-gpt-oss-120b', label: 'GPT-OSS 120B', desc: 'OpenAI — تفكير + برمجة + إنتاج' },
  { value: 'cf-deepseek-r1', label: 'DeepSeek R1', desc: 'DeepSeek — منطق + رياضيات + كود' },
  { value: 'cf-qwq', label: 'QwQ 32B', desc: 'Alibaba — تفكير عميق + رياضيات' },
  { value: 'cf-llama-4', label: 'Llama 4 Scout', desc: 'Meta — عام + رؤية' },
  { value: 'cf-mistral', label: 'Mistral 24B', desc: 'Mistral AI — كتابة + برمجة + رؤية' },
  { value: 'cf-llama-70b', label: 'Llama 3.3 70B', desc: 'Meta — محادثة + كود قوي' },
  { value: 'cf-llama-vision', label: 'Llama Vision 11B', desc: 'Meta — تحليل صور + محادثة' },
  { value: 'cf-granite', label: 'Granite 4.0', desc: 'IBM — Agents + RAG + خفيف سريع' },
];

function initModelSelect(){
  PROVIDERS.forEach(function(p){
    const opt = document.createElement('option');
    opt.value = p.value;
    opt.textContent = p.label;
    modelSelect.appendChild(opt);
  });

  const saved = localStorage.getItem('fox-model');
  if (saved && PROVIDERS.some(function(p){ return p.value === saved; })) {
    modelSelect.value = saved;
  }
  updateModelDesc();
}

function updateModelDesc(){
  const selected = modelSelect.value;
  const found = PROVIDERS.find(function(p){ return p.value === selected; });
  modelDesc.textContent = found ? found.desc : '';
}

function getSelectedProvider(){
  return modelSelect.value;
}

modelSelect.addEventListener('change', function(){
  localStorage.setItem('fox-model', modelSelect.value);
  updateModelDesc();
});

/* ============ الذاكرة ============ */

memoryToggleBtn.addEventListener('click', function(){
  memoryPanel.classList.toggle('open');
  memoryToggleBtn.classList.toggle('active');
  if (memoryPanel.classList.contains('open')) {
    loadMemory();
  }
});

memoryCloseBtn.addEventListener('click', function(){
  memoryPanel.classList.remove('open');
  memoryToggleBtn.classList.remove('active');
});

memorySaveBtn.addEventListener('click', saveMemoryManually);

async function loadMemory(){
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'get_memory',
        chatId: currentChatId,
        accessPassword: accessPassword
      })
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    memoryContent.value = data.content || '';
  } catch (error) {
    console.error('loadMemory error:', error.message);
    memoryContent.value = '';
  }
}

async function saveMemoryManually(){
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'memory_update',
        chatId: currentChatId,
        content: memoryContent.value,
        accessPassword: accessPassword
      })
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    memorySaveBtn.textContent = '✓ تم الحفظ';
    setTimeout(function(){ memorySaveBtn.textContent = 'حفظ'; }, 1200);
  } catch (error) {
    console.error('saveMemory error:', error.message);
    memorySaveBtn.textContent = '⚠️ خطأ';
    setTimeout(function(){ memorySaveBtn.textContent = 'حفظ'; }, 1200);
  }
}

let isGenerating = false;
let currentController = null;

function autoGrow(){
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
}
userInput.addEventListener('input', autoGrow);

userInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', function(){
  if (isGenerating) { if (currentController) currentController.abort(); }
  else { sendMessage(); }
});

function openSidebar(){ sidebar.classList.add('open'); backdrop.classList.add('show'); }
function closeSidebar(){ sidebar.classList.remove('open'); backdrop.classList.remove('show'); }
menuBtn.addEventListener('click', function(){
  sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
});
backdrop.addEventListener('click', closeSidebar);

themeBtn.addEventListener('click', function(){
  document.body.classList.toggle('dark');
  localStorage.setItem('fox-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
});
if (localStorage.getItem('fox-theme') === 'dark') document.body.classList.add('dark');

newChatBtn.addEventListener('click', createNewChat);
headerNewBtn.addEventListener('click', createNewChat);

/* ============ الحالة والتخزين ============ */

let chats = JSON.parse(localStorage.getItem('fox-chats') || '[]');
let currentChatId = localStorage.getItem('fox-current-chat');

if (!chats.length) {
  const id = Date.now().toString();
  chats.unshift({ id: id, title: 'محادثة جديدة', messages: [] });
  currentChatId = id;
  saveChats();
} else if (!chats.find(function(c){ return c.id === currentChatId; })) {
  currentChatId = chats[0].id;
}

function saveChats(){ localStorage.setItem('fox-chats', JSON.stringify(chats)); }
function setCurrent(id){ currentChatId = id; localStorage.setItem('fox-current-chat', id); }
function getCurrentChat(){ return chats.find(function(c){ return c.id === currentChatId; }); }

function createNewChat(){
  if (isGenerating && currentController) currentController.abort();
  const id = Date.now().toString();
  chats.unshift({ id: id, title: 'محادثة جديدة', messages: [] });
  setCurrent(id);
  saveChats();
  renderChatList();
  renderMessages();
  closeSidebar();
  if (memoryPanel.classList.contains('open')) {
    memoryContent.value = '';
  }
}

function renderChatList(){
  chatList.innerHTML = '';
  chats.forEach(function(chat){
    const div = document.createElement('div');
    div.className = 'chat-item ' + (chat.id === currentChatId ? 'active' : '');
    div.textContent = chat.title;
    div.addEventListener('click', function(){
      if (chat.id === currentChatId) { closeSidebar(); return; }
      if (isGenerating && currentController) currentController.abort();
      setCurrent(chat.id);
      renderChatList();
      renderMessages();
      closeSidebar();
      if (memoryPanel.classList.contains('open')) {
        loadMemory();
      }
    });
    chatList.appendChild(div);
  });
}

/* ============ MARKDOWN ============ */

function escapeHtml(s){
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderMarkdown(raw){
  const blocks = [];
  let text = raw.replace(/```(\w*)\n?([\s\S]*?)```/g, function(m, lang, code){
    blocks.push({ lang: lang.trim(), code: code.replace(/\n$/, '') });
    return '\u0000CODEBLOCK' + (blocks.length - 1) + '\u0000';
  });

  text = escapeHtml(text);
  text = text.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');

  const lines = text.split('\n');
  let html = '';
  let listType = null;
  let paragraph = [];

  function flushParagraph(){
    if (paragraph.length){ html += '<p>' + paragraph.join('<br>') + '</p>'; paragraph = []; }
  }
  function closeList(){
    if (listType){ html += '</' + listType + '>'; listType = null; }
  }

  lines.forEach(function(line){
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    const ul = line.match(/^[-*]\s+(.*)$/);
    const ol = line.match(/^\d+\.\s+(.*)$/);
    const bq = line.match(/^&gt;\s?(.*)$/);
    const hr = /^-{3,}$/.test(line.trim());
    const isCodePlaceholder = /^\u0000CODEBLOCK\d+\u0000$/.test(line.trim());

    if (isCodePlaceholder){
      flushParagraph(); closeList();
      html += line.trim();
    } else if (h){
      flushParagraph(); closeList();
      const level = h[1].length;
      html += '<h' + level + '>' + h[2] + '</h' + level + '>';
    } else if (ul){
      flushParagraph();
      if (listType !== 'ul'){ closeList(); html += '<ul>'; listType = 'ul'; }
      html += '<li>' + ul[1] + '</li>';
    } else if (ol){
      flushParagraph();
      if (listType !== 'ol'){ closeList(); html += '<ol>'; listType = 'ol'; }
      html += '<li>' + ol[1] + '</li>';
    } else if (bq){
      flushParagraph(); closeList();
      html += '<blockquote>' + bq[1] + '</blockquote>';
    } else if (hr){
      flushParagraph(); closeList();
      html += '<hr>';
    } else if (line.trim() === ''){
      flushParagraph(); closeList();
    } else {
      closeList();
      paragraph.push(line);
    }
  });
  flushParagraph(); closeList();

  html = html.replace(/\u0000CODEBLOCK(\d+)\u0000/g, function(m, i){
    const b = blocks[Number(i)];
    return '<pre><code class="language-' + (b.lang || 'text') + '">' + escapeHtml(b.code) + '</code></pre>';
  });

  return html;
}

function isTerminalLang(lang){ return TERMINAL_LANGS.indexOf((lang || '').toLowerCase()) !== -1; }

function enhanceCodeBlocks(container){
  container.querySelectorAll('pre > code').forEach(function(codeEl){
    const pre = codeEl.parentElement;
    const langMatch = Array.prototype.find.call(codeEl.classList, function(c){ return c.indexOf('language-') === 0; });
    const lang = langMatch ? langMatch.replace('language-', '') : '';

    const wrapper = document.createElement('div');
    wrapper.className = 'code-block' + (isTerminalLang(lang) ? ' terminal' : '');

    const header = document.createElement('div');
    header.className = 'code-header';

    const left = document.createElement('div');
    left.className = 'code-header-left';
    if (isTerminalLang(lang)) {
      left.innerHTML = '<span class="term-dots"><i></i><i></i><i></i></span><span class="code-lang">' + (lang || 'terminal') + '</span>';
    } else {
      left.innerHTML = '<span class="code-lang">' + (lang || 'text') + '</span>';
    }

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'code-copy-btn';
    copyBtn.innerHTML = ICONS.copy + '<span>نسخ</span>';
    copyBtn.addEventListener('click', function(){
      navigator.clipboard.writeText(codeEl.textContent);
      copyBtn.innerHTML = ICONS.check + '<span>تم النسخ</span>';
      setTimeout(function(){ copyBtn.innerHTML = ICONS.copy + '<span>نسخ</span>'; }, 1500);
    });

    header.appendChild(left);
    header.appendChild(copyBtn);
    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);
  });
}

/* ============ عرض الرسائل ============ */

function makeIconBtn(icon, title, onClick){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'icon-btn';
  btn.title = title;
  btn.innerHTML = icon;
  btn.addEventListener('click', onClick);
  return btn;
}

function appendBubble(text, role, index, chat, opts){
  opts = opts || {};
  const msgDiv = document.createElement('div');
  msgDiv.className = 'message ' + role;

  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  if (role === 'ai') {
    bubble.innerHTML = renderMarkdown(text);
    enhanceCodeBlocks(bubble);
  } else {
    bubble.textContent = text;
  }
  msgDiv.appendChild(bubble);

  if (!opts.ephemeral) {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    const copyBtn = makeIconBtn(ICONS.copy, 'نسخ', function(){
      navigator.clipboard.writeText(text);
      copyBtn.innerHTML = ICONS.check;
      setTimeout(function(){ copyBtn.innerHTML = ICONS.copy; }, 1200);
    });
    actions.appendChild(copyBtn);

    if (role === 'ai') {
      const upBtn = makeIconBtn(ICONS.thumbUp, 'إعجاب', function(){
        upBtn.classList.toggle('active');
        downBtn.classList.remove('active');
      });
      const downBtn = makeIconBtn(ICONS.thumbUp, 'عدم إعجاب', function(){
        downBtn.classList.toggle('active');
        upBtn.classList.remove('active');
      });
      downBtn.style.transform = 'scaleY(-1)';
      actions.appendChild(upBtn);
      actions.appendChild(downBtn);

      if (index === chat.messages.length - 1) {
        actions.appendChild(makeIconBtn(ICONS.retry, 'إعادة المحاولة', function(){ regenerate(chat); }));
      }
    }
    msgDiv.appendChild(actions);
  }

  messagesEl.appendChild(msgDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return msgDiv;
}

function renderMessages(){
  const chat = getCurrentChat();
  messagesEl.innerHTML = '';
  if (!chat.messages.length){ renderEmptyState(); return; }
  messagesEl.classList.remove('empty');
  chat.messages.forEach(function(m, i){ appendBubble(m.content, m.role, i, chat); });
}

function renderEmptyState(){
  messagesEl.classList.add('empty');
  const wrap = document.createElement('div');
  wrap.className = 'empty-state';
  wrap.innerHTML =
    '<div class="empty-logo">F</div>' +
    '<h2>مرحبًا، كيف يمكنني مساعدتك؟</h2>' +
    '<div class="suggestion-chips">' +
      '<button type="button" class="chip">اشرح لي مفهومًا معقدًا ببساطة</button>' +
      '<button type="button" class="chip">ساعدني في تصحيح كود</button>' +
      '<button type="button" class="chip">اكتب لي رسالة بريد إلكتروني احترافية</button>' +
    '</div>';
  wrap.querySelectorAll('.chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      userInput.value = chip.textContent;
      autoGrow();
      userInput.focus();
    });
  });
  messagesEl.appendChild(wrap);
}

function showTyping(){
  const msgDiv = document.createElement('div');
  msgDiv.className = 'message ai';
  msgDiv.id = 'typing-msg';
  msgDiv.innerHTML = '<div class="message-bubble"><span class="dots"><span></span><span></span><span></span></span></div>';
  messagesEl.appendChild(msgDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* ============ الإرسال ============ */

function setGeneratingUI(active){
  isGenerating = active;
  sendBtn.classList.toggle('generating', active);
  sendBtn.innerHTML = active ? ICONS.stop : ICONS.send;
  sendBtn.title = active ? 'إيقاف' : 'إرسال';
}
setGeneratingUI(false);

function requestAIResponse(chat){
  setGeneratingUI(true);
  currentController = new AbortController();
  showTyping();

  return fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'chat',
      chatId: currentChatId,
      provider: getSelectedProvider(),
      messages: chat.messages.map(function(m){ return { role: m.role === 'user' ? 'user' : 'model', content: m.content }; }),
      accessPassword: accessPassword
    }),
    signal: currentController.signal
  }).then(function(response){
    return response.json().catch(function(){
      throw new Error('رد غير صالح من الخادم (status ' + response.status + ')');
    }).then(function(data){
      const typingEl = document.getElementById('typing-msg');
      if (typingEl) typingEl.remove();
      if (!response.ok || data.error) throw new Error(data.error || ('خطأ HTTP ' + response.status));
      const reply = data.response || 'لا يوجد رد';
      chat.messages.push({ role: 'ai', content: reply });
      saveChats();
      appendBubble(reply, 'ai', chat.messages.length - 1, chat);
      renderChatList();
      if (data.memory && memoryPanel.classList.contains('open')) {
        memoryContent.value = data.memory;
      }
    });
  }).catch(function(error){
    const typingEl = document.getElementById('typing-msg');
    if (typingEl) typingEl.remove();
    if (error.name !== 'AbortError') {
      appendBubble('⚠️ خطأ في الاتصال بالخادم: ' + error.message, 'ai', -1, chat, { ephemeral: true });
      console.error('FOX AI request failed:', error);
    }
  }).then(function(){
    setGeneratingUI(false);
  });
}

function regenerate(chat){
  if (isGenerating) return;
  const lastIndex = chat.messages.length - 1;
  if (!chat.messages[lastIndex] || chat.messages[lastIndex].role !== 'ai') return;
  chat.messages.splice(lastIndex, 1);
  saveChats();
  renderMessages();
  requestAIResponse(chat);
}

function sendMessage(){
  const text = userInput.value.trim();
  if (!text || isGenerating) return;

  const chat = getCurrentChat();
  chat.messages.push({ role: 'user', content: text });
  if (chat.messages.length === 1) chat.title = text.slice(0, 40);
  saveChats();
  renderChatList();

  if (messagesEl.classList.contains('empty')) { messagesEl.innerHTML = ''; messagesEl.classList.remove('empty'); }
  appendBubble(text, 'user', chat.messages.length - 1, chat);

  userInput.value = '';
  autoGrow();

  requestAIResponse(chat);
}

/* ============ البداية ============ */

initModelSelect();
renderChatList();
renderMessages();
</script>
