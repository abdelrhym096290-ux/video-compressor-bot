name: FOX AI Terminal

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'الأمر الذي سيُنفذ'
        required: true
        default: 'echo مرحبا'

concurrency:
  group: fox-ai-terminal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  execute:
    name: تنفيذ الأمر
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: تجهيز البيئة
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip git curl

      - name: تنفيذ الأمر
        id: execute
        env:
          USER_COMMAND: ${{ github.event.inputs.command }}
        run: |
          set +e
          OUTPUT=$(eval "$USER_COMMAND" 2>&1)
          EXIT_CODE=$?
          set -e
          
          echo "=== OUTPUT ==="
          echo "$OUTPUT"
          echo "=== END ==="
          
          echo "$OUTPUT" > output.txt
          echo "$EXIT_CODE" > exit_code.txt

      - name: إرسال النتيجة إلى العامل
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
        run: |
          python3 send_result.py