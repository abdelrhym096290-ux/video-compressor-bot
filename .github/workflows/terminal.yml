name: FOX AI Terminal

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'الأمر الذي سيُنفذ بعد موافقة المستخدم'
        required: true
        default: 'echo مرحبا'
      language:
        description: 'لغة التنفيذ'
        required: false
        default: 'bash'
      experimentId:
        description: 'معرّف التجربة'
        required: true
        default: ''

run-name: FOX AI experiment ${{ inputs.experimentId }}

concurrency:
  group: fox-ai-terminal-${{ github.event.inputs.experimentId }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  execute:
    name: تنفيذ التجربة
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: تجهيز البيئة
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git curl jq openssl

      - name: تنفيذ الأمر المصرح به
        id: execute
        env:
          USER_COMMAND: ${{ github.event.inputs.command }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 5m bash -lc -- "$USER_COMMAND" > output.txt 2>&1
          EXIT_CODE=$?
          set -e
          head -c 50000 output.txt > output.trimmed
          mv output.trimmed output.txt
          printf '%s' "$EXIT_CODE" > exit_code.txt
          cat output.txt
          exit 0

      - name: إرسال النتيجة الموقعة إلى العامل
        if: ${{ always() }}
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          WORKER_RESULT_URL: ${{ vars.FOX_RESULT_URL || 'https://fox1-ai.abdelrhym096290.workers.dev/tool-result' }}
        run: |
          test -n "$HMAC_SECRET"
          OUTPUT=$(cat output.txt)
          EXIT_CODE=$(cat exit_code.txt)
          EXPERIMENT_ID="${{ github.event.inputs.experimentId }}"
          jq -n --arg out "$OUTPUT" --argjson code "$EXIT_CODE" --arg id "$EXPERIMENT_ID" '{output:$out,exit_code:$code,experimentId:$id}' > payload.json
          SIGNATURE=$(openssl dgst -sha256 -hmac "$HMAC_SECRET" payload.json | awk '{print $2}')
          curl --fail-with-body --silent --show-error -X POST "$WORKER_RESULT_URL" \
            -H 'Content-Type: application/json' \
            -H "X-FOX-Signature: sha256=$SIGNATURE" \
            --data-binary @payload.json