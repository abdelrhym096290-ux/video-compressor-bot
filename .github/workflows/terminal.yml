name: FOX AI Terminal

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'الأمر الذي سيُنفذ'
        required: true
        default: 'echo مرحبا'

concurrency:
  group: fox-ai-terminal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  execute:
    name: تنفيذ الأمر
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: تجهيز البيئة
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip git curl

      - name: تنفيذ الأمر
        id: execute
        env:
          USER_COMMAND: ${{ github.event.inputs.command }}
        run: |
          set +e
          OUTPUT=$(eval "$USER_COMMAND" 2>&1)
          EXIT_CODE=$?
          set -e
          
          echo "=== OUTPUT ==="
          echo "$OUTPUT"
          echo "=== END ==="
          
          echo "$OUTPUT" > output.txt
          echo "$EXIT_CODE" > exit_code.txt

      - name: إرسال النتيجة إلى العامل
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
        run: |
          python3 -c "
import json, hmac, hashlib, os, urllib.request

with open('output.txt', 'r') as f:
    output = f.read()
with open('exit_code.txt', 'r') as f:
    exit_code = int(f.read().strip())

payload = json.dumps({'output': output, 'exit_code': exit_code})
secret = os.environ['HMAC_SECRET'].encode()
signature = hmac.new(secret, payload.encode(), hashlib.sha256).hexdigest()

req = urllib.request.Request(
    'https://fox1-ai.abdelrhym096290.workers.dev/result',
    data=payload.encode(),
    headers={
        'Content-Type': 'application/json',
        'X-Hub-Signature-256': 'sha256=' + signature
    }
)
resp = urllib.request.urlopen(req)
print(resp.read().decode())
"