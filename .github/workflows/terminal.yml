name: FOX AI Terminal

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'الأمر الذي سيُنفذ'
        required: true
        default: 'echo مرحبا'
      experimentId:
        description: 'معرّف التجربة'
        required: false
        default: ''

concurrency:
  group: fox-ai-terminal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  execute:
    name: تنفيذ الأمر
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: تجهيز البيئة
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip git curl jq

      - name: تنفيذ الأمر
        id: execute
        env:
          USER_COMMAND: ${{ github.event.inputs.command }}
        run: |
          set +e
          OUTPUT=$(eval "$USER_COMMAND" 2>&1)
          EXIT_CODE=$?
          set -e
          
          echo "=== OUTPUT ==="
          echo "$OUTPUT"
          echo "=== END ==="
          
          echo "$OUTPUT" > output.txt
          echo "$EXIT_CODE" > exit_code.txt

      - name: إرسال النتيجة إلى العامل
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
        run: |
          OUTPUT=$(cat output.txt)
          EXIT_CODE=$(cat exit_code.txt)
          EXPERIMENT_ID="${{ github.event.inputs.experimentId }}"
          jq -n --arg out "$OUTPUT" --argjson code "$EXIT_CODE" --arg id "$EXPERIMENT_ID" '{output: $out, exit_code: $code, experimentId: $id}' > payload.json
          SIGNATURE=$(openssl dgst -sha256 -hmac "$HMAC_SECRET" payload.json | awk '{print $2}')
          
          curl -X POST "https://fox1-ai.abdelrhym096290.workers.dev/result" \
            -H "Content-Type: application/json" \
            -H "X-FOX-Signature: sha256=$SIGNATURE" \
            -d @payload.json
