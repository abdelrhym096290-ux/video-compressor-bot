name: FOX AI Terminal

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'الأمر الذي سيُنفذ'
        required: true
        default: 'echo مرحبا'

concurrency:
  group: fox-ai-terminal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  execute:
    name: تنفيذ الأمر
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: تجهيز البيئة
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip git curl

      - name: تنفيذ الأمر
        id: execute
        env:
          USER_COMMAND: ${{ github.event.inputs.command }}
        run: |
          set +e
          OUTPUT=$(eval "$USER_COMMAND" 2>&1)
          EXIT_CODE=$?
          set -e
          
          echo "=== OUTPUT ==="
          echo "$OUTPUT"
          echo "=== END ==="
          
          echo "$OUTPUT" > output.txt
          echo "$EXIT_CODE" > exit_code.txt

      - name: إرسال النتيجة إلى العامل
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
        run: |
          python3 << 'EOF'
import json
import hmac
import hashlib
import os
import urllib.request

with open('output.txt', 'r', encoding='utf-8') as f:
    output = f.read()

with open('exit_code.txt', 'r', encoding='utf-8') as f:
    exit_code = int(f.read().strip())

payload_str = json.dumps({'output': output, 'exit_code': exit_code}, ensure_ascii=False)
payload_bytes = payload_str.encode('utf-8')

secret = os.environ['HMAC_SECRET'].encode('utf-8')
signature = hmac.new(secret, payload_bytes, hashlib.sha256).hexdigest()

req = urllib.request.Request(
    'https://fox1-ai.abdelrhym096290.workers.dev/result',
    data=payload_bytes,
    headers={
        'Content-Type': 'application/json; charset=utf-8',
        'X-Hub-Signature-256': 'sha256=' + signature
    },
    method='POST'
)

try:
    with urllib.request.urlopen(req) as resp:
        print("Success:", resp.read().decode('utf-8'))
except urllib.error.HTTPError as e:
    print('HTTP Error:', e.code, e.read().decode('utf-8'))
    raise
except Exception as e:
    print('Error:', str(e))
    raise
EOF