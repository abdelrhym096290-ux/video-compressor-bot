name: Cloud Video Compressor (Unified AV1 & VVC)

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Direct video download URL'
        required: true
      codec:
        description: 'Target Codec (av1, vvc, audio)'
        required: true
      preset_input:
        description: 'Speed/Preset value'
        required: true
      encode_method:
        description: 'Encoding method (crf, qp, twopass, vbr, audio)'
        required: true
      target_value:
        description: 'Quality or Bitrate value'
        required: true
      resolution:
        description: 'Target resolution height'
        required: true
      encode_mode:
        description: 'Filter mode (filters, nofilters, anime, realistic)'
        required: true
      chat_id:
        description: 'Telegram Chat ID'
        required: true

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}

jobs:
  prepare-ffmpeg:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake nasm yasm git pkg-config libopus-dev libdav1d-dev libogg-dev

      - name: Cache Codec Build
        id: cache-codec
        uses: actions/cache@v4
        with:
          path: ~/codec-build
          key: codec-universal-v3-final

      - name: Build Unified FFmpeg
        if: steps.cache-codec.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/codec-sources ~/codec-build

          # 1. Build SVT-AV1
          cd ~/codec-sources
          git clone --depth 1 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cd SVT-AV1 && mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX="$HOME/codec-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          make -j"$(nproc)" && make install

          # 2. Build VVenC
          cd ~/codec-sources
          git clone --depth 1 https://github.com/fraunhoferhhi/vvenc.git
          cd vvenc && mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX="$HOME/codec-build" -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)" && make install

          # 3. Build FFmpeg with libdav1d (AV1 Decoder)
          cd ~/codec-sources
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg
          export PKG_CONFIG_PATH="$HOME/codec-build/lib/pkgconfig"
          ./configure \
            --prefix="$HOME/codec-build" \
            --pkg-config-flags="--static" \
            --extra-cflags="-I$HOME/codec-build/include" \
            --extra-ldflags="-L$HOME/codec-build/lib" \
            --enable-gpl --enable-version3 --enable-nonfree \
            --enable-libopus --enable-libdav1d --enable-libsvtav1 --enable-libvvenc
          make -j"$(nproc)" && make install

  split:
    needs: prepare-ffmpeg
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
      crop: ${{ steps.detect-crop.outputs.crop }}
    steps:
      - name: Restore Codec Cache
        uses: actions/cache@v4
        with:
          path: ~/codec-build
          key: codec-universal-v3-final

      - name: Download Video
        run: |
          set -euo pipefail
          mkdir -p chunks_raw
          curl -fL --retry 3 "${{ inputs.download_url }}" -o raw_input.mp4
          test -s raw_input.mp4 || { echo "❌ فشل تحميل الفيديو أو الملف فارغ"; exit 1; }

      - name: Detect Black Bars (Crop)
        id: detect-crop
        run: |
          set -euo pipefail
          export PATH="$HOME/codec-build/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/codec-build/lib"
          CROP=$(ffmpeg -i raw_input.mp4 -vframes 100 -vf cropdetect=24:16:0 -f null - 2>&1 \
            | grep -o 'crop=[0-9:]*' | tail -1)
          if [ -z "$CROP" ]; then
            echo "⚠️ تعذر اكتشاف قيمة القص، سيتم تجاهل القص"
            CROP=""
          else
            echo "✅ قيمة القص المكتشفة: $CROP"
          fi
          echo "crop=$CROP" >> "$GITHUB_OUTPUT"

      - name: Split Video (300s chunks)
        run: |
          set -euo pipefail
          ffmpeg -i raw_input.mp4 -c copy -f segment -segment_time 300 -reset_timestamps 1 chunks_raw/chunk_%03d.mp4
          [ -n "$(ls chunks_raw/chunk_*.mp4 2>/dev/null)" ] || { echo "❌ فشل التقطيع، لا توجد أجزاء"; exit 1; }

      - name: Generate Matrix
        id: gen-matrix
        run: |
          set -euo pipefail
          CHUNKS=$(ls chunks_raw/chunk_*.mp4 | sed 's/chunks_raw\/chunk_\(.*\).mp4/"\1"/' | paste -sd "," - | sed 's/^/[/' | sed 's/$/]/')
          echo "matrix=$CHUNKS" >> "$GITHUB_OUTPUT"

      - name: Upload Raw Chunks
        uses: actions/upload-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw/
          retention-days: 1

  encode:
    needs: [prepare-ffmpeg, split]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        chunk_id: ${{ fromJson(needs.split.outputs.matrix) }}
    steps:
      - name: Download Raw Chunk
        uses: actions/download-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw

      - name: Restore Codec Cache
        uses: actions/cache@v4
        with:
          path: ~/codec-build
          key: codec-universal-v3-final

      - name: Run Encoding
        env:
          CODEC: ${{ inputs.codec }}
          PRESET_INPUT: ${{ inputs.preset_input }}
          ENCODE_MODE: ${{ inputs.encode_mode }}
          ENCODE_METHOD: ${{ inputs.encode_method }}
          TARGET_VALUE: ${{ inputs.target_value }}
          RESOLUTION: ${{ inputs.resolution }}
          CHUNK_ID: ${{ matrix.chunk_id }}
          CROP_VALUE: ${{ needs.split.outputs.crop }}
        run: |
          set -euo pipefail
          export PATH="$HOME/codec-build/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/codec-build/lib"

          echo "🔍 القيم المستلمة: codec=$CODEC preset=$PRESET_INPUT mode=$ENCODE_MODE method=$ENCODE_METHOD value=$TARGET_VALUE res=$RESOLUTION crop=$CROP_VALUE"

          IN="chunks_raw/chunk_${CHUNK_ID}.mp4"
          OUT_DIR="chunks_encoded"
          mkdir -p "$OUT_DIR"
          test -s "$IN" || { echo "❌ الجزء المصدر غير موجود: $IN"; exit 1; }

          # الحاوية موحّدة MKV لكلا الكوديكين
          EXT="mkv"
          OUT_FILE="${OUT_DIR}/encoded_${CHUNK_ID}.${EXT}"

          # سلسلة القص (تُطبّق فقط إذا اكتُشفت قيمة فعلية)
          if [ -n "$CROP_VALUE" ]; then
            CROP_FILTER="${CROP_VALUE},"
          else
            CROP_FILTER=""
          fi

          # إعداد الفلاتر (Anime / Realistic / Basic)
          case "$ENCODE_MODE" in
            anime)
              VF_CHAIN="${CROP_FILTER}scale=-2:${RESOLUTION}:flags=lanczos,hqdn3d=1.5:1.0:1.5:1.0,deband=1thr=0.02:2thr=0.02:3thr=0.02:range=16,format=yuv420p10le"
              ;;
            realistic)
              VF_CHAIN="${CROP_FILTER}scale=-2:${RESOLUTION}:flags=lanczos,hqdn3d=0.5:0.5:0.5:0.5,format=yuv420p10le"
              ;;
            filters)
              VF_CHAIN="${CROP_FILTER}scale=-2:${RESOLUTION}:flags=lanczos,hqdn3d=1.0:0.5:1.0:0.5,deband=1thr=0.015:2thr=0.015:3thr=0.015:range=16,format=yuv420p10le"
              ;;
            nofilters)
              VF_CHAIN="${CROP_FILTER}scale=-2:${RESOLUTION}:flags=lanczos,format=yuv420p10le"
              ;;
            *)
              echo "❌ encode_mode غير معروف: $ENCODE_MODE"
              exit 1
              ;;
          esac

          if [ "$CODEC" = "av1" ]; then
            [[ "$PRESET_INPUT" =~ ^([0-9]|1[0-3])$ ]] || { echo "❌ preset AV1 يجب أن يكون رقماً من 0 إلى 13"; exit 1; }
            VIDEO_CODEC='libsvtav1'
            VIDEO_PRESET="$PRESET_INPUT"
            SVT_PARAMS='-svtav1-params tune=0:enable-qm=1:qm-min=0'
            [ "$ENCODE_MODE" = "anime" ] && SVT_PARAMS='-svtav1-params tune=0:enable-qm=1:qm-min=0:enable-overlays=1:film-grain=6:film-grain-denoise=0'

            if [ "$ENCODE_METHOD" = "crf" ]; then
              ffmpeg -hwaccel none -y -i "$IN" -vf "$VF_CHAIN" -r 24 -c:v "$VIDEO_CODEC" -preset "$VIDEO_PRESET" -crf "$TARGET_VALUE" -g 240 $SVT_PARAMS -c:a libopus -b:a 32k -ac 2 "$OUT_FILE"
            elif [ "$ENCODE_METHOD" = "twopass" ]; then
              PASSLOG="${OUT_DIR}/passlog_${CHUNK_ID}"
              ffmpeg -hwaccel none -y -i "$IN" -vf "$VF_CHAIN" -r 24 -c:v "$VIDEO_CODEC" -preset "$VIDEO_PRESET" -b:v "$TARGET_VALUE" -g 240 -pass 1 -passlogfile "$PASSLOG" -an -f null /dev/null
              ffmpeg -hwaccel none -y -i "$IN" -vf "$VF_CHAIN" -r 24 -c:v "$VIDEO_CODEC" -preset "$VIDEO_PRESET" -b:v "$TARGET_VALUE" -g 240 -pass 2 -passlogfile "$PASSLOG" $SVT_PARAMS -c:a libopus -b:a 32k -ac 2 "$OUT_FILE"
            else
              echo "❌ طريقة AV1 يجب أن تكون crf أو twopass"; exit 1
            fi

          elif [ "$CODEC" = "vvc" ]; then
            case "$PRESET_INPUT" in
              1) P='slower' ;; 2) P='slow' ;; 3) P='fast' ;; 4) P='faster' ;;
              *) echo "❌ preset VVC يجب أن يكون 1 أو 2 أو 3 أو 4"; exit 1 ;;
            esac
            if [ "$ENCODE_METHOD" = "qp" ]; then
              ffmpeg -hwaccel none -y -i "$IN" -vf "$VF_CHAIN" -r 24 -c:v libvvenc -preset "$P" -qp "$TARGET_VALUE" -g 240 -c:a libopus -b:a 32k -ac 2 "$OUT_FILE"
            elif [ "$ENCODE_METHOD" = "vbr" ]; then
              ffmpeg -hwaccel none -y -i "$IN" -vf "$VF_CHAIN" -r 24 -c:v libvvenc -preset "$P" -b:v "$TARGET_VALUE" -g 240 -c:a libopus -b:a 32k -ac 2 "$OUT_FILE"
            else
              echo "❌ طريقة VVC يجب أن تكون qp أو vbr"; exit 1
            fi

          elif [ "$CODEC" = "audio" ]; then
            ffmpeg -y -i "$IN" -vn -c:a libopus -b:a "$TARGET_VALUE" -ac 2 "$OUT_FILE"
          else
            echo "❌ codec غير مدعوم: $CODEC"; exit 1
          fi

          if [ "$CODEC" != "audio" ]; then
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$OUT_FILE" | grep -q 'vvc\|av1' || { echo "❌ لم يتم تضمين تدفق الفيديو في الناتج"; exit 1; }
          fi
          test -s "$OUT_FILE"
          echo "✅ تم إنشاء $OUT_FILE ($(stat -c%s "$OUT_FILE") بايت)"

      - name: Upload Encoded Chunk
        uses: actions/upload-artifact@v4
        with:
          name: encoded-chunk-${{ matrix.chunk_id }}
          path: chunks_encoded/encoded_${{ matrix.chunk_id }}.*
          retention-days: 1

  merge:
    needs: [prepare-ffmpeg, split, encode]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Encoded Chunks
        uses: actions/download-artifact@v4
        with:
          pattern: encoded-chunk-*
          path: all_encoded
          merge-multiple: true

      - name: Merge & Send
        run: |
          set -euo pipefail
          cd all_encoded
          ls encoded_*.mkv 2>/dev/null | sort | sed "s/^/file '/;s/$/'/" > list.txt
          [ -s list.txt ] || { echo "❌ لا توجد أجزاء مضغوطة للدمج"; exit 1; }
          ffmpeg -f concat -safe 0 -i list.txt -c copy ../final_output.mkv
          cd ..
          test -s final_output.mkv || { echo "❌ فشل الدمج"; exit 1; }

          SIZE=$(du -h final_output.mkv | cut -f1)
          CAPTION=$(printf '✅ تم الضغط بنجاح!\n\n📦 الحجم: %s\n🎬 الترميز: %s\n⚙️ الوضع: %s' \
            "$SIZE" "${{ inputs.codec }}" "${{ inputs.encode_mode }}")

          curl -sf -F "chat_id=${{ inputs.chat_id }}" -F "document=@final_output.mkv" -F "caption=$CAPTION" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

          if [ -n "${CHANNEL_ID:-}" ]; then
            curl -sf -F "chat_id=${CHANNEL_ID}" -F "document=@final_output.mkv" -F "caption=$CAPTION" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          fi

  notify-failure:
    needs: [prepare-ffmpeg, split, encode, merge]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: Send Failure Notification
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT=$(printf '❌ فشلت عملية الضغط.\n📋 التفاصيل: %s' "$RUN_URL")
          curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${{ inputs.chat_id }}" \
            --data-urlencode text="$TEXT"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}