name: ضغط الفيديو (AV1 4.2.0 - مبني من المصدر)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط الفيديو'
        required: true
      resolution:
        description: 'الدقة (مثلاً 720)'
        required: true
      codec:
        description: 'الكوديك (av1)'
        required: true
        default: 'av1'
      chat_id:
        description: 'معرف الدردشة'
        required: true
      private:
        description: 'خصوصي (true/false)'
        required: true
      password:
        description: 'كلمة المرور (فقط لو خاص)'
        required: false
        default: ''
      content_type:
        description: 'نوع المحتوى (real, animation, animation_ultra, auto)'
        required: false
        default: 'auto'
      filename:
        description: 'اسم الملف المطلوب'
        required: false
        default: ''

concurrency:
  group: video-compression
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # المرحلة الأولى: تحميل الفيديو وبناء البيئة
  # -------------------------------------------------------------
  split-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      chunks: ${{ steps.segment.outputs.chunks }}
      video_title: ${{ steps.title.outputs.video_title }}
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تجهيز أدوات التحميل
        run: |
          echo "تجهيز البيئة" > stage.txt
          sudo apt update
          sudo apt install -y jq ffmpeg
          pip install --upgrade --pre yt-dlp

      - name: تثبيت Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: تحميل الفيديو المصدر واستخراج العنوان
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY no_proxy NO_PROXY
          echo "$YT_COOKIES" > cookies.txt
          yt-dlp -f "bv*[height<=${RESOLUTION}]+ba/b[height<=${RESOLUTION}]/best[height<=${RESOLUTION}]/bv*+ba/best" \
            --extractor-args "youtube:player_client=android,tv,web;formats=missing_pot" \
            --remote-components ejs:github \
            --merge-output-format mp4 \
            -o raw_input.mp4 \
            --cookies cookies.txt \
            --print-to-file "%(title)s" video_title_raw.txt \
            --verbose \
            "$VIDEO_URL" 2>&1 | tee ytdlp_log.txt || { echo "❌ فشل التحميل"; exit 1; }
          rm -f cookies.txt
          if [ ! -f raw_input.mp4 ]; then echo "❌ الملف لم يُنشأ"; exit 1; fi

      - name: استخراج وتنظيف اسم الفيديو الأصلي
        id: title
        run: |
          if [ -f video_title_raw.txt ]; then
            RAW_TITLE=$(head -n 1 video_title_raw.txt)
          else
            RAW_TITLE="video"
          fi
          CLEAN_TITLE=$(echo "$RAW_TITLE" | sed 's/[\/\\:*?"<>|]//g' | sed 's/  */ /g' | sed 's/^ *//;s/ *$//')
          if [ -z "$CLEAN_TITLE" ]; then
            CLEAN_TITLE="video"
          fi
          CLEAN_TITLE=$(echo "$CLEAN_TITLE" | cut -c1-100)
          echo "video_title=$CLEAN_TITLE" >> "$GITHUB_OUTPUT"
          echo "📝 العنوان المستخرج: $CLEAN_TITLE"

      - name: تقطيع الفيديو (فقط لو أطول من 20 دقيقة)
        id: segment
        run: |
          mkdir -p chunks_raw
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 raw_input.mp4 | cut -d. -f1)
          echo "⏱️ مدة الفيديو: ${DURATION} ثانية"

          if [ "$DURATION" -gt 1200 ]; then
            echo "📦 الفيديو طويل، سيتم تقطيعه للمعالجة المتوازية"
            ffmpeg -i raw_input.mp4 -c copy -f segment -segment_time 600 -reset_timestamps 1 "chunks_raw/chunk_%03d.mp4"
          else
            echo "📄 الفيديو قصير، سيُعالج كجزء واحد فقط"
            cp raw_input.mp4 "chunks_raw/chunk_000.mp4"
          fi

          CHUNKS_JSON=$(ls chunks_raw/chunk_*.mp4 | sed 's/chunks_raw\/chunk_//' | sed 's/\.mp4//' | jq -R . | jq -s -c .)
          echo "chunks=$CHUNKS_JSON" >> "$GITHUB_OUTPUT"
          echo "الأجزاء: $CHUNKS_JSON"

      - name: رفع الأجزاء الخام كـ Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw/
          retention-days: 1

  # -------------------------------------------------------------
  # المرحلة الثانية: ضغط الأجزاء (2‑Pass VBR + فلاتر تنظيف المصدر + Grain)
  # -------------------------------------------------------------
  encode-chunks:
    needs: split-video
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        chunk: ${{ fromJSON(needs.split-video.outputs.chunks) }}
      max-parallel: 10
    steps:
      - name: استعادة بناء SVT-AV1 و FFmpeg من الكاش (أو بناؤه)
        uses: actions/cache@v4
        id: cache-build
        with:
          path: ~/av1-build
          key: av1-ffmpeg-420-${{ runner.os }}-v4

      - name: تثبيت متطلبات التشغيل (libopus)
        run: |
          sudo apt update
          sudo apt install -y libopus0

      - name: بناء SVT-AV1 4.2.0 و FFmpeg (إصدار مستقر) من المصدر
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt install -y cmake nasm libopus-dev

          rm -rf SVT-AV1 FFmpeg

          git clone --depth 1 --branch v4.2.0 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cd SVT-AV1/Build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX="$HOME/av1-build"
          make -j$(nproc)
          make install
          cd ../..

          git clone --depth 1 --branch release/8.0 https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          export PKG_CONFIG_PATH="$HOME/av1-build/lib/pkgconfig"
          export LD_LIBRARY_PATH="$HOME/av1-build/lib"
          ./configure --prefix="$HOME/av1-build" --enable-libsvtav1 --enable-libopus
          make -j$(nproc)
          make install
          cd ..

      - name: تفعيل مسار FFmpeg المخصص لبقية الخطوات
        run: |
          echo "$HOME/av1-build/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/av1-build/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: التحقق الإلزامي من سلامة البناء
        run: |
          set -euo pipefail
          echo "🔍 نسخة ffmpeg:"
          which ffmpeg
          ffmpeg -version
          echo "🔍 فحص وجود فلاتر pre-processing:"
          if ! ffmpeg -filters 2>/dev/null | grep -q pp7; then
            echo "❌ فلتر pp7 غير موجود"
            exit 1
          fi
          if ! ffmpeg -filters 2>/dev/null | grep -q hqdn3d; then
            echo "❌ فلتر hqdn3d غير موجود"
            exit 1
          fi
          echo "✅ جميع الفلاتر المطلوبة موجودة"

      - name: تنزيل الجزء المخصص لهذا السيرفر
        uses: actions/download-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw

      - name: ضغط الجزء (${{ matrix.chunk }}) - 2‑Pass VBR 350k + تنظيف المصدر
        env:
          RESOLUTION: ${{ github.event.inputs.resolution }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type }}
          CHUNK_ID: ${{ matrix.chunk }}
        run: |
          set -o pipefail
          IN="chunks_raw/chunk_${CHUNK_ID}.mp4"
          OUT_DIR="chunks_encoded"
          OUT_FILE="${OUT_DIR}/encoded_${CHUNK_ID}.mkv"
          PASSLOG="passlog_${CHUNK_ID}"
          mkdir -p "$OUT_DIR"

          PRESET="6"

          # إعدادات البتريت حسب نوع المحتوى (الأنمي 350k مع فلاتر جديدة)
          case "$CONTENT_TYPE" in
            real)
              AVG_BITRATE=600
              # للمحتوى الحقيقي: نستخدم فلتر خفيف فقط لإزالة ضوضاء المصدر المضغوط
              PRE_FILTER="pp7=qp=3,hqdn3d=2:1:2:2"
              GRAIN_PARAM="film-grain=6:film-grain-denoise=1" ;;
            animation)
              AVG_BITRATE=350
              # للأنمي: تنظيف آثار H.264/H.265 بلطف
              PRE_FILTER="pp7=qp=3,hqdn3d=2:1:2:2"
              GRAIN_PARAM="film-grain=8:film-grain-denoise=1" ;;
            animation_ultra)
              AVG_BITRATE=280
              PRE_FILTER="pp7=qp=4,hqdn3d=2:1:3:3"
              GRAIN_PARAM="film-grain=10:film-grain-denoise=1" ;;
            *)
              AVG_BITRATE=350
              PRE_FILTER="pp7=qp=3,hqdn3d=2:1:2:2"
              GRAIN_PARAM="film-grain=8:film-grain-denoise=1" ;;
          esac

          # keyint=2s لعلاج الانتقالات
          SVT_PARAMS="-svtav1-params tune=0:rc=1:enable-qm=1:qm-min=0:qm-max=15:enable-overlays=1:keyint=2s:${GRAIN_PARAM}"

          echo "🎛️ AV1 2‑Pass VBR - $CONTENT_TYPE | متوسط البتريت: ${AVG_BITRATE}k | فلاتر: $PRE_FILTER | keyint=2s"

          echo "📊 المرور الأول..."
          ffmpeg -y -i "$IN" \
            -vf "${PRE_FILTER},scale=trunc(oh*a/2)*2:${RESOLUTION}" \
            -pix_fmt yuv420p10le \
            -c:v libsvtav1 -b:v "${AVG_BITRATE}k" \
            -preset $PRESET $SVT_PARAMS \
            -passlogfile "$PASSLOG" -pass 1 -an -f null /dev/null 2>&1 | tee "ffmpeg_${CHUNK_ID}_pass1.log"

          echo "📊 المرور الثاني..."
          ffmpeg -y -i "$IN" \
            -vf "${PRE_FILTER},scale=trunc(oh*a/2)*2:${RESOLUTION}" \
            -pix_fmt yuv420p10le \
            -c:v libsvtav1 -b:v "${AVG_BITRATE}k" \
            -preset $PRESET $SVT_PARAMS \
            -passlogfile "$PASSLOG" -pass 2 \
            -c:a libopus -b:a 32k -ac 2 -ar 48000 \
            -y "$OUT_FILE" 2>&1 | tee "ffmpeg_${CHUNK_ID}_pass2.log"

          if [ ! -s "$OUT_FILE" ]; then
            echo "❌ فشل ترميز الجزء ${CHUNK_ID}"
            cat "ffmpeg_${CHUNK_ID}_pass1.log"
            cat "ffmpeg_${CHUNK_ID}_pass2.log"
            exit 1
          fi
          echo "✅ تم إنشاء $OUT_FILE ($(stat -c%s "$OUT_FILE") بايت)"

      - name: رفع الجزء المضغوط
        uses: actions/upload-artifact@v4
        with:
          name: encoded-${{ matrix.chunk }}
          path: chunks_encoded/encoded_${{ matrix.chunk }}.mkv
          retention-days: 1

  # -------------------------------------------------------------
  # المرحلة الثالثة: الدمج والتشفير والرفع
  # -------------------------------------------------------------
  merge-and-send:
    needs: [split-video, encode-chunks]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تجهيز أدوات الدمج
        run: |
          echo "دمج الأجزاء ورفع الملف" > stage.txt
          sudo apt update
          sudo apt install -y ffmpeg p7zip-full
          pip install python-telegram-bot

      - name: تنزيل جميع الأجزاء المضغوطة
        uses: actions/download-artifact@v4
        with:
          pattern: encoded-*
          path: all_encoded
          merge-multiple: true

      - name: تشخيص ودمج الأجزاء
        run: |
          set -euo pipefail
          echo "دمج الأجزاء" > stage.txt

          echo "📂 محتويات مجلد all_encoded:"
          ls -la all_encoded/ 2>/dev/null || echo "❌ المجلد غير موجود إطلاقاً"

          if [ ! -d all_encoded ] || [ -z "$(ls -A all_encoded 2>/dev/null)" ]; then
            echo "❌ مجلد all_encoded فارغ أو غير موجود — على الأغلب فشلت مرحلة الضغط ولم تُرفع أي أجزاء"
            exit 1
          fi

          cd all_encoded
          rm -f concat_list.txt
          for f in $(ls encoded_*.mkv 2>/dev/null | sort); do
            echo "file '$f'" >> concat_list.txt
          done

          if [ ! -s concat_list.txt ]; then
            echo "❌ لا توجد ملفات مطابقة للنمط encoded_*.mkv"
            exit 1
          fi

          echo "📋 الملفات التي سيتم دمجها:"
          cat concat_list.txt

          ffmpeg -f concat -safe 0 -i concat_list.txt \
            -c:v copy \
            -c:a libopus -b:a 32k -ac 2 -ar 48000 \
            -y ../output.mkv

          cd ..
          if [ ! -f output.mkv ]; then
            echo "❌ فشل الدمج"
            exit 1
          fi
          echo "✅ تم الدمج بنجاح"

      - name: استخراج معلومات الفيديو (المدة والدقة الفعلية)
        id: videoinfo
        run: |
          DURATION_SEC=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output.mkv | cut -d. -f1)
          H=$((DURATION_SEC / 3600))
          M=$(((DURATION_SEC % 3600) / 60))
          S=$((DURATION_SEC % 60))
          DURATION_FMT=$(printf "%02d:%02d:%02d" $H $M $S)

          ACTUAL_RES=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 output.mkv)

          echo "duration_fmt=$DURATION_FMT" >> "$GITHUB_OUTPUT"
          echo "actual_res=$ACTUAL_RES" >> "$GITHUB_OUTPUT"
          echo "⏱️ المدة: $DURATION_FMT | 📐 الدقة الفعلية: $ACTUAL_RES"

      - name: تشفير الفيديو (فقط لو خاص - بكلمة مرور المستخدم)
        if: github.event.inputs.private == 'true'
        env:
          USER_PASSWORD: ${{ github.event.inputs.password }}
        run: |
          echo "تشفير الفيديو" > stage.txt
          if [ -z "$USER_PASSWORD" ]; then
            echo "❌ لم يتم توفير كلمة مرور للفيديو الخاص"; exit 1
          fi
          7z a -p"$USER_PASSWORD" -mhe=on output.7z output.mkv

      - name: رفع الملف النهائي وإرسال رابط التليجرام
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          PRIVATE: ${{ github.event.inputs.private }}
          USER_PASSWORD: ${{ github.event.inputs.password }}
          FILENAME: ${{ github.event.inputs.filename }}
          ORIGINAL_TITLE: ${{ needs.split-video.outputs.video_title }}
          DURATION_FMT: ${{ steps.videoinfo.outputs.duration_fmt }}
          ACTUAL_RES: ${{ steps.videoinfo.outputs.actual_res }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "رفع الملف وإرسال الرابط" > stage.txt
          TAG="video-${{ github.run_id }}"
          if [ "$PRIVATE" == "true" ]; then
            ASSET="output.7z"
          else
            ASSET="output.mkv"
          fi

          if [ -n "$FILENAME" ]; then
            BASE_NAME="$FILENAME"
          elif [ -n "$ORIGINAL_TITLE" ]; then
            BASE_NAME="$ORIGINAL_TITLE"
          else
            BASE_NAME="video"
          fi

          EXT="${ASSET##*.}"
          mv "$ASSET" "${BASE_NAME}.${EXT}"
          ASSET="${BASE_NAME}.${EXT}"

          if [ ! -f "$ASSET" ]; then
            echo "❌ ملف الإخراج غير موجود: $ASSET"
            exit 1
          fi

          SIZE_BYTES=$(stat -c%s "$ASSET")
          SIZE_MB=$(awk "BEGIN {printf \"%.1f\", $SIZE_BYTES/1048576}")
          echo "📦 حجم الملف: ${SIZE_MB}MB"

          echo "🚀 إنشاء الـ Release..."
          gh release create "$TAG" "$ASSET" --title "فيديو مضغوط" --notes "تم الضغط بنجاح"
          echo "✅ تم إنشاء الـ Release بنجاح"

          DIRECT_URL=$(gh release view "$TAG" --json assets -q '.assets[0].url')
          echo "🔗 الرابط المباشر: $DIRECT_URL"

          export DOWNLOAD_URL="$DIRECT_URL"
          export VIDEO_NAME="$BASE_NAME"
          export SIZE_MB="$SIZE_MB"

          python3 << 'EOF'
          import os, asyncio, sys
          from telegram import Bot

          async def main():
              bot = Bot(token=os.environ["BOT_TOKEN"])
              url = os.environ["DOWNLOAD_URL"]
              private = os.environ["PRIVATE"]
              password = os.environ.get("USER_PASSWORD", "")
              name = os.environ.get("VIDEO_NAME", "")
              size_mb = os.environ.get("SIZE_MB", "")
              duration = os.environ.get("DURATION_FMT", "")
              resolution = os.environ.get("ACTUAL_RES", "")

              info_lines = f"🎬 الاسم: {name}\n📦 الحجم: {size_mb} MB\n📐 الدقة: {resolution}\n⏱️ المدة: {duration}"

              if private == "true":
                  text = "✅ تم الضغط بنجاح!\n\n" + info_lines + "\n\n📥 رابط التحميل:\n" + url + "\n\n🔑 كلمة المرور:\n" + password
              else:
                  text = "✅ تم الضغط بنجاح!\n\n" + info_lines + "\n\n📥 رابط التحميل المباشر:\n" + url

              try:
                  await bot.send_message(chat_id=os.environ["CHAT_ID"], text=text)
                  print("✅ تم إرسال الرسالة بنجاح إلى تيليجرام")
              except Exception as e:
                  print(f"❌ فشل إرسال الرسالة: {e}", file=sys.stderr)
                  raise

          asyncio.run(main())
          EOF

      - name: إرسال إشعار الفشل مع التفاصيل لو حدث خطأ
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 << 'EOF'
          import os, asyncio
          from telegram import Bot

          async def main():
              bot = Bot(token=os.environ["BOT_TOKEN"])
              chat_id = os.environ["CHAT_ID"]
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

              stage = "غير معروفة"
              if os.path.exists("stage.txt"):
                  with open("stage.txt", encoding="utf-8") as f:
                      stage = f.read().strip()

              text = (
                  "❌ فشلت العملية.\n\n"
                  f"🔎 المرحلة المتأثرة: {stage}\n\n"
                  f"📋 صفحة التفاصيل والتشخيص:\n{run_url}"
              )

              await bot.send_message(chat_id=chat_id, text=text)

          asyncio.run(main())
          EOF