name: AV1 4.2.0 Test

on: workflow_dispatch

jobs:
  build-and-encode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache SVT-AV1 & FFmpeg build
        id: cache
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: av1-ffmpeg-420-${{ runner.os }}-v2

      - name: Build SVT-AV1 4.2.0 & FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update && sudo apt install -y cmake nasm
          git clone --depth 1 --branch v4.2.0 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cd SVT-AV1/Build && cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON && make -j$(nproc) && sudo make install && sudo ldconfig && cd ../..
          git clone --depth 1 --branch release/8.0 https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg && ./configure --enable-libsvtav1 && make -j$(nproc) && sudo make install && sudo ldconfig && cd ..

      - name: Create test video
        run: |
          ffmpeg -f lavfi -i testsrc2=duration=5:size=1280x720:rate=30 -f lavfi -i sine=frequency=1000:duration=5 -c:v libsvtav1 -preset 6 -crf 35 -c:a libopus -b:a 24k test_av1_420.mkv
          ls -lh test_av1_420.mkv

      - uses: actions/upload-artifact@v4
        with:
          name: test-video-av1-420
          path: test_av1_420.mkv