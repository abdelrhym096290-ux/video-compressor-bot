name: Video Compression Workflow

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط الفيديو (مباشر أو عبر yt-dlp)'
        required: true
        type: string
      filename:
        description: 'اسم الملف الأصلي/المستهدف'
        required: false
        type: string
      codec:
        description: 'الكوديك المستهدف'
        required: true
        default: 'av1'
        type: choice
        options:
          - av1
          - h265
      resolution:
        description: 'الدقة (مثال: 720, 600, 540)'
        required: true
        default: '720'
      content_type:
        description: 'نوع المحتوى'
        required: true
        default: 'animation'
        type: choice
        options:
          - animation
          - animation_ultra
          - real
      chat_id:
        description: 'معرف الشات في تلجرام (Telegram Chat ID)'
        required: false
        type: string
      private:
        description: 'تشفير الملف بكلمة سر (7z)'
        required: false
        type: boolean
        default: false
      password:
        description: 'كلمة السر للتشفير (إذا كان خاصاً)'
        required: false
        type: string

jobs:
  # -------------------------------------------------------------
  # المرحلة الأولى: تحميل وتقطيع الفيديو إلى أجزاء
  # -------------------------------------------------------------
  split-video:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
    steps:
      - name: تجهيز أدوات النظام (FFmpeg & yt-dlp)
        run: |
          sudo apt update
          sudo apt install -y ffmpeg jq
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: تحميل الفيديو الأصلي
        run: |
          mkdir -p raw_input
          yt-dlp -f "bestvideo+bestaudio/best" --merge-output-format mp4 "${{ github.event.inputs.url }}" -o "raw_input/input.mp4"

      - name: تحليل وتفكيك الفيديو
        id: split
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprintwrappers=1:nokey=1 raw_input/input.mp4 | cut -d. -f1)
          echo "⏱️ مدة الفيديو الإجمالية: ${DURATION} ثانية"
          
          mkdir -p chunks_raw
          
          if [ "$DURATION" -gt 1200 ]; then
            ffmpeg -i raw_input/input.mp4 -c copy -map 0 -segment_time 600 -f segment -reset_timestamps 1 chunks_raw/chunk_%03d.mp4
          else
            cp raw_input/input.mp4 chunks_raw/chunk_000.mp4
          fi

          CHUNKS_JSON=$(ls chunks_raw/chunk_*.mp4 | sed 's/chunks_raw\/chunk_//' | sed 's/\.mp4//' | jq -R . | jq -s -c .)
          echo "chunks=${CHUNKS_JSON}" >> $GITHUB_OUTPUT

      - name: رفع الأجزاء الخام كـ Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw/
          retention-days: 1

  # -------------------------------------------------------------
  # المرحلة الثانية: ضغط الأجزاء بالتوازي (Capped CRF)
  # -------------------------------------------------------------
  encode-chunks:
    needs: split-video
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        chunk: ${{ fromJSON(needs.split-video.outputs.chunks) }}
      max-parallel: 10
    steps:
      - name: تجهيز بيئة FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      - name: تنزيل الجزء المخصص لهذا السيرفر
        uses: actions/download-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw

      - name: ضغط الجزء (${{ matrix.chunk }})
        env:
          CODEC: ${{ github.event.inputs.codec }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type }}
          CHUNK_ID: ${{ matrix.chunk }}
        run: |
          TUNE_ARG=""
          PROFILE_ARG=""
          SVT_PARAMS=""
          RATE_ARGS=""
          
          IN="chunks_raw/chunk_${CHUNK_ID}.mp4"
          OUT_DIR="chunks_encoded"
          mkdir -p "$OUT_DIR"

          if [ "$CODEC" = "av1" ]; then
            CODEC_LIB="libsvtav1"
            PRESET="6"
            
            BASE_SVT="tune=0:enable-qm=1:keyint=240"

            case "$CONTENT_TYPE" in
              real)
                CRF=30; RATE_ARGS="-maxrate 450k -bufsize 900k"
                SVT_PARAMS="-svtav1-params ${BASE_SVT}:qm-min=0:qm-max=15:film-grain=8"
                VF_CHAIN="hqdn3d=0.5:0.5:1.5:1.5,scale=-2:${RESOLUTION}"
                ;;
              animation)
                CRF=32; RATE_ARGS="-maxrate 330k -bufsize 660k"
                SVT_PARAMS="-svtav1-params ${BASE_SVT}:qm-min=0:qm-max=15"
                VF_CHAIN="hqdn3d=1.0:1.0:2:2,scale=-2:${RESOLUTION}"
                ;;
              animation_ultra)
                CRF=36; RATE_ARGS="-maxrate 260k -bufsize 520k"
                SVT_PARAMS="-svtav1-params ${BASE_SVT}:qm-min=0:qm-max=15"
                VF_CHAIN="hqdn3d=1.5:1.5:4:4,scale=-2:${RESOLUTION}"
                ;;
              *)
                CRF=31; RATE_ARGS="-maxrate 380k -bufsize 760k"
                SVT_PARAMS="-svtav1-params ${BASE_SVT}"
                VF_CHAIN="hqdn3d=0.8:0.8:2:2,scale=-2:${RESOLUTION}"
                ;;
            esac

            echo "🎛️ AV1 - نوع المحتوى: $CONTENT_TYPE | CRF: $CRF | القيود: $RATE_ARGS"

            ffmpeg -y -i "$IN" \
              -vf "$VF_CHAIN" \
              -pix_fmt yuv420p10le \
              -c:v $CODEC_LIB -crf $CRF -preset $PRESET $SVT_PARAMS $RATE_ARGS \
              -c:a libopus -b:a 24k -ac 2 -ar 48000 \
              -y "${OUT_DIR}/encoded_${CHUNK_ID}.mkv" 2>&1 | tee "ffmpeg_${CHUNK_ID}.log"

          elif [ "$CODEC" = "h265" ]; then
            CODEC_LIB="libx265"
            PRESET="slow"
            PROFILE_ARG="-profile:v main10"

            case "$CONTENT_TYPE" in
              real) 
                CRF=24; TUNE_ARG="-tune grain"; RATE_ARGS="-maxrate 900k -bufsize 1800k"
                VF_CHAIN="hqdn3d=0.5:0.5:1.5:1.5,scale=-2:${RESOLUTION}" ;;
              animation) 
                CRF=26; TUNE_ARG="-tune animation"; RATE_ARGS="-maxrate 650k -bufsize 1300k"
                VF_CHAIN="hqdn3d=1.0:1.0:2:2,scale=-2:${RESOLUTION}" ;;
              animation_ultra) 
                CRF=30; TUNE_ARG="-tune animation"; RATE_ARGS="-maxrate 500k -bufsize 1000k"
                VF_CHAIN="hqdn3d=1.5:1.5:4:4,scale=-2:${RESOLUTION}" ;;
              *) 
                CRF=25; RATE_ARGS="-maxrate 750k -bufsize 1500k"
                VF_CHAIN="hqdn3d=0.8:0.8:2:2,scale=-2:${RESOLUTION}" ;;
            esac

            echo "🎛️ H.265 - نوع المحتوى: $CONTENT_TYPE | CRF: $CRF | القيود: $RATE_ARGS"

            ffmpeg -y -i "$IN" \
              -vf "$VF_CHAIN" \
              -pix_fmt yuv420p10le \
              -c:v $CODEC_LIB -crf $CRF -preset $PRESET $TUNE_ARG $PROFILE_ARG $RATE_ARGS \
              -c:a libopus -b:a 24k -ac 2 -ar 48000 \
              -y "${OUT_DIR}/encoded_${CHUNK_ID}.mkv" 2>&1 | tee "ffmpeg_${CHUNK_ID}.log"

          else
            echo "كوديك غير مدعوم"; exit 1
          fi

      - name: رفع الجزء المضغوط
        uses: actions/upload-artifact@v4
        with:
          name: encoded-${{ matrix.chunk }}
          path: chunks_encoded/encoded_${{ matrix.chunk }}.mkv
          retention-days: 1

  # -------------------------------------------------------------
  # المرحلة الثالثة: تجميع الفيديو النهائي والرفع
  # -------------------------------------------------------------
  merge-and-release:
    needs: [split-video, encode-chunks]
    runs-on: ubuntu-latest
    steps:
      - name: تجهيز الأدوات (FFmpeg & p7zip)
        run: |
          sudo apt update
          sudo apt install -y ffmpeg p7zip-full

      - name: تنزيل كافة الأجزاء المضغوطة
        uses: actions/download-artifact@v4
        with:
          pattern: encoded-*
          path: all_encoded
          merge-multiple: true

      - name: دمج الأجزاء بدون إعادة ضغط (-c copy)
        run: |
          mkdir -p final_output
          for f in $(ls all_encoded/encoded_*.mkv | sort); do
            echo "file '$f'" >> concat_list.txt
          done
          
          ffmpeg -f concat -safe 0 -i concat_list.txt -c copy final_output/compressed_video.mkv

      - name: التشفير بكلمة سر (في حال طلب الوضع الخاص)
        id: package
        env:
          IS_PRIVATE: ${{ github.event.inputs.private }}
          PASSWORD: ${{ github.event.inputs.password }}
        run: |
          FINAL_FILE="final_output/compressed_video.mkv"
          if [ "$IS_PRIVATE" = "true" ] && [ -n "$PASSWORD" ]; then
            echo "🔐 جاري تشفير الملف باستخدام 7z..."
            7z a -p"$PASSWORD" -mhe=on final_output/protected_video.7z "$FINAL_FILE"
            echo "FILE_TO_UPLOAD=final_output/protected_video.7z" >> $GITHUB_ENV
          else
            echo "FILE_TO_UPLOAD=$FINAL_FILE" >> $GITHUB_ENV
          fi

      - name: إنشاء GitHub Release ورفع الملف
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="release-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG_NAME" "$FILE_TO_UPLOAD" --title "الفيديو المضغوط $TAG_NAME" --notes "تم الضغط بنجاح عبر نظام الضغط المتقدم."
          
          RELEASE_URL=$(gh release view "$TAG_NAME" --json assets --jq '.assets[0].url')
          echo "DOWNLOAD_URL=$RELEASE_URL" >> $GITHUB_ENV

      - name: إرسال الرابط المباشر إلى تلجرام
        if: ${{ github.event.inputs.chat_id != '' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          MESSAGE="✅ *تم ضغط الفيديو بنجاح!*%0A%0A📌 *رابط التحميل المباشر:*%0A${DOWNLOAD_URL}"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown"
