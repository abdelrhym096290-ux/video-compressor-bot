name: ضغط الفيديو (متوازي - تمريرين للدقة)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط الفيديو'
        required: true
      resolution:
        description: 'الدقة (مثلاً 720)'
        required: true
      codec:
        description: 'الكوديك (av1, h265)'
        required: true
      chat_id:
        description: 'معرف الدردشة'
        required: true
      private:
        description: 'خصوصي (true/false)'
        required: true
      password:
        description: 'كلمة المرور (فقط لو خاص)'
        required: false
        default: ''
      content_type:
        description: 'نوع المحتوى (real, animation, animation_ultra, auto)'
        required: false
        default: 'auto'
      filename:
        description: 'اسم الملف المطلوب'
        required: false
        default: ''

concurrency:
  group: video-compression
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # المرحلة الأولى: تحميل الفيديو، استخراج عنوانه، وتقطيعه إن لزم
  # -------------------------------------------------------------
  split-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      chunks: ${{ steps.segment.outputs.chunks }}
      video_title: ${{ steps.title.outputs.video_title }}
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تجهيز أدوات التحميل والتقطيع
        run: |
          echo "تحميل وتقطيع الفيديو" > stage.txt
          sudo apt update
          sudo apt install -y ffmpeg jq
          pip install --upgrade --pre yt-dlp

      - name: تثبيت Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: تحميل الفيديو المصدر واستخراج العنوان
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY no_proxy NO_PROXY
          echo "$YT_COOKIES" > cookies.txt
          yt-dlp -f "bv*[height<=${RESOLUTION}]+ba/b[height<=${RESOLUTION}]/best[height<=${RESOLUTION}]/bv*+ba/best" \
            --extractor-args "youtube:player_client=android,tv,web;formats=missing_pot" \
            --remote-components ejs:github \
            --merge-output-format mp4 \
            -o raw_input.mp4 \
            --cookies cookies.txt \
            --print-to-file "%(title)s" video_title_raw.txt \
            --verbose \
            "$VIDEO_URL" 2>&1 | tee ytdlp_log.txt || { echo "❌ فشل التحميل"; exit 1; }
          rm -f cookies.txt
          if [ ! -f raw_input.mp4 ]; then echo "❌ الملف لم يُنشأ"; exit 1; fi

      - name: استخراج وتنظيف اسم الفيديو الأصلي
        id: title
        run: |
          if [ -f video_title_raw.txt ]; then
            RAW_TITLE=$(head -n 1 video_title_raw.txt)
          else
            RAW_TITLE="video"
          fi
          CLEAN_TITLE=$(echo "$RAW_TITLE" | sed 's/[\/\\:*?"<>|]//g' | sed 's/  */ /g' | sed 's/^ *//;s/ *$//')
          if [ -z "$CLEAN_TITLE" ]; then
            CLEAN_TITLE="video"
          fi
          CLEAN_TITLE=$(echo "$CLEAN_TITLE" | cut -c1-100)
          echo "video_title=$CLEAN_TITLE" >> "$GITHUB_OUTPUT"
          echo "📝 العنوان المستخرج: $CLEAN_TITLE"

      - name: تقطيع الفيديو (فقط لو أطول من 20 دقيقة)
        id: segment
        run: |
          mkdir -p chunks_raw
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 raw_input.mp4 | cut -d. -f1)
          echo "⏱️ مدة الفيديو: ${DURATION} ثانية"

          if [ "$DURATION" -gt 1200 ]; then
            echo "📦 الفيديو طويل، سيتم تقطيعه للمعالجة المتوازية"
            ffmpeg -i raw_input.mp4 -c copy -f segment -segment_time 600 -reset_timestamps 1 "chunks_raw/chunk_%03d.mp4"
          else
            echo "📄 الفيديو قصير، سيُعالج كجزء واحد فقط"
            cp raw_input.mp4 "chunks_raw/chunk_000.mp4"
          fi

          CHUNKS_JSON=$(ls chunks_raw/chunk_*.mp4 | sed 's/chunks_raw\/chunk_//' | sed 's/\.mp4//' | jq -R . | jq -s -c .)
          echo "chunks=$CHUNKS_JSON" >> "$GITHUB_OUTPUT"
          echo "الأجزاء: $CHUNKS_JSON"

      - name: رفع الأجزاء الخام كـ Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw/
          retention-days: 1

  # -------------------------------------------------------------
  # المرحلة الثانية: ضغط الأجزاء بتمريرين (2-Pass) بالتوازي
  # -------------------------------------------------------------
  encode-chunks:
    needs: split-video
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        chunk: ${{ fromJSON(needs.split-video.outputs.chunks) }}
      max-parallel: 10
    steps:
      - name: تجهيز بيئة FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      - name: تنزيل الجزء المخصص لهذا السيرفر
        uses: actions/download-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw

      - name: ضغط الجزء بتمريرين (${{ matrix.chunk }})
        env:
          CODEC: ${{ github.event.inputs.codec }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type }}
          CHUNK_ID: ${{ matrix.chunk }}
        run: |
          TUNE_ARG=""
          PROFILE_ARG=""
          SVT_PARAMS=""
          DENOISE="hqdn3d=1.2:1.2:3:3"
          IN="chunks_raw/chunk_${CHUNK_ID}.mp4"
          OUT_DIR="chunks_encoded"
          mkdir -p "$OUT_DIR"

          if [ "$CODEC" = "av1" ]; then
            CODEC_LIB="libsvtav1"
            PRESET="4"
            SVT_PARAMS="-svtav1-params tune=0:enable-qm=1:qm-min=0:qm-max=15:keyint=240"

            case "$CONTENT_TYPE" in
              real) BITRATE="450k"; DENOISE="hqdn3d=1.0:1.0:2:2" ;;
              animation) BITRATE="330k"; DENOISE="hqdn3d=1.5:1.5:4:4" ;;
              animation_ultra) BITRATE="245k"; DENOISE="hqdn3d=1.5:1.5:4:4" ;;
              *) BITRATE="380k" ;;
            esac

            echo "🎛️ AV1 - نوع المحتوى: $CONTENT_TYPE | البت-ريت المستهدف: $BITRATE (تمريرين)"

            LOG="pass_log_${CHUNK_ID}"

            ffmpeg -y -i "$IN" \
              -vf "${DENOISE},scale=trunc(oh*a/2)*2:${RESOLUTION}" \
              -pix_fmt yuv420p10le \
              -c:v $CODEC_LIB -b:v $BITRATE -preset $PRESET $SVT_PARAMS \
              -pass 1 -passlogfile "$LOG" -an \
              -f null /dev/null

            ffmpeg -y -i "$IN" \
              -vf "${DENOISE},scale=trunc(oh*a/2)*2:${RESOLUTION}" \
              -pix_fmt yuv420p10le \
              -c:v $CODEC_LIB -b:v $BITRATE -preset $PRESET $SVT_PARAMS \
              -pass 2 -passlogfile "$LOG" \
              -c:a libopus -b:a 20k -ac 2 -ar 48000 \
              -y "${OUT_DIR}/encoded_${CHUNK_ID}.mkv" 2>&1 | tee "ffmpeg_${CHUNK_ID}.log"

          elif [ "$CODEC" = "h265" ]; then
            CODEC_LIB="libx265"
            PRESET="slow"
            PROFILE_ARG="-profile:v main10"

            case "$CONTENT_TYPE" in
              real) BITRATE="650k"; TUNE_ARG="-tune grain" ;;
              animation) BITRATE="480k"; TUNE_ARG="-tune animation" ;;
              animation_ultra) BITRATE="380k"; TUNE_ARG="-tune animation" ;;
              *) BITRATE="550k" ;;
            esac

            echo "🎛️ H.265 - نوع المحتوى: $CONTENT_TYPE | البت-ريت المستهدف: $BITRATE (تمريرين)"

            LOG="x265_pass_${CHUNK_ID}.log"

            ffmpeg -y -i "$IN" \
              -vf "${DENOISE},scale=trunc(oh*a/2)*2:${RESOLUTION}" \
              -pix_fmt yuv420p10le \
              -c:v $CODEC_LIB -b:v $BITRATE -preset $PRESET $TUNE_ARG $PROFILE_ARG \
              -x265-params "pass=1:stats=${LOG}" -an \
              -f null /dev/null

            ffmpeg -y -i "$IN" \
              -vf "${DENOISE},scale=trunc(oh*a/2)*2:${RESOLUTION}" \
              -pix_fmt yuv420p10le \
              -c:v $CODEC_LIB -b:v $BITRATE -preset $PRESET $TUNE_ARG $PROFILE_ARG \
              -x265-params "pass=2:stats=${LOG}" \
              -c:a libopus -b:a 20k -ac 2 -ar 48000 \
              -y "${OUT_DIR}/encoded_${CHUNK_ID}.mkv" 2>&1 | tee "ffmpeg_${CHUNK_ID}.log"

          else
            echo "كوديك غير مدعوم"; exit 1
          fi

      - name: رفع الجزء المضغوط
        uses: actions/upload-artifact@v4
        with:
          name: encoded-${{ matrix.chunk }}
          path: chunks_encoded/encoded_${{ matrix.chunk }}.mkv
          retention-days: 1

  # -------------------------------------------------------------
  # المرحلة الثالثة: دمج الأجزاء، التشفير، ورفع الملف النهائي
  # -------------------------------------------------------------
  merge-and-send:
    needs: [split-video, encode-chunks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تجهيز أدوات الدمج
        run: |
          echo "دمج الأجزاء ورفع الملف" > stage.txt
          sudo apt update
          sudo apt install -y ffmpeg p7zip-full
          pip install python-telegram-bot

      - name: تنزيل جميع الأجزاء المضغوطة
        uses: actions/download-artifact@v4
        with:
          pattern: encoded-*
          path: all_encoded
          merge-multiple: true

      - name: دمج الأجزاء في فيديو واحد
        run: |
          cd all_encoded
          for f in $(ls encoded_*.mkv | sort); do echo "file '$f'" >> concat_list.txt; done
          ffmpeg -f concat -safe 0 -i concat_list.txt -c copy ../output.mkv
          cd ..
          if [ ! -f output.mkv ]; then echo "❌ فشل الدمج"; exit 1; fi

      - name: تشفير الفيديو (فقط لو خاص - بكلمة مرور المستخدم)
        if: github.event.inputs.private == 'true'
        env:
          USER_PASSWORD: ${{ github.event.inputs.password }}
        run: |
          echo "تشفير الفيديو" > stage.txt
          if [ -z "$USER_PASSWORD" ]; then
            echo "❌ لم يتم توفير كلمة مرور للفيديو الخاص"; exit 1
          fi
          7z a -p"$USER_PASSWORD" -mhe=on output.7z output.mkv

      - name: رفع الملف النهائي وإرسال رابط التليجرام
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          PRIVATE: ${{ github.event.inputs.private }}
          USER_PASSWORD: ${{ github.event.inputs.password }}
          FILENAME: ${{ github.event.inputs.filename }}
          ORIGINAL_TITLE: ${{ needs.split-video.outputs.video_title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "رفع الملف وإرسال الرابط" > stage.txt
          TAG="video-${{ github.run_id }}"
          if [ "$PRIVATE" == "true" ]; then
            ASSET="output.7z"
          else
            ASSET="output.mkv"
          fi

          if [ -n "$FILENAME" ]; then
            BASE_NAME="$FILENAME"
          elif [ -n "$ORIGINAL_TITLE" ]; then
            BASE_NAME="$ORIGINAL_TITLE"
          else
            BASE_NAME="video"
          fi

          EXT="${ASSET##*.}"
          mv "$ASSET" "${BASE_NAME}.${EXT}"
          ASSET="${BASE_NAME}.${EXT}"

          gh release create "$TAG" "$ASSET" --title "فيديو مضغوط" --notes "تم الضغط بنجاح" 2>&1 | tee upload_log.txt
          URL=$(gh release view "$TAG" --json assets -q '.assets[0].url')
          export DOWNLOAD_URL="$URL"

          python3 << 'EOF'
          import os, asyncio
          from telegram import Bot

          async def main():
              bot = Bot(token=os.environ["BOT_TOKEN"])
              url = os.environ["DOWNLOAD_URL"]
              private = os.environ["PRIVATE"]
              password = os.environ.get("USER_PASSWORD", "")

              if private == "true":
                  text = "✅ تم الضغط بنجاح!\n\n📥 رابط التحميل:\n" + url + "\n\n🔑 كلمة المرور:\n" + password
              else:
                  text = "✅ تم الضغط بنجاح!\n\n📥 رابط التحميل المباشر:\n" + url

              await bot.send_message(chat_id=os.environ["CHAT_ID"], text=text)

          asyncio.run(main())
          EOF

      - name: إرسال إشعار الفشل مع التفاصيل لو حدث خطأ
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 << 'EOF'
          import os, asyncio
          from telegram import Bot

          async def main():
              bot = Bot(token=os.environ["BOT_TOKEN"])
              chat_id = os.environ["CHAT_ID"]
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

              stage = "غير معروفة"
              if os.path.exists("stage.txt"):
                  with open("stage.txt", encoding="utf-8") as f:
                      stage = f.read().strip()

              text = (
                  "❌ فشلت العملية.\n\n"
                  f"🔎 المرحلة المتأثرة: {stage}\n\n"
                  f"📋 صفحة التفاصيل والتشخيص:\n{run_url}"
              )

              await bot.send_message(chat_id=chat_id, text=text)

          asyncio.run(main())
          EOF