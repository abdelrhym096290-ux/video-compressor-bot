name: ضغط الفيديو

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط الفيديو'
        required: true
      resolution:
        description: 'الدقة (مثلاً 720)'
        required: true
      codec:
        description: 'الكوديك (av1, h265)'
        required: true
      chat_id:
        description: 'معرف الدردشة'
        required: true
      private:
        description: 'خصوصي (true/false)'
        required: true
      content_type:
        description: 'نوع المحتوى (real, animation, auto)'
        required: false
        default: 'auto'
      filename:
        description: 'اسم الملف المطلوب'
        required: false
        default: ''

concurrency:
  group: video-compression
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: استنساخ المستودع (ضروري لأوامر gh)
        uses: actions/checkout@v4

      - name: تجهيز البيئة
        run: |
          echo "تجهيز البيئة" > stage.txt
          sudo apt update
          sudo apt install -y ffmpeg p7zip-full
          pip install --upgrade --pre yt-dlp python-telegram-bot

      - name: تثبيت Deno
        run: |
          echo "تثبيت Deno" > stage.txt
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: تحميل الفيديو (الحل النهائي - بدون --user-agent)
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          echo "تحميل الفيديو" > stage.txt
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY no_proxy NO_PROXY
          echo "$YT_COOKIES" > cookies.txt
          yt-dlp -f "bv*[height<=${RESOLUTION}]+ba/b[height<=${RESOLUTION}]/best[height<=${RESOLUTION}]/bv*+ba/best" \
            --extractor-args "youtube:player_client=android,tv,web;formats=missing_pot" \
            --remote-components ejs:github \
            --merge-output-format mp4 \
            -o input.mp4 \
            --cookies cookies.txt \
            --verbose \
            "$VIDEO_URL" 2>&1 | tee ytdlp_log.txt || { echo "❌ فشل التحميل"; exit 1; }
          rm -f cookies.txt
          if [ ! -f input.mp4 ]; then echo "❌ الملف لم يُنشأ"; exit 1; fi
          echo "✅ تم التحميل بنجاح"

      - name: ضغط الفيديو (أقصى ضغط - Preset 6 / 10-bit / Tuned)
        env:
          CODEC: ${{ github.event.inputs.codec }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type }}
        run: |
          echo "ضغط الفيديو" > stage.txt

          TUNE_ARG=""
          PROFILE_ARG=""
          SVT_PARAMS=""

          if [ "$CODEC" = "av1" ]; then
            CODEC_LIB="libsvtav1"
            PRESET="6"
            SVT_PARAMS="-svtav1-params tune=0:enable-qm=1"
            case "$CONTENT_TYPE" in
              real) CRF=34 ;;
              animation) CRF=40 ;;
              *) CRF=38 ;;
            esac

          elif [ "$CODEC" = "h265" ]; then
            CODEC_LIB="libx265"
            PRESET="slow"
            PROFILE_ARG="-profile:v main10"
            case "$CONTENT_TYPE" in
              real) CRF=27; TUNE_ARG="-tune grain" ;;
              animation) CRF=32; TUNE_ARG="-tune animation" ;;
              *) CRF=29 ;;
            esac

          else
            echo "كوديك غير مدعوم"; exit 1
          fi

          echo "🎛️ الكوديك: $CODEC | Preset: $PRESET | CRF: $CRF | 10-bit مفعّل"

          ffmpeg -i input.mp4 \
            -vf "hqdn3d=1.2:1.2:3:3,scale=trunc(oh*a/2)*2:${RESOLUTION}" \
            -pix_fmt yuv420p10le \
            -c:v $CODEC_LIB -crf $CRF -preset $PRESET $SVT_PARAMS $TUNE_ARG $PROFILE_ARG \
            -c:a libopus -b:a 24k -ar 48000 -y output.mkv 2>&1 | tee ffmpeg_log.txt

      - name: تشفير الفيديو (فقط لو خاص)
        if: github.event.inputs.private == 'true'
        id: encrypt
        run: |
          echo "تشفير الفيديو" > stage.txt
          PASSWORD=$(openssl rand -base64 12)
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"
          7z a -p"$PASSWORD" -mhe=on output.7z output.mkv

      - name: رفع الملف وإرسال رابط التحميل
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          PRIVATE: ${{ github.event.inputs.private }}
          PASSWORD: ${{ steps.encrypt.outputs.password }}
          FILENAME: ${{ github.event.inputs.filename }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "رفع الملف وإرسال الرابط" > stage.txt
          TAG="video-${{ github.run_id }}"
          if [ "$PRIVATE" == "true" ]; then
            ASSET="output.7z"
          else
            ASSET="output.mkv"
          fi
          if [ -n "$FILENAME" ]; then
            EXT="${ASSET##*.}"
            mv "$ASSET" "${FILENAME}.${EXT}"
            ASSET="${FILENAME}.${EXT}"
          fi
          gh release create "$TAG" "$ASSET" --title "فيديو مضغوط" --notes "تم الإنشاء تلقائياً" 2>&1 | tee upload_log.txt
          URL=$(gh release view "$TAG" --json assets -q '.assets[0].url')
          export DOWNLOAD_URL="$URL"

          python3 << 'EOF'
          import os, asyncio
          from telegram import Bot

          async def main():
              bot = Bot(token=os.environ["BOT_TOKEN"])
              url = os.environ["DOWNLOAD_URL"]
              private = os.environ["PRIVATE"]
              password = os.environ.get("PASSWORD", "")

              if private == "true":
                  text = "✅ تم الضغط!\n\n📥 رابط التحميل:\n" + url + "\n\n🔑 كلمة المرور:\n" + password
              else:
                  text = "✅ تم الضغط!\n\n📥 رابط التحميل المباشر:\n" + url

              await bot.send_message(chat_id=os.environ["CHAT_ID"], text=text)

          asyncio.run(main())
          EOF

      - name: رفع سجلات التشخيص كـ Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            ytdlp_log.txt
            ffmpeg_log.txt
            upload_log.txt
          if-no-files-found: warn

      - name: إرسال إشعار الفشل مع تفاصيل الخطأ إلى البوت
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          python3 << 'EOF'
          import os, asyncio
          from telegram import Bot

          async def main():
              bot = Bot(token=os.environ["BOT_TOKEN"])
              chat_id = os.environ["CHAT_ID"]
              run_url = f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"

              stage = "غير معروفة"
              if os.path.exists("stage.txt"):
                  with open("stage.txt", encoding="utf-8") as f:
                      stage = f.read().strip()

              lines = []
              for log_file in ["ffmpeg_log.txt", "ytdlp_log.txt", "upload_log.txt"]:
                  if os.path.exists(log_file):
                      with open(log_file, encoding="utf-8", errors="ignore") as f:
                          content = f.readlines()[-25:]
                      if content:
                          lines.append(f"📌 [آخر تفاصيل من {log_file}]:\n" + "".join(content))

              details = "\n\n".join(lines)[-3500:] if lines else "لا توجد تفاصيل سجلات محدودة."

              text = (
                  "❌ **حدث خطأ أثناء تنفيذ العملية!**\n\n"
                  f"🔎 **المرحلة التي فشلت:** {stage}\n\n"
                  f"📄 **تفاصيل الخطأ:**\n```\n{details}\n```\n\n"
                  f"📋 **صفحة التشغيل الكاملة:**\n{run_url}"
              )

              await bot.send_message(chat_id=chat_id, text=text, parse_mode="Markdown")

          asyncio.run(main())
          EOF
