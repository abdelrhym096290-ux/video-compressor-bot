name: ضغط الفيديو السحابي (AV1 & VVC)

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: 'معرف رسالة الفيديو في تيليجرام'
        required: false
        default: ''
      url:
        description: 'رابط مباشر اختياري'
        required: false
        default: ''
      chat_id:
        description: 'معرف الدردشة'
        required: true
      filename:
        description: 'الاسم النهائي للملف'
        required: false
        default: ''
      codec:
        description: 'av1 أو vvc أو audio'
        required: true
        default: 'av1'
      preset:
        description: 'رقم السرعة'
        required: true
        default: '8'
      encode_mode:
        description: 'series, anime, nofilters, audio'
        required: true
        default: 'series'
      encode_method:
        description: 'crf, twopass, qp, vbr, audio'
        required: true
        default: 'crf'
      target_value:
        description: 'قيمة الجودة أو معدل البت'
        required: true
        default: '28'
      resolution:
        description: 'الارتفاع النهائي (مثل 480 أو 720)'
        required: true
        default: '480'

concurrency:
  group: video-compression
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  split-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      chunks: ${{ steps.segment.outputs.chunks }}
      crop: ${{ steps.cropdetect.outputs.crop }}
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تجهيز أدوات الجلب والتقسيم
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y jq ffmpeg
          pip install telethon

      - name: تحميل الفيديو المصدر
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SOURCE_CHAT_ID: ${{ github.event.inputs.chat_id }}
          MESSAGE_ID: ${{ github.event.inputs.message_id }}
          VIDEO_URL: ${{ github.event.inputs.url }}
        run: |
          set -euo pipefail
          echo "==== بدء التشخيص ===="
          echo "الوضع: ${{ github.event.inputs.encode_mode }} | المرمز: ${{ github.event.inputs.codec }}"
          echo "====================="
          
          if [ -n "$MESSAGE_ID" ]; then
            python3 <<'PYEOF'
          import os, asyncio, sys
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["TG_API_ID"])
          api_hash = os.environ["TG_API_HASH"]
          bot_token = os.environ["BOT_TOKEN"]
          chat_id = int(os.environ["SOURCE_CHAT_ID"])
          message_id = int(os.environ["MESSAGE_ID"])

          async def main():
              client = TelegramClient(StringSession(), api_id, api_hash)
              await client.start(bot_token=bot_token)
              async with client:
                  msg = await client.get_messages(chat_id, ids=message_id)
                  if msg is None or not msg.media:
                      sys.exit(1)
                  await client.download_media(msg, file="raw_input.mp4")
          asyncio.run(main())
          PYEOF
          elif [ -n "$VIDEO_URL" ]; then
            curl -fL --retry 3 -o raw_input.mp4 "$VIDEO_URL"
          else
            echo 'لا توجد رسالة تيليجرام ولا رابط مباشر.' >&2
            exit 1
          fi
          test -s raw_input.mp4

      - name: اكتشاف الحواف السوداء (Cropdetect)
        id: cropdetect
        run: |
          set -euo pipefail
          CROP_VAL=$(ffmpeg -hwaccel none -i raw_input.mp4 -vf "cropdetect=24:16:0" -frames:v 100 -f null - 2>&1 | awk '/crop=/ {print $NF}' | tail -n1 || true)
          echo "crop=${CROP_VAL}" >> "$GITHUB_OUTPUT"
          echo "تم اكتشاف أبعاد القص: ${CROP_VAL}"

      - name: تقطيع المصدر إلى أجزاء MKV مستقلة (300 ثانية)
        id: segment
        run: |
          set -euo pipefail
          mkdir -p chunks_raw
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 raw_input.mp4 | cut -d. -f1)
          # تقطيع كل 300 ثانية (5 دقائق) وتحويلها إلى MKV لضمان التزامن
          if [ "$DURATION" -gt 350 ]; then
            ffmpeg -y -hwaccel none -i raw_input.mp4 -c copy -f segment -segment_time 300 -reset_timestamps 1 "chunks_raw/chunk_%03d.mkv"
          else
            ffmpeg -y -hwaccel none -i raw_input.mp4 -c copy "chunks_raw/chunk_000.mkv"
          fi
          CHUNKS_JSON=$(ls chunks_raw/chunk_*.mkv | sed 's#chunks_raw/chunk_##' | sed 's/\.mkv//' | jq -R . | jq -s -c .)
          echo "chunks=$CHUNKS_JSON" >> "$GITHUB_OUTPUT"

      - name: رفع الأجزاء الخام
        uses: actions/upload-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw/
          retention-days: 1

  prepare-codec-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: استعادة بناء المرّمّز وFFmpeg
        if: github.event.inputs.codec != 'audio'
        uses: actions/cache@v4
        id: cache-build
        with:
          path: ~/codec-build
          key: codec-ffmpeg-${{ github.event.inputs.codec }}-universal-v3

      - name: بناء AV1 أو VVC مع مكتبة DAV1D
        if: github.event.inputs.codec != 'audio' && steps.cache-build.outputs.cache-hit != 'true'
        env:
          CODEC: ${{ github.event.inputs.codec }}
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y cmake nasm pkg-config libopus-dev libdav1d-dev
          rm -rf SVT-AV1 vvenc FFmpeg "$HOME/codec-build"

          if [ "$CODEC" = "av1" ]; then
            git clone --depth 1 --branch v4.2.0 https://gitlab.com/AOMediaCodec/SVT-AV1.git
            cmake -S SVT-AV1 -B SVT-AV1/Build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX="$HOME/codec-build"
            cmake --build SVT-AV1/Build --parallel "$(nproc)"
            cmake --install SVT-AV1/Build
            ENABLE_CODEC='--enable-libsvtav1'
          else
            git clone --depth 1 https://github.com/fraunhoferhhi/vvenc.git
            cmake -S vvenc -B vvenc/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX="$HOME/codec-build"
            cmake --build vvenc/build --parallel "$(nproc)"
            cmake --install vvenc/build
            ENABLE_CODEC='--enable-libvvenc'
          fi

          git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git
          export PKG_CONFIG_PATH="$HOME/codec-build/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="$HOME/codec-build/lib:${LD_LIBRARY_PATH:-}"
          cd FFmpeg
          # تفعيل libdav1d لضمان فك تشفير الفيديوهات المصدر بصيغة AV1
          ./configure --prefix="$HOME/codec-build" --enable-gpl --enable-version3 "$ENABLE_CODEC" --enable-libopus --enable-libdav1d
          make -j"$(nproc)"
          make install

  encode-chunks:
    needs: [split-video, prepare-codec-build]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.split-video.outputs.chunks) }}
      max-parallel: 10
    steps:
      - name: استعادة بناء المرّمّز وFFmpeg
        if: github.event.inputs.codec != 'audio'
        uses: actions/cache@v4
        with:
          path: ~/codec-build
          key: codec-ffmpeg-${{ github.event.inputs.codec }}-universal-v3

      - name: تجهيز FFmpeg
        env:
          CODEC: ${{ github.event.inputs.codec }}
        run: |
          set -euo pipefail
          if [ "$CODEC" = "audio" ]; then
            sudo apt update
            sudo apt install -y ffmpeg libopus0
          else
            sudo apt update
            sudo apt install -y libopus0 libdav1d7
            test -x "$HOME/codec-build/bin/ffmpeg"
            export LD_LIBRARY_PATH="$HOME/codec-build/lib:${LD_LIBRARY_PATH:-}"
            echo "$HOME/codec-build/bin" >> "$GITHUB_PATH"
            echo "LD_LIBRARY_PATH=$HOME/codec-build/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          fi

      - name: تنزيل الجزء المخصص
        uses: actions/download-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw

      - name: ضغط الجزء وتركيب الفلاتر
        env:
          CODEC: ${{ github.event.inputs.codec }}
          PRESET_INPUT: ${{ github.event.inputs.preset }}
          ENCODE_MODE: ${{ github.event.inputs.encode_mode }}
          ENCODE_METHOD: ${{ github.event.inputs.encode_method }}
          TARGET_VALUE: ${{ github.event.inputs.target_value }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
          CHUNK_ID: ${{ matrix.chunk }}
          CROP_VAL: ${{ needs.split-video.outputs.crop }}
        run: |
          set -euo pipefail
          IN="chunks_raw/chunk_${CHUNK_ID}.mkv"
          OUT_DIR="chunks_encoded"
          OUT_FILE="${OUT_DIR}/encoded_${CHUNK_ID}.mkv"
          mkdir -p "$OUT_DIR"
          test -s "$IN"

          if [ "$CODEC" = "audio" ]; then
            ffmpeg -y -i "$IN" -vn -c:a libopus -b:a "$TARGET_VALUE" -ac 2 "$OUT_FILE"
            test -s "$OUT_FILE"
            exit 0
          fi

          # التحقق من المدخلات الأساسية
          case "$CODEC" in
            av1)
              VIDEO_CODEC='libsvtav1'
              VIDEO_PRESET="$PRESET_INPUT"
              ;;
            vvc)
              case "$PRESET_INPUT" in
                1) VIDEO_PRESET='slower' ;;
                2) VIDEO_PRESET='slow' ;;
                3) VIDEO_PRESET='fast' ;;
                4) VIDEO_PRESET='faster' ;;
                *) VIDEO_PRESET='fast' ;;
              esac
              VIDEO_CODEC='libvvenc'
              ;;
          esac

          # بناء الفلاتر بناءً على الـ Crop ونوع المحتوى (ذكاء الفلاتر)
          CROP_FILTER=""
          if [ -n "$CROP_VAL" ] && [[ "$CROP_VAL" == crop=* ]]; then
            CROP_FILTER="${CROP_VAL},"
          fi

          if [ "$ENCODE_MODE" = "series" ]; then
            # مسلسلات: تنعيم خفيف + تصغير، وحذف unsharp لتقليل الحجم
            VF_CHAIN="${CROP_FILTER}hqdn3d=1.5:1.5:6:6,scale=-2:${RESOLUTION}:flags=lanczos,format=yuv420p10le"
          elif [ "$ENCODE_MODE" = "anime" ]; then
            # أنمي: تنعيم أقوى + deband لتنظيف المساحات اللونية وتقليل الحجم + تصغير
            VF_CHAIN="${CROP_FILTER}hqdn3d=4.0:3.0:6.0:4.5,deband=1thr=0.015:2thr=0.015:3thr=0.015:range=16,scale=-2:${RESOLUTION}:flags=lanczos,format=yuv420p10le"
          else
            # بدون فلاتر: قص + تصغير فقط
            VF_CHAIN="${CROP_FILTER}scale=-2:${RESOLUTION}:flags=lanczos,format=yuv420p10le"
          fi

          # إعدادات متقدمة لـ AV1
          SVT_PARAMS=""
          if [ "$CODEC" = "av1" ]; then
            SVT_PARAMS='-svtav1-params tune=0:enable-qm=1:qm-min=0'
            if [ "$ENCODE_MODE" = "series" ] || [ "$ENCODE_MODE" = "anime" ]; then
              SVT_PARAMS='-svtav1-params tune=0:enable-qm=1:qm-min=0:enable-overlays=1:film-grain=4:film-grain-denoise=0'
            fi
          fi

          # أمر الترميز النهائي مع فرض hwaccel none للإدخال و إجبار r 24 للإخراج
          if [ "$CODEC" = "av1" ]; then
            if [ "$ENCODE_METHOD" = "crf" ]; then
              ffmpeg -y -hwaccel none -i "$IN" -vf "$VF_CHAIN" -r 24 -c:v "$VIDEO_CODEC" -preset "$VIDEO_PRESET" -crf "$TARGET_VALUE" -g 240 $SVT_PARAMS -c:a libopus -b:a 32k -ac 2 "$OUT_FILE"
            else
              PASSLOG="${OUT_DIR}/passlog_${CHUNK_ID}"
              ffmpeg -y -hwaccel none -i "$IN" -vf "$VF_CHAIN" -r 24 -c:v "$VIDEO_CODEC" -preset "$VIDEO_PRESET" -b:v "$TARGET_VALUE" -g 240 -pass 1 -passlogfile "$PASSLOG" -an -f null /dev/null
              ffmpeg -y -hwaccel none -i "$IN" -vf "$VF_CHAIN" -r 24 -c:v "$VIDEO_CODEC" -preset "$VIDEO_PRESET" -b:v "$TARGET_VALUE" -g 240 -pass 2 -passlogfile "$PASSLOG" $SVT_PARAMS -c:a libopus -b:a 32k -ac 2 "$OUT_FILE"
            fi
          else
            # ترميز VVC
            if [ "$ENCODE_METHOD" = "qp" ]; then
              ffmpeg -y -hwaccel none -i "$IN" -vf "$VF_CHAIN" -r 24 -c:v "$VIDEO_CODEC" -preset "$VIDEO_PRESET" -qp "$TARGET_VALUE" -g 240 -c:a libopus -b:a 32k -ac 2 "$OUT_FILE"
            else
              ffmpeg -y -hwaccel none -i "$IN" -vf "$VF_CHAIN" -r 24 -c:v "$VIDEO_CODEC" -preset "$VIDEO_PRESET" -b:v "$TARGET_VALUE" -g 240 -c:a libopus -b:a 32k -ac 2 "$OUT_FILE"
            fi
          fi

          # التحقق من نجاح الترميز وتواجد تدفق الفيديو
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$OUT_FILE" | grep -q 'vvc\|av1' || { echo 'خطأ: تدفق الفيديو غير موجود!' >&2; exit 1; }
          test -s "$OUT_FILE"

      - name: رفع الجزء المضغوط
        uses: actions/upload-artifact@v4
        with:
          name: encoded-${{ matrix.chunk }}
          path: chunks_encoded/encoded_${{ matrix.chunk }}.mkv
          retention-days: 1

  merge-and-send:
    needs: [split-video, encode-chunks, prepare-codec-build]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: تجهيز أدوات الدمج والإرسال
        env:
          CODEC: ${{ github.event.inputs.codec }}
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y ffmpeg libopus0
          pip install telethon

      - name: تنزيل الأجزاء المُعَالَجَة
        uses: actions/download-artifact@v4
        with:
          pattern: encoded-*
          path: all_encoded
          merge-multiple: true

      - name: دمج الأجزاء النهائية (MKV Container)
        run: |
          set -euo pipefail
          cd all_encoded
          rm -f concat_list.txt
          for f in $(ls encoded_*.mkv | sort); do echo "file '$f'" >> concat_list.txt; done
          ffmpeg -f concat -safe 0 -i concat_list.txt -c copy -y ../output.mkv

      - name: استخراج معلومات الناتج
        id: videoinfo
        env:
          CODEC: ${{ github.event.inputs.codec }}
        run: |
          DURATION_SEC=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output.mkv | cut -d. -f1)
          H=$((DURATION_SEC/3600)); M=$(((DURATION_SEC%3600)/60)); S=$((DURATION_SEC%60))
          echo "duration_fmt=$(printf '%02d:%02d:%02d' $H $M $S)" >> "$GITHUB_OUTPUT"
          
          if [ "$CODEC" = "audio" ]; then
            echo 'actual_res=صوت فقط 🎵' >> "$GITHUB_OUTPUT"
          else
            ACTUAL_RES=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 output.mkv)
            echo "actual_res=$ACTUAL_RES" >> "$GITHUB_OUTPUT"
          fi

      - name: إعداد الاسم النهائي
        id: naming
        env:
          FILENAME: ${{ github.event.inputs.filename }}
        run: |
          sanitize() { printf '%s' "$1" | head -n1 | tr -d '\r' | sed 's/[\/\\:*?"<>|]/ /g' | sed 's/  */ /g' | sed 's/^ *//;s/ *$//'; }
          SAFE_FILENAME=$(sanitize "$FILENAME")
          echo "final_name=${SAFE_FILENAME:-video}" >> "$GITHUB_OUTPUT"

      - name: رفع الناتج إلى تيليجرام
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          FINAL_NAME: ${{ steps.naming.outputs.final_name }}
          DURATION_FMT: ${{ steps.videoinfo.outputs.duration_fmt }}
          ACTUAL_RES: ${{ steps.videoinfo.outputs.actual_res }}
        run: |
          set -euo pipefail
          UPLOAD_FILE="${FINAL_NAME}.mkv"
          mv output.mkv "$UPLOAD_FILE"
          
          FILE_SIZE=$(stat -c%s "$UPLOAD_FILE")
          SIZE_MB=$(awk -v size="$FILE_SIZE" 'BEGIN {printf "%.1f", size/1048576}')
          export UPLOAD_FILE SIZE_MB

          python3 <<'PYEOF'
          import os, asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          
          api_id = int(os.environ["TG_API_ID"])
          api_hash = os.environ["TG_API_HASH"]
          session = os.environ["TG_SESSION"]
          channel_id = int(os.environ["TG_CHANNEL_ID"])
          file = os.environ["UPLOAD_FILE"]
          
          caption = f"🎬 {os.environ['FINAL_NAME']}\n📐 {os.environ['ACTUAL_RES']}\n⏱️ {os.environ['DURATION_FMT']}"
          
          async def main():
              client = TelegramClient(StringSession(session), api_id, api_hash)
              await client.start()
              await client.send_file(channel_id, file, caption=caption, force_document=True)
          asyncio.run(main())
          PYEOF

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="✅ تم الضغط والإرسال للقناة بنجاح!%0A%0A🎬 ${FINAL_NAME}%0A📦 ${SIZE_MB} MB%0A📐 ${ACTUAL_RES}%0A⏱️ ${DURATION_FMT}"

      - name: إشعار الفشل
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="❌ فشلت العملية في المصنع (GitHub Actions).%0A📋 راجع التفاصيل هنا: ${run_url}"
