name: Video Compressor Factory

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط الفيديو'
        required: true
      resolution:
        description: 'الجودة المطلوبة'
        required: true
        default: '720'
      codec:
        description: 'الكوديك (av1 أو h265)'
        required: true
        default: 'av1'
      chat_id:
        description: 'معرف الشات في تلجرام'
        required: true
      private:
        description: 'هل الفيديو تشفير خاص'
        required: false
        default: 'false'
      password:
        description: 'كلمة مرور التشفير'
        required: false
        default: ''
      content_type:
        description: 'نوع المحتوى'
        required: false
        default: 'auto'
      filename:
        description: 'اسم الملف المخصص'
        required: false
        default: ''

jobs:
  compress:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تثبيت الأدوات المطلوبة (FFmpeg & yt-dlp & 7z)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg p7zip-full
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: تنزيل الفيديو
        run: |
          mkdir -p input_video
          cd input_video
          yt-dlp -f "bestvideo+bestaudio/best" --no-playlist -o "input.%(ext)s" "${{ github.event.inputs.url }}"
          INPUT_FILE=$(ls input.* | head -n 1)
          echo "INPUT_FILE_PATH=input_video/$INPUT_FILE" >> $GITHUB_ENV

      - name: تحديد اسم الملف ومسار المخرجات
        run: |
          CUSTOM_NAME="${{ github.event.inputs.filename }}"
          if [ -n "$CUSTOM_NAME" ]; then
            BASE_NAME="$CUSTOM_NAME"
          else
            BASE_NAME="video_$(date +%s)"
          fi
          
          mkdir -p final_output
          echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV
          echo "FINAL_MKV_PATH=final_output/${BASE_NAME}.mkv" >> $GITHUB_ENV

      - name: ضغط الفيديو باستخدام FFmpeg
        run: |
          INPUT="${{ env.INPUT_FILE_PATH }}"
          OUTPUT="${{ env.FINAL_MKV_PATH }}"
          RES="${{ github.event.inputs.resolution }}"
          CODEC="${{ github.event.inputs.codec }}"
          CONTENT_TYPE="${{ github.event.inputs.content_type }}"

          # إعدادات الكوديك
          preset="6"
          crf="32"
          vcodec="libsvtav1"

          if [ "$CODEC" = "h265" ]; then
            preset="medium"
            crf="28"
            vcodec="libx265"
          fi

          # إعدادات تحسين نوع المحتوى
          TUNE_OPTS=""
          if [ "$CONTENT_TYPE" = "animation" ] || [ "$CONTENT_TYPE" = "animation_ultra" ]; then
            if [ "$CODEC" = "av1" ]; then TUNE_OPTS="-svtav1-params tune=0"; fi
            if [ "$CODEC" = "h265" ]; then TUNE_OPTS="-tune animation"; fi
          fi

          ffmpeg -i "$INPUT" \
            -vf "scale=-2:${RES}" \
            -c:v $vcodec $TUNE_OPTS -preset $preset -crf $crf \
            -c:a libopus -b:a 96k \
            "$OUTPUT"

      - name: التشفير واستخراج بيانات التلجرام
        id: package
        env:
          IS_PRIVATE: ${{ github.event.inputs.private }}
          PASSWORD: ${{ github.event.inputs.password }}
        run: |
          FINAL_MKV="${{ env.FINAL_MKV_PATH }}"
          BASE_NAME="${{ env.BASE_NAME }}"

          FILE_SIZE=$(du -h "$FINAL_MKV" | cut -f1)
          
          # تصحيح noprint_wrappers وإضافة قيمة افتراضية لحماية السكربت من التوقف
          DUR_SEC=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$FINAL_MKV" | cut -d. -f1)
          DUR_SEC=${DUR_SEC:-0}
          
          DUR_FORMATTED=$(printf '%02d:%02d:%02d' $(($DUR_SEC/3600)) $(($DUR_SEC%3600/60)) $(($DUR_SEC%60)))
          
          RES=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$FINAL_MKV")

          if [ "$IS_PRIVATE" = "true" ] && [ -n "$PASSWORD" ]; then
            echo "🔐 جاري تشفير الملف..."
            ZIP_PATH="final_output/${BASE_NAME}.7z"
            7z a -p"$PASSWORD" -mhe=on "$ZIP_PATH" "$FINAL_MKV"
            echo "FILE_TO_UPLOAD=$ZIP_PATH" >> $GITHUB_ENV
          else
            echo "FILE_TO_UPLOAD=$FINAL_MKV" >> $GITHUB_ENV
          fi

          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          echo "DUR_FORMATTED=$DUR_FORMATTED" >> $GITHUB_ENV
          echo "RES=$RES" >> $GITHUB_ENV

      - name: إنشاء GitHub Release ورفع الملف
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ github.run_id }}"
          name: "فيديو مضغوط: ${{ env.BASE_NAME }}"
          files: ${{ env.FILE_TO_UPLOAD }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: إرسال النتيجة إلى التلجرام
        if: always()
        env:
          BASE_NAME: ${{ env.BASE_NAME }}
          RES: ${{ env.RES }}
          DUR_FORMATTED: ${{ env.DUR_FORMATTED }}
          FILE_SIZE: ${{ env.FILE_SIZE }}
          FILE_TO_UPLOAD: ${{ env.FILE_TO_UPLOAD }}
        run: |
          python3 -c '
          import os, urllib.parse, urllib.request, json

          chat_id = "${{ github.event.inputs.chat_id }}"
          bot_token = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          base_name = os.environ.get("BASE_NAME", "")
          res = os.environ.get("RES", "")
          dur = os.environ.get("DUR_FORMATTED", "")
          size = os.environ.get("FILE_SIZE", "")
          file_to_upload = os.environ.get("FILE_TO_UPLOAD", "")
          repo = "${{ github.repository }}"
          run_id = "${{ github.run_id }}"

          if not bot_token or not chat_id:
              print("❌ خطأ: TELEGRAM_BOT_TOKEN غير موجود في Secrets أو chat_id فارغ!")
              exit(1)

          file_name = os.path.basename(file_to_upload)
          encoded_file_name = urllib.parse.quote(file_name)
          release_url = f"https://github.com/{repo}/releases/download/release-{run_id}/{encoded_file_name}"

          msg = f"""🎬 <b>تم ضغط الفيديو بنجاح!</b>

          📌 <b>الاسم:</b> <code>{base_name}</code>
          📐 <b>الأبعاد:</b> <code>{res}</code>
          ⏱️ <b>المدة:</b> <code>{dur}</code>
          📦 <b>الحجم النهائي:</b> <code>{size}</code>

          ⬇️ <a href="{release_url}">اضغط هنا لتحميل الملف مباشرة</a>"""

          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          payload = json.dumps({
              "chat_id": chat_id,
              "text": msg,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }).encode("utf-8")

          req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})
          
          try:
              with urllib.request.urlopen(req) as resp:
                  print("✅ تم الإرسال بنجاح إلى تلجرام:", resp.read().decode())
          except Exception as e:
              print("❌ فشل الإرسال من تلجرام:", e)
              exit(1)
          '
