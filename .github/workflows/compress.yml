name: ضغط الفيديو (AV1 - احترافي شامل)

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: 'معرف رسالة الفيديو'
        required: false
        default: ''
      url:
        description: 'رابط مباشر (إن وجد)'
        required: false
        default: ''
      resolution:
        description: 'الدقة (مثلاً 480)'
        required: true
        default: '480'
      encode_mode:
        description: 'نوع المعالجة (filters, nofilters, audio)'
        required: true
        default: 'filters'
      av1_preset:
        description: 'البريست (8, 7, 6, 4)'
        required: false
        default: '4'
      encode_method:
        description: 'طريقة الضغط (crf, twopass, audio)'
        required: true
        default: 'crf'
      target_value:
        description: 'القيمة المستهدفة (مثلاً 28 أو 250k)'
        required: true
        default: '28'
      chat_id:
        description: 'معرف الدردشة'
        required: true
      private:
        description: 'خصوصي (true/false)'
        required: true
      password:
        description: 'كلمة المرور'
        required: false
        default: ''
      filename:
        description: 'الاسم النهائي للملف'
        required: false
        default: ''

concurrency:
  group: video-compression
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  split-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      chunks: ${{ steps.segment.outputs.chunks }}
      video_title: ${{ steps.title.outputs.video_title }}
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تجهيز أدوات التحميل
        run: |
          echo "تجهيز البيئة" > stage.txt
          sudo apt update
          sudo apt install -y jq ffmpeg
          pip install telethon

      - name: تحميل الفيديو المصدر
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SOURCE_CHAT_ID: ${{ github.event.inputs.chat_id }}
          MESSAGE_ID: ${{ github.event.inputs.message_id }}
          VIDEO_URL: ${{ github.event.inputs.url }}
        run: |
          echo "تحميل الفيديو" > stage.txt

          if [ -n "$MESSAGE_ID" ]; then
            python3 <<'PYEOF'
          import os, asyncio, sys
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["TG_API_ID"])
          api_hash = os.environ["TG_API_HASH"]
          bot_token = os.environ["BOT_TOKEN"]
          chat_id = int(os.environ["SOURCE_CHAT_ID"])
          message_id = int(os.environ["MESSAGE_ID"])

          async def main():
              client = TelegramClient(StringSession(), api_id, api_hash)
              await client.start(bot_token=bot_token)
              async with client:
                  msg = await client.get_messages(chat_id, ids=message_id)
                  if msg is None or not msg.media:
                      sys.exit(1)
                  path = await client.download_media(msg, file="raw_input.mp4")
          asyncio.run(main())
          PYEOF
          elif [ -n "$VIDEO_URL" ]; then
            curl -L -o raw_input.mp4 "$VIDEO_URL" || exit 1
          else
            exit 1
          fi

          if [ ! -f raw_input.mp4 ]; then exit 1; fi

      - name: استخراج اسم الفيديو الأصلي
        id: title
        run: |
          echo "video_title=video" >> "$GITHUB_OUTPUT"

      - name: تقطيع الفيديو
        id: segment
        run: |
          mkdir -p chunks_raw
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 raw_input.mp4 | cut -d. -f1)
          if [ "$DURATION" -gt 1200 ]; then
            ffmpeg -i raw_input.mp4 -c copy -f segment -segment_time 600 -reset_timestamps 1 "chunks_raw/chunk_%03d.mp4"
          else
            cp raw_input.mp4 "chunks_raw/chunk_000.mp4"
          fi
          CHUNKS_JSON=$(ls chunks_raw/chunk_*.mp4 | sed 's/chunks_raw\/chunk_//' | sed 's/\.mp4//' | jq -R . | jq -s -c .)
          echo "chunks=$CHUNKS_JSON" >> "$GITHUB_OUTPUT"

      - name: رفع الأجزاء الخام
        uses: actions/upload-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw/
          retention-days: 1

  encode-chunks:
    needs: split-video
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        chunk: ${{ fromJSON(needs.split-video.outputs.chunks) }}
      max-parallel: 10
    steps:
      - name: استعادة بناء SVT-AV1 و FFmpeg
        uses: actions/cache@v4
        id: cache-build
        with:
          path: ~/av1-build
          key: av1-ffmpeg-simple-420-${{ runner.os }}-v1

      - name: تثبيت المتطلبات
        run: |
          sudo apt update
          sudo apt install -y libopus0

      - name: بناء البنية
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt install -y cmake nasm libopus-dev
          rm -rf SVT-AV1 FFmpeg

          git clone --depth 1 --branch v4.2.0 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cd SVT-AV1/Build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX="$HOME/av1-build"
          make -j$(nproc)
          make install
          cd ../..

          git clone --depth 1 --branch release/8.0 https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          export PKG_CONFIG_PATH="$HOME/av1-build/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="$HOME/av1-build/lib"
          ./configure --prefix="$HOME/av1-build" --enable-gpl --enable-version3 --enable-libsvtav1 --enable-libopus
          make -j$(nproc)
          make install

      - name: تفعيل مسار FFmpeg
        run: |
          echo "$HOME/av1-build/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/av1-build/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: تنزيل الجزء المخصص
        uses: actions/download-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw

      - name: المعالجة المتقدمة (الفلاتر والشروط)
        env:
          RESOLUTION: ${{ github.event.inputs.resolution }}
          ENCODE_MODE: ${{ github.event.inputs.encode_mode }}
          AV1_PRESET: ${{ github.event.inputs.av1_preset }}
          ENCODE_METHOD: ${{ github.event.inputs.encode_method }}
          TARGET_VALUE: ${{ github.event.inputs.target_value }}
          CHUNK_ID: ${{ matrix.chunk }}
        run: |
          set -o pipefail
          IN="chunks_raw/chunk_${CHUNK_ID}.mp4"
          OUT_DIR="chunks_encoded"
          OUT_FILE="${OUT_DIR}/encoded_${CHUNK_ID}.mkv"
          mkdir -p "$OUT_DIR"

          # 🌟 التفرقة بين المسلسلات والأنمي
          if [ "$ENCODE_MODE" == "filters" ]; then
            echo "🎭 وضع المسلسلات: تفعيل الفلاتر"
            VF_CHAIN="scale=-2:${RESOLUTION},hqdn3d=3:2:2:3,deband,cas=0.4,format=yuv420p10le"
            SVT_PARAMS="-svtav1-params film-grain=10:film-grain-denoise=1"
          elif [ "$ENCODE_MODE" == "nofilters" ]; then
            echo "🌸 وضع الأنمي: بدون فلاتر تنعيم"
            VF_CHAIN="scale=-2:${RESOLUTION},format=yuv420p10le"
            SVT_PARAMS="-svtav1-params tune=0"
          else
            VF_CHAIN=""
            SVT_PARAMS=""
          fi

          # 🌟 تنفيذ المعالجة بناءً على الطريقة المطلوبة
          if [ "$ENCODE_METHOD" == "crf" ]; then
            echo "🎛️ نظام CRF | القيمة: $TARGET_VALUE | Preset: $AV1_PRESET"
            ffmpeg -y -i "$IN" \
              -vf "$VF_CHAIN" \
              -c:v libsvtav1 -preset "$AV1_PRESET" -crf "$TARGET_VALUE" -g 240 \
              $SVT_PARAMS \
              -c:a libopus -b:a 32k -ac 2 "$OUT_FILE"

          elif [ "$ENCODE_METHOD" == "twopass" ]; then
            echo "⚖️ نظام التمريرتين (Two-Pass) | الهدف: $TARGET_VALUE | Preset: $AV1_PRESET"
            ffmpeg -y -i "$IN" \
              -vf "$VF_CHAIN" \
              -c:v libsvtav1 -preset 8 -b:v "$TARGET_VALUE" -pass 1 \
              -an -f null /dev/null
              
            ffmpeg -y -i "$IN" \
              -vf "$VF_CHAIN" \
              -c:v libsvtav1 -preset "$AV1_PRESET" -b:v "$TARGET_VALUE" -pass 2 \
              $SVT_PARAMS \
              -c:a libopus -b:a 32k -ac 2 "$OUT_FILE"

          elif [ "$ENCODE_METHOD" == "audio" ]; then
            echo "🎵 استخراج الصوت فقط | Bitrate: $TARGET_VALUE"
            ffmpeg -y -i "$IN" \
              -vn -c:a libopus -b:a "$TARGET_VALUE" -ac 2 "$OUT_FILE"
          fi

          if [ ! -s "$OUT_FILE" ]; then exit 1; fi

      - name: رفع الجزء المضغوط
        uses: actions/upload-artifact@v4
        with:
          name: encoded-${{ matrix.chunk }}
          path: chunks_encoded/encoded_${{ matrix.chunk }}.mkv
          retention-days: 1

  merge-and-send:
    needs: [split-video, encode-chunks]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تجهيز أدوات الدمج
        run: |
          sudo apt update
          sudo apt install -y ffmpeg p7zip-full
          pip install telethon

      - name: تنزيل جميع الأجزاء
        uses: actions/download-artifact@v4
        with:
          pattern: encoded-*
          path: all_encoded
          merge-multiple: true

      - name: دمج الأجزاء
        run: |
          set -euo pipefail
          cd all_encoded
          rm -f concat_list.txt
          for f in $(ls encoded_*.mkv | sort); do echo "file '$f'" >> concat_list.txt; done
          ffmpeg -f concat -safe 0 -i concat_list.txt -c copy -y ../output.mkv
          cd ..

      - name: استخراج معلومات الفيديو
        id: videoinfo
        env:
          ENCODE_METHOD: ${{ github.event.inputs.encode_method }}
        run: |
          DURATION_SEC=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output.mkv | cut -d. -f1)
          H=$((DURATION_SEC/3600)); M=$(((DURATION_SEC%3600)/60)); S=$((DURATION_SEC%60))
          DURATION_FMT=$(printf "%02d:%02d:%02d" $H $M $S)
          echo "duration_fmt=$DURATION_FMT" >> "$GITHUB_OUTPUT"
          
          if [ "$ENCODE_METHOD" == "audio" ]; then
            echo "actual_res=صوت فقط 🎵" >> "$GITHUB_OUTPUT"
          else
            ACTUAL_RES=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 output.mkv)
            echo "actual_res=$ACTUAL_RES" >> "$GITHUB_OUTPUT"
          fi

      - name: إعداد الاسم النهائي
        id: naming
        env:
          FILENAME: ${{ github.event.inputs.filename }}
        run: |
          sanitize() { printf '%s' "$1" | head -n1 | tr -d '\r' | sed 's/[\/\\:*?"<>|]/ /g' | sed 's/  */ /g' | sed 's/^ *//;s/ *$//'; }
          SAFE_FILENAME=$(sanitize "$FILENAME")
          echo "final_name=${SAFE_FILENAME:-video}" >> "$GITHUB_OUTPUT"

      - name: تشفير (خاص فقط)
        if: github.event.inputs.private == 'true'
        env:
          USER_PASSWORD: ${{ github.event.inputs.password }}
          FINAL_NAME: ${{ steps.naming.outputs.final_name }}
        run: |
          mv output.mkv "${FINAL_NAME}.mkv"
          7z a -p"$USER_PASSWORD" -mhe=on "${FINAL_NAME}.7z" "${FINAL_NAME}.mkv"

      - name: رفع الملف إلى تيليجرام
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          FINAL_NAME: ${{ steps.naming.outputs.final_name }}
          PRIVATE: ${{ github.event.inputs.private }}
          DURATION_FMT: ${{ steps.videoinfo.outputs.duration_fmt }}
          ACTUAL_RES: ${{ steps.videoinfo.outputs.actual_res }}
        run: |
          if [ "$PRIVATE" == "true" ]; then
            UPLOAD_FILE="${FINAL_NAME}.7z"
          else
            UPLOAD_FILE="${FINAL_NAME}.mkv"
            if [ -f "output.mkv" ]; then mv output.mkv "$UPLOAD_FILE"; fi
          fi

          SIZE_MB=$(awk "BEGIN {printf \"%.1f\", $(stat -c%s \"$UPLOAD_FILE\")/1048576}")
          export UPLOAD_FILE SIZE_MB

          python3 <<'PYEOF'
          import os, asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          api_id = int(os.environ["TG_API_ID"])
          api_hash = os.environ["TG_API_HASH"]
          session = os.environ["TG_SESSION"]
          channel_id = int(os.environ["TG_CHANNEL_ID"])
          file = os.environ["UPLOAD_FILE"]
          caption = f"🎬 {os.environ['FINAL_NAME']}\n📐 {os.environ['ACTUAL_RES']}\n⏱️ {os.environ['DURATION_FMT']}"
          async def main():
              client = TelegramClient(StringSession(session), api_id, api_hash)
              await client.start()
              await client.send_file(channel_id, file, caption=caption, force_document=True)
          with TelegramClient(StringSession(session), api_id, api_hash) as client:
              client.loop.run_until_complete(main())
          PYEOF

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="✅ تم الضغط بنجاح!%0A%0A🎬 ${FINAL_NAME}%0A📦 ${SIZE_MB} MB%0A📐 ${ACTUAL_RES}%0A⏱️ ${DURATION_FMT}"

      - name: إشعار الفشل
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="❌ فشلت العملية.%0A📋 التفاصيل: ${run_url}"
