name: compress1

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'الأمر الذي سيُنفذ'
        required: true
        default: 'echo مرحبا'

concurrency:
  group: fox-ai-terminal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  execute:
    name: تنفيذ الأمر
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: تجهيز البيئة
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip git curl

      - name: تنفيذ الأمر
        id: execute
        env:
          USER_COMMAND: ${{ github.event.inputs.command }}
        run: |
          set +e
          OUTPUT=$(eval "$USER_COMMAND" 2>&1)
          EXIT_CODE=$?
          set -e
          
          echo "=== OUTPUT ==="
          echo "$OUTPUT"
          echo "=== END ==="
          
          {
            echo "stdout=$OUTPUT"
            echo "exit_code=$EXIT_CODE"
          } >> result.txt
          
          cat result.txt

      - name: إرسال النتيجة إلى العامل
        run: |
          OUTPUT=$(cat result.txt | sed 's/"/\\"/g' | tr '\n' ' ')
          
          curl -X POST "https://fox1-ai.abdelrhym096290.workers.dev/result" \
            -H "Content-Type: application/json" \
            -d "{\"output\":\"$OUTPUT\"}"