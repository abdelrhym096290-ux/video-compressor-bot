name: مقارنة البكسلات بالمنحنيات

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط مباشر للصورة الحقيقية'
        required: true
      epsilon:
        description: 'دقة المنحنيات (1.0 أدق، 3.0 أخشن)'
        required: true
        default: '1.5'

concurrency:
  group: image-compare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-compare:
    name: تشغيل المقارنة
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: استخراج الكود
        uses: actions/checkout@v4

      - name: تجهيز الأدوات
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y python3-opencv
          pip install --user --break-system-packages numpy

      - name: تشغيل المقارنة
        env:
          IMAGE_URL: ${{ github.event.inputs.url }}
          EPSILON: ${{ github.event.inputs.epsilon }}
        run: |
          set -euo pipefail
          python3 curve_video_codec.py "$IMAGE_URL" results --epsilon "$EPSILON"
          
          echo "=== النتائج ==="
          cat results/results.json

      - name: رفع النتائج
        uses: actions/upload-artifact@v4
        with:
          name: image-compare-results
          path: results/
          retention-days: 7
          if-no-files-found: error