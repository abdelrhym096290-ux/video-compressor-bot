name: مقارنة البكسلات بالمنحنيات مع رفع تيليجرام

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط مباشر للصورة الحقيقية'
        required: true
      epsilon:
        description: 'دقة المنحنيات (1.0 أدق، 3.0 أخشن)'
        required: true
        default: '1.5'

concurrency:
  group: image-compare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-compare:
    name: تشغيل المقارنة
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: استخراج الكود
        uses: actions/checkout@v4

      - name: تجهيز الأدوات
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y python3-opencv
          pip install --user --break-system-packages numpy

      - name: تشغيل المقارنة
        env:
          IMAGE_URL: ${{ github.event.inputs.url }}
          EPSILON: ${{ github.event.inputs.epsilon }}
        run: |
          set -euo pipefail
          python3 curve_video_codec.py "$IMAGE_URL" results --epsilon "$EPSILON"
          
          echo "=== النتائج ==="
          cat results/results.json

      - name: رفع النتائج إلى تيليجرام
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: |
          set -euo pipefail
          pip install --user --break-system-packages telethon
          
          python3 << 'PYEOF'
          import asyncio
          import os
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              client = TelegramClient(
                  StringSession(os.environ["TG_SESSION"]),
                  int(os.environ["TG_API_ID"]),
                  os.environ["TG_API_HASH"],
              )
              await client.start()
              async with client:
                  # إرسال النتائج
                  with open("results/results.json", "rb") as f:
                      await client.send_file(
                          int(os.environ["TG_CHANNEL_ID"]),
                          f,
                          caption="📊 نتائج المقارنة",
                          force_document=True,
                      )
                  
                  # إرسال الصورة الأصلية
                  await client.send_file(
                      int(os.environ["TG_CHANNEL_ID"]),
                      "results/original.png",
                      caption="🖼️ الصورة الأصلية",
                      force_document=True,
                  )
                  
                  # إرسال كل مستويات إعادة البناء
                  for quant in [32, 16, 8, 1]:
                      path = f"results/quant_{quant}/reconstructed.png"
                      if os.path.exists(path):
                          await client.send_file(
                              int(os.environ["TG_CHANNEL_ID"]),
                              path,
                              caption=f"🔬 إعادة البناء (تكميم={quant})",
                              force_document=True,
                          )

          asyncio.run(main())
          PYEOF

      - name: رفع النتائج
        uses: actions/upload-artifact@v4
        with:
          name: image-compare-results
          path: results/
          retention-days: 7
          if-no-files-found: error