name: تجربة الترميز بالخريطة المتحركة مقابل AV1

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط مباشر لفيديو تجريبي (mp4/mkv)'
        required: true
      start_time:
        description: 'بداية العينة، مثل 00:00:10'
        required: true
        default: '00:00:00'
      duration:
        description: 'مدة العينة بالثواني (يُنصح بـ 5-15 لتجربة أولى سريعة)'
        required: true
        default: '10'
      resolution:
        description: 'الارتفاع النهائي للعينة، مثل 480'
        required: true
        default: '480'
      frame_rate:
        description: 'معدل الإطارات للعينة'
        required: true
        default: '12'
      block_size:
        description: 'حجم كتلة الخريطة بالبكسل'
        required: true
        default: '16'
      flat_threshold:
        description: 'أقصى انحراف لاعتبار الكتلة مسطحة'
        required: true
        default: '6.0'
      gradient_threshold:
        description: 'أقصى خطأ لاعتبار الكتلة متدرجة خطيًا'
        required: true
        default: '10.0'
      av1_crf:
        description: 'قيمة CRF لترميز AV1 المرجعي للمقارنة (0-63)'
        required: true
        default: '28'
      av1_preset:
        description: 'رقم preset لـ SVT-AV1 (0-13)'
        required: true
        default: '8'

permissions:
  contents: read

jobs:
  run-experiment:
    name: تشغيل التجربة ومقارنتها بـ AV1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: استعادة بناء FFmpeg/SVT-AV1 الموحد إن وُجد
        id: cache-build
        uses: actions/cache@v4
        with:
          path: ~/codec-build
          key: codec-universal-av1-vvc-dav1d-ubuntu-24.04-v4

      - name: بناء AV1 فقط إذا لم يوجد الكاش (أخف من البناء الكامل مع VVC)
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y build-essential cmake git nasm pkg-config libdav1d-dev libogg-dev libopus-dev
          rm -rf "$HOME/codec-build" "$HOME/codec-sources"
          mkdir -p "$HOME/codec-build" "$HOME/codec-sources"
          cd "$HOME/codec-sources"
          git clone --depth 1 --branch v4.2.0 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cmake -S SVT-AV1 -B SVT-AV1/Build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX="$HOME/codec-build"
          cmake --build SVT-AV1/Build --parallel "$(nproc)"
          cmake --install SVT-AV1/Build
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git
          export PKG_CONFIG_PATH="$HOME/codec-build/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="$HOME/codec-build/lib:${LD_LIBRARY_PATH:-}"
          cd FFmpeg
          ./configure --prefix="$HOME/codec-build" --enable-gpl --enable-version3 --disable-doc \
            --enable-libopus --enable-libdav1d --enable-libsvtav1 \
            --extra-cflags="-I$HOME/codec-build/include" --extra-ldflags="-L$HOME/codec-build/lib"
          make -j"$(nproc)"
          make install

      - name: تجهيز أدوات بايثون
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y ffmpeg libdav1d-dev libopus0
          pip install --user --break-system-packages numpy pillow

      - name: كتابة سكربت الترميز التجريبي (base64 بسطر واحد لتفادي أي مشاكل إزاحة)
        run: |
          echo "" | base64 -d > region_map_codec.py
          python3 -c "import ast; ast.parse(open('region_map_codec.py').read())"
          echo 'تم فك ترميز السكربت والتحقق من صحته نحويًا.'
      - name: تحميل عينة الفيديو المصدر
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 30 -o raw_input.mp4 "$VIDEO_URL"
          test -s raw_input.mp4

      - name: قص العينة القصيرة وتوحيد الدقة/الإطارات
        env:
          START_TIME: ${{ github.event.inputs.start_time }}
          DURATION: ${{ github.event.inputs.duration }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
          FRAME_RATE: ${{ github.event.inputs.frame_rate }}
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -nostdin -y -ss "$START_TIME" -i raw_input.mp4 -t "$DURATION" \
            -vf "scale=-2:${RESOLUTION}:flags=lanczos" -r "$FRAME_RATE" -an \
            -c:v libx264 -crf 10 sample_clip.mp4
          test -s sample_clip.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 sample_clip.mp4

      - name: استخراج إطارات PNG من العينة
        run: |
          set -euo pipefail
          mkdir -p frames_png
          ffmpeg -hide_banner -nostdin -y -i sample_clip.mp4 frames_png/frame_%04d.png
          ls frames_png | wc -l

      - name: تشغيل مرمّز الخريطة التجريبي على كل الإطارات
        env:
          BLOCK_SIZE: ${{ github.event.inputs.block_size }}
          FLAT_THRESHOLD: ${{ github.event.inputs.flat_threshold }}
          GRADIENT_THRESHOLD: ${{ github.event.inputs.gradient_threshold }}
        run: |
          set -euo pipefail
          python3 region_map_codec.py frames_png \
            --block-size "$BLOCK_SIZE" \
            --flat-threshold "$FLAT_THRESHOLD" \
            --gradient-threshold "$GRADIENT_THRESHOLD" \
            --save-recon-dir frames_reconstructed \
            --report map_experiment_report.json

      - name: ترميز نفس العينة بـ AV1 كمرجع للمقارنة
        env:
          AV1_CRF: ${{ github.event.inputs.av1_crf }}
          AV1_PRESET: ${{ github.event.inputs.av1_preset }}
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$HOME/codec-build/lib:${LD_LIBRARY_PATH:-}"
          "$HOME/codec-build/bin/ffmpeg" -hide_banner -nostdin -y -i sample_clip.mp4 \
            -c:v libsvtav1 -preset "$AV1_PRESET" -crf "$AV1_CRF" -g 240 -an av1_reference.mkv
          test -s av1_reference.mkv

      - name: بناء تقرير المقارنة النهائي
        run: |
          set -euo pipefail
          MAP_TOTAL=$(python3 -c "import json;print(json.load(open('map_experiment_report.json'))['total_bytes_sum'])")
          MAP_ONLY=$(python3 -c "import json;print(json.load(open('map_experiment_report.json'))['map_bytes_sum'])")
          DETAIL_ONLY=$(python3 -c "import json;print(json.load(open('map_experiment_report.json'))['detail_bytes_sum'])")
          AV1_SIZE=$(stat -c%s av1_reference.mkv)
          N_FRAMES=$(ls frames_png | wc -l)

          {
            echo "## نتيجة تجربة الخريطة المتحركة مقابل AV1"
            echo ""
            echo "| المقياس | القيمة |"
            echo "|---|---|"
            echo "| عدد الإطارات | $N_FRAMES |"
            echo "| حجم AV1 المرجعي (الفيديو كاملاً بترميز الحركة الحقيقي) | $AV1_SIZE بايت |"
            echo "| حجم إطارات الخريطة+التفاصيل (بدون ترميز حركة بين الإطارات، كل إطار مستقل) | $MAP_TOTAL بايت |"
            echo "| — منه: حجم الخريطة وحدها | $MAP_ONLY بايت |"
            echo "| — منه: حجم بيانات التفاصيل | $DETAIL_ONLY بايت |"
            echo ""
            echo "**تنبيه منهجي مهم:** هذه المقارنة الأولية *غير عادلة تمامًا* لصالح AV1، لأن AV1 يستفيد"
            echo "من التنبؤ الزمني بين الإطارات المتتالية (inter-frame prediction)، بينما هذا النموذج الأولي"
            echo "يرمّز كل إطار بمعزل عن الإطارات الأخرى (intra-only). لذلك إن كان حجم AV1 أصغر هنا، فهذا"
            echo "متوقع ولا ينفي الفكرة؛ المقارنة الأدق تكون بين هذا النموذج و AV1 بترميز all-intra، أو"
            echo "بإضافة تنبؤ زمني بسيط بين إطارات الخريطة كخطوة تالية."
          } >> "$GITHUB_STEP_SUMMARY"

          cp map_experiment_report.json comparison_summary.json
          python3 -c "import json; d = json.load(open('map_experiment_report.json')); d['av1_reference_bytes'] = $AV1_SIZE; d['note'] = 'مقارنة intra-only للخريطة مقابل AV1 بترميز حركة كامل - غير متكافئة منهجيًا، انظر ملخص المهمة'; json.dump(d, open('comparison_summary.json', 'w'), ensure_ascii=False, indent=2)"

      - name: رفع نتائج التجربة كملفات
        uses: actions/upload-artifact@v4
        with:
          name: map-experiment-results
          path: |
            comparison_summary.json
            map_experiment_report.json
            av1_reference.mkv
            sample_clip.mp4
            frames_reconstructed/
          retention-days: 7