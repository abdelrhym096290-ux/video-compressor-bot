name: بوت الضغط الشخصي - AV1 مع طبقة الخريطة التكيفية

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط مباشر للفيديو المصدر'
        required: true
      filename:
        description: 'الاسم النهائي، من دون امتداد'
        required: true
      resolution:
        description: 'الارتفاع النهائي، مثل 480 أو 720 أو 1080'
        required: true
        default: '480'
      crf:
        description: 'قيمة CRF لـ AV1 (0-63، أقل = جودة أعلى وحجم أكبر)'
        required: true
        default: '28'
      preset:
        description: 'رقم preset لـ SVT-AV1 (0-13، أقل = أبطأ وأفضل ضغطًا)'
        required: true
        default: '8'

# مهمة واحدة في كل مرة لهذا المستودع، والبقية تنتظر بالترتيب.
concurrency:
  group: video-compression-map-layer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-codec-build:
    name: بناء FFmpeg وSVT-AV1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: استعادة بناء FFmpeg/SVT-AV1
        id: cache-build
        uses: actions/cache@v4
        with:
          path: ~/codec-build
          key: codec-map-layer-av1-dav1d-x264-ubuntu-24.04-v2

      - name: بناء SVT-AV1 وFFmpeg إذا لم يوجد الكاش
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y build-essential cmake git nasm pkg-config libdav1d-dev libogg-dev libopus-dev libx264-dev
          rm -rf "$HOME/codec-build" "$HOME/codec-sources"
          mkdir -p "$HOME/codec-build" "$HOME/codec-sources"
          cd "$HOME/codec-sources"
          git clone --depth 1 --branch v4.2.0 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cmake -S SVT-AV1 -B SVT-AV1/Build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX="$HOME/codec-build"
          cmake --build SVT-AV1/Build --parallel "$(nproc)"
          cmake --install SVT-AV1/Build
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git
          export PKG_CONFIG_PATH="$HOME/codec-build/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="$HOME/codec-build/lib:${LD_LIBRARY_PATH:-}"
          cd FFmpeg
          ./configure --prefix="$HOME/codec-build" --enable-gpl --enable-version3 --disable-doc \
            --enable-libopus --enable-libdav1d --enable-libsvtav1 --enable-libx264 \
            --extra-cflags="-I$HOME/codec-build/include" --extra-ldflags="-L$HOME/codec-build/lib"
          make -j"$(nproc)"
          make install

      - name: فحص البناء
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y libdav1d-dev libopus0 libx264-dev
          export LD_LIBRARY_PATH="$HOME/codec-build/lib:${LD_LIBRARY_PATH:-}"
          test -x "$HOME/codec-build/bin/ffmpeg"
          "$HOME/codec-build/bin/ffmpeg" -hide_banner -encoders | grep -q 'libsvtav1'
          "$HOME/codec-build/bin/ffmpeg" -hide_banner -encoders | grep -q 'libx264'

  split-video:
    name: تحميل المصدر وتقطيعه
    needs: prepare-codec-build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      chunks: ${{ steps.segment.outputs.chunks }}
      crop: ${{ steps.detect_crop.outputs.crop }}
    steps:
      - name: تجهيز الأدوات
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y ffmpeg jq libdav1d-dev libopus0

      - name: استعادة FFmpeg الموحد
        uses: actions/cache@v4
        with:
          path: ~/codec-build
          key: codec-map-layer-av1-dav1d-x264-ubuntu-24.04-v2

      - name: تحميل الفيديو المصدر
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 30 -o raw_input.mp4 "$VIDEO_URL"
          test -s raw_input.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 raw_input.mp4 >/dev/null

      - name: اكتشاف الأشرطة السوداء
        id: detect_crop
        run: |
          set -euo pipefail
          FFMPEG="$HOME/codec-build/bin/ffmpeg"
          FFPROBE="$HOME/codec-build/bin/ffprobe"
          export LD_LIBRARY_PATH="$HOME/codec-build/lib:${LD_LIBRARY_PATH:-}"
          SOURCE_CODEC=$("$FFPROBE" -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 raw_input.mp4 || true)
          DECODER_ARGS=()
          if [ "$SOURCE_CODEC" = "av1" ]; then DECODER_ARGS=(-c:v libdav1d); fi
          CROP=$("$FFMPEG" -hide_banner -nostdin -hwaccel none "${DECODER_ARGS[@]}" -i raw_input.mp4 \
            -frames:v 100 -an -vf 'cropdetect=24:16:0' -f null - 2>&1 \
            | grep -oE 'crop=[0-9]+:[0-9]+:[0-9]+:[0-9]+' | tail -n 1 || true)
          if [ -z "$CROP" ]; then CROP=none; fi
          echo "crop=$CROP" >> "$GITHUB_OUTPUT"

      - name: تقسيم المصدر إلى أجزاء MKV
        id: segment
        run: |
          set -euo pipefail
          mkdir -p chunks_raw
          FFPROBE="$HOME/codec-build/bin/ffprobe"
          FFMPEG="$HOME/codec-build/bin/ffmpeg"
          export LD_LIBRARY_PATH="$HOME/codec-build/lib:${LD_LIBRARY_PATH:-}"
          DURATION=$("$FFPROBE" -v error -show_entries format=duration -of csv=p=0 raw_input.mp4 | cut -d. -f1)
          test -n "$DURATION"
          if [ "$DURATION" -gt 1200 ]; then
            "$FFMPEG" -hide_banner -nostdin -y -i raw_input.mp4 \
              -map 0 -c copy -f segment -segment_time 300 \
              -reset_timestamps 1 -avoid_negative_ts make_zero \
              'chunks_raw/chunk_%03d.mkv'
          else
            "$FFMPEG" -hide_banner -nostdin -y -i raw_input.mp4 \
              -map 0 -c copy -avoid_negative_ts make_zero \
              chunks_raw/chunk_000.mkv
          fi
          find chunks_raw -maxdepth 1 -type f -name 'chunk_*.mkv' -size +0c | sort >/tmp/chunks.txt
          test -s /tmp/chunks.txt
          CHUNKS_JSON=$(sed 's#^.*/chunk_##; s#\.mkv$##' /tmp/chunks.txt | jq -R . | jq -s -c .)
          echo "chunks=$CHUNKS_JSON" >> "$GITHUB_OUTPUT"

      - name: رفع الأجزاء الخام
        uses: actions/upload-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw/
          retention-days: 1
          if-no-files-found: error

  encode-chunks:
    name: معالجة مسبقة بالخريطة + ترميز AV1
    needs: [prepare-codec-build, split-video]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        chunk: ${{ fromJSON(needs.split-video.outputs.chunks) }}
    steps:
      - name: استعادة سكربت الترميز المنحني
        uses: actions/checkout@v4
      - name: تنزيل الجزء الخام
        uses: actions/download-artifact@v4
        with:
          name: raw-chunks
          path: chunks_raw

      - name: استعادة FFmpeg الموحد
        uses: actions/cache@v4
        with:
          path: ~/codec-build
          key: codec-map-layer-av1-dav1d-x264-ubuntu-24.04-v2

      - name: تجهيز بايثون وFFmpeg
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y ffmpeg libdav1d-dev libopus0 python3-opencv
          pip install --user --break-system-packages numpy pillow

      - name: معالجة الجزء وترميزه
        env:
          RESOLUTION: ${{ github.event.inputs.resolution }}
          CRF: ${{ github.event.inputs.crf }}
          PRESET: ${{ github.event.inputs.preset }}
          CROP_FILTER: ${{ needs.split-video.outputs.crop }}
          CHUNK_ID: ${{ matrix.chunk }}
        run: |
          set -euo pipefail
          IN="chunks_raw/chunk_${CHUNK_ID}.mkv"
          OUT_DIR="chunks_encoded"
          mkdir -p "$OUT_DIR"
          test -s "$IN"

          [[ "$RESOLUTION" =~ ^[0-9]{3,4}$ ]] || { echo 'الدقة يجب أن تكون رقمًا صحيحًا.' >&2; exit 1; }
          (( RESOLUTION >= 144 && RESOLUTION <= 2160 )) || { echo 'الدقة خارج النطاق المسموح.' >&2; exit 1; }
          [[ "$CRF" =~ ^([0-9]|[1-5][0-9]|6[0-3])$ ]] || { echo 'CRF يجب أن يكون من 0 إلى 63.' >&2; exit 1; }
          [[ "$PRESET" =~ ^([0-9]|1[0-3])$ ]] || { echo 'preset يجب أن يكون رقمًا من 0 إلى 13.' >&2; exit 1; }

          FFMPEG="$HOME/codec-build/bin/ffmpeg"
          FFPROBE="$HOME/codec-build/bin/ffprobe"
          export LD_LIBRARY_PATH="$HOME/codec-build/lib:${LD_LIBRARY_PATH:-}"

          # إعداد الفلاتر المشتركة
          FILTERS=("setpts=PTS-STARTPTS")
          if [ -n "$CROP_FILTER" ] && [ "$CROP_FILTER" != "none" ]; then
            FILTERS+=("$CROP_FILTER")
          fi
          FILTERS+=("scale=-2:${RESOLUTION}:flags=lanczos")
          VF_CHAIN=$(IFS=,; printf '%s' "${FILTERS[*]}")

          INPUT_CODEC=$("$FFPROBE" -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$IN")
          DECODER_ARGS=()
          if [ "$INPUT_CODEC" = "av1" ]; then DECODER_ARGS=(-c:v libdav1d); fi

          # المسار 1: الترميز التقليدي (AV1 مباشرة)
          echo "=== بدء الترميز التقليدي (بدون تهجين) ==="
          START_TRADITIONAL=$(date +%s)
          "$FFMPEG" -hide_banner -nostdin -hwaccel none "${DECODER_ARGS[@]}" -y -i "$IN" \
            -vf "$VF_CHAIN" -r 24 -fps_mode cfr \
            -c:v libsvtav1 -preset "$PRESET" -crf "$CRF" -g 240 \
            -svtav1-params tune=0:enable-qm=1:qm-min=0 \
            -c:a libopus -b:a 32k -ac 2 \
            "${OUT_DIR}/traditional_${CHUNK_ID}.mkv"
          END_TRADITIONAL=$(date +%s)
          TIME_TRADITIONAL=$((END_TRADITIONAL - START_TRADITIONAL))
          echo "الترميز التقليدي استغرق: ${TIME_TRADITIONAL} ثانية"

          # المسار 2: الترميز المهجن (مع المعالجة المسبقة)
          echo "=== بدء الترميز المهجن (مع التهجين) ==="
          START_HYBRID=$(date +%s)

          # الخطوة 1: توحيد الدقة وقص الأشرطة السوداء وتوحيد الإطارات
          "$FFMPEG" -hide_banner -nostdin -hwaccel none "${DECODER_ARGS[@]}" -y -i "$IN" \
            -vf "$VF_CHAIN" -r 24 -fps_mode cfr -an \
            -c:v libx264 -preset ultrafast -crf 0 -pix_fmt yuv420p \
            "${OUT_DIR}/normalized_${CHUNK_ID}.mp4"

          # الخطوة 2: المعالجة المسبقة الموجّهة بالخريطة
          export PATH="$HOME/codec-build/bin:$PATH"
          python3 curve_prefilter.py \
            "${OUT_DIR}/normalized_${CHUNK_ID}.mp4" \
            "${OUT_DIR}/filtered_${CHUNK_ID}.mp4" \
            --palette-size 16 --curve-epsilon 0.002 \
            --metadata "${OUT_DIR}/curve_${CHUNK_ID}.json.gz"

          # الخطوة 3: ترميز AV1 على النسخة المُنظَّفة
          "$FFMPEG" -hide_banner -nostdin -y -i "${OUT_DIR}/filtered_${CHUNK_ID}.mp4" \
            -i "$IN" \
            -map 0:v:0 -map 1:a:0? \
            -c:v libsvtav1 -preset "$PRESET" -crf "$CRF" -g 240 \
            -svtav1-params tune=0:enable-qm=1:qm-min=0 \
            -c:a libopus -b:a 32k -ac 2 -shortest \
            "${OUT_DIR}/hybrid_${CHUNK_ID}.mkv"
          END_HYBRID=$(date +%s)
          TIME_HYBRID=$((END_HYBRID - START_HYBRID))
          echo "الترميز المهجن استغرق: ${TIME_HYBRID} ثانية"

          # التحقق من النواتج
          test -s "${OUT_DIR}/traditional_${CHUNK_ID}.mkv"
          test -s "${OUT_DIR}/hybrid_${CHUNK_ID}.mkv"
          "$FFPROBE" -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "${OUT_DIR}/traditional_${CHUNK_ID}.mkv" \
            | grep -q '^av1$' || { echo 'خطأ: الترميز التقليدي لا يحتوي AV1.' >&2; exit 1; }
          "$FFPROBE" -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "${OUT_DIR}/hybrid_${CHUNK_ID}.mkv" \
            | grep -q '^av1$' || { echo 'خطأ: الترميز المهجن لا يحتوي AV1.' >&2; exit 1; }

          # حساب الأحجام
          SIZE_TRADITIONAL=$(stat -c%s "${OUT_DIR}/traditional_${CHUNK_ID}.mkv")
          SIZE_HYBRID=$(stat -c%s "${OUT_DIR}/hybrid_${CHUNK_ID}.mkv")

          # حفظ معلومات المقارنة
          echo "traditional_size=${SIZE_TRADITIONAL}" > "${OUT_DIR}/compare_${CHUNK_ID}.txt"
          echo "hybrid_size=${SIZE_HYBRID}" >> "${OUT_DIR}/compare_${CHUNK_ID}.txt"
          echo "traditional_time=${TIME_TRADITIONAL}" >> "${OUT_DIR}/compare_${CHUNK_ID}.txt"
          echo "hybrid_time=${TIME_HYBRID}" >> "${OUT_DIR}/compare_${CHUNK_ID}.txt"

          # تنظيف الملفات المؤقتة
          rm -f "${OUT_DIR}/normalized_${CHUNK_ID}.mp4" "${OUT_DIR}/filtered_${CHUNK_ID}.mp4"

      - name: رفع الأجزاء المضغوطة
        uses: actions/upload-artifact@v4
        with:
          name: encoded-${{ matrix.chunk }}
          path: |
            chunks_encoded/traditional_${{ matrix.chunk }}.mkv
            chunks_encoded/hybrid_${{ matrix.chunk }}.mkv
            chunks_encoded/compare_${{ matrix.chunk }}.txt
          retention-days: 1
          if-no-files-found: error

  merge-and-send:
    name: دمج الناتج ورفعه لقناة تيليجرام
    needs: [prepare-codec-build, split-video, encode-chunks]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: استعادة FFmpeg الموحد
        uses: actions/cache@v4
        with:
          path: ~/codec-build
          key: codec-map-layer-av1-dav1d-x264-ubuntu-24.04-v2

      - name: تجهيز أدوات الدمج والإرسال
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y ffmpeg libdav1d-dev libopus0
          python3 -m pip install --user telethon

      - name: تنزيل جميع الأجزاء المضغوطة
        uses: actions/download-artifact@v4
        with:
          pattern: encoded-*
          path: all_encoded
          merge-multiple: true

      - name: دمج الأجزاء وحساب المقارنة
        run: |
          set -euo pipefail
          FFMPEG="$HOME/codec-build/bin/ffmpeg"
          FFPROBE="$HOME/codec-build/bin/ffprobe"
          export LD_LIBRARY_PATH="$HOME/codec-build/lib:${LD_LIBRARY_PATH:-}"
          cd all_encoded

          # دمج الترميز التقليدي
          find . -maxdepth 1 -type f -name "traditional_*.mkv" | sort > /tmp/traditional_files.txt
          test -s /tmp/traditional_files.txt
          sed "s#^./#file '#; s#\$#'#" /tmp/traditional_files.txt > concat_traditional.txt
          "$FFMPEG" -hide_banner -nostdin -y -f concat -safe 0 -i concat_traditional.txt -map 0 -c copy "../traditional_output.mkv"

          # دمج الترميز المهجن
          find . -maxdepth 1 -type f -name "hybrid_*.mkv" | sort > /tmp/hybrid_files.txt
          test -s /tmp/hybrid_files.txt
          sed "s#^./#file '#; s#\$#'#" /tmp/hybrid_files.txt > concat_hybrid.txt
          "$FFMPEG" -hide_banner -nostdin -y -f concat -safe 0 -i concat_hybrid.txt -map 0 -c copy "../hybrid_output.mkv"

          # حساب الأحجام الكلية
          SIZE_TRADITIONAL=$(stat -c%s "../traditional_output.mkv")
          SIZE_HYBRID=$(stat -c%s "../hybrid_output.mkv")

          # حساب أوقات المعالجة الكلية
          TOTAL_TIME_TRADITIONAL=0
          TOTAL_TIME_HYBRID=0
          for f in compare_*.txt; do
            TRAD_TIME=$(grep 'traditional_time=' "$f" | cut -d= -f2)
            HYB_TIME=$(grep 'hybrid_time=' "$f" | cut -d= -f2)
            TOTAL_TIME_TRADITIONAL=$((TOTAL_TIME_TRADITIONAL + TRAD_TIME))
            TOTAL_TIME_HYBRID=$((TOTAL_TIME_HYBRID + HYB_TIME))
          done

          # حساب جودة الصورة (PSNR وSSIM)
          echo "=== حساب مقاييس الجودة ==="
          # استخراج إطار من كل فيديو للمقارنة
          "$FFMPEG" -hide_banner -nostdin -y -i "../traditional_output.mkv" -frames:v 1 -vf "select=eq(n\,100)" -vsync vfr "../traditional_frame.png" || true
          "$FFMPEG" -hide_banner -nostdin -y -i "../hybrid_output.mkv" -frames:v 1 -vf "select=eq(n\,100)" -vsync vfr "../hybrid_frame.png" || true

          # حساب PSNR بين الفيديوين (تقريبي)
          PSNR_VALUE=$("$FFMPEG" -hide_banner -nostdin -i "../traditional_output.mkv" -i "../hybrid_output.mkv" \
            -lavfi "[0:v][1:v]psnr" -f null - 2>&1 | grep -oP 'average:\K[0-9.]+' || echo "N/A")

          # حساب SSIM بين الفيديوين (تقريبي)
          SSIM_VALUE=$("$FFMPEG" -hide_banner -nostdin -i "../traditional_output.mkv" -i "../hybrid_output.mkv" \
            -lavfi "[0:v][1:v]ssim" -f null - 2>&1 | grep -oP 'All:\K[0-9.]+' || echo "N/A")

          # حفظ نتائج المقارنة
          {
            echo "=== نتائج المقارنة ==="
            echo "الحجم التقليدي: $((SIZE_TRADITIONAL / 1024 / 1024)) MB"
            echo "الحجم المهجن: $((SIZE_HYBRID / 1024 / 1024)) MB"
            echo "نسبة توفير الحجم: $(awk -v t="$SIZE_TRADITIONAL" -v h="$SIZE_HYBRID" 'BEGIN {printf "%.2f", ((t - h) / t) * 100}')%"
            echo "وقت الترميز التقليدي: ${TOTAL_TIME_TRADITIONAL} ثانية"
            echo "وقت الترميز المهجن: ${TOTAL_TIME_HYBRID} ثانية"
            echo "PSNR: ${PSNR_VALUE}"
            echo "SSIM: ${SSIM_VALUE}"
          } > ../comparison_results.txt

          cat ../comparison_results.txt

      - name: إعداد الاسم النهائي
        id: naming
        env:
          FILENAME: ${{ github.event.inputs.filename }}
        run: |
          set -euo pipefail
          sanitize() {
            printf '%s' "$1" | head -n1 | tr -d '\r' \
              | sed 's#[/\\:*?"<>|]# #g; s/  */ /g; s/^ *//; s/ *$//'
          }
          SAFE_FILENAME=$(sanitize "$FILENAME")
          echo "final_name=${SAFE_FILENAME:-video}" >> "$GITHUB_OUTPUT"

      - name: استخراج معلومات الناتج
        id: videoinfo
        run: |
          set -euo pipefail
          DURATION_SEC=$(ffprobe -v error -show_entries format=duration -of csv=p=0 traditional_output.mkv | cut -d. -f1)
          H=$((DURATION_SEC / 3600)); M=$(((DURATION_SEC % 3600) / 60)); S=$((DURATION_SEC % 60))
          echo "duration_fmt=$(printf '%02d:%02d:%02d' "$H" "$M" "$S")" >> "$GITHUB_OUTPUT"
          ACTUAL_RES=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 traditional_output.mkv)
          echo "actual_res=$ACTUAL_RES" >> "$GITHUB_OUTPUT"
          TRADITIONAL_SIZE_MB=$(awk -v size="$(stat -c%s traditional_output.mkv)" 'BEGIN {printf "%.1f", size / 1048576}')
          HYBRID_SIZE_MB=$(awk -v size="$(stat -c%s hybrid_output.mkv)" 'BEGIN {printf "%.1f", size / 1048576}')
          echo "traditional_size_mb=$TRADITIONAL_SIZE_MB" >> "$GITHUB_OUTPUT"
          echo "hybrid_size_mb=$HYBRID_SIZE_MB" >> "$GITHUB_OUTPUT"

      - name: رفع النواتج إلى قناة تيليجرام
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          FINAL_NAME: ${{ steps.naming.outputs.final_name }}
          DURATION_FMT: ${{ steps.videoinfo.outputs.duration_fmt }}
          ACTUAL_RES: ${{ steps.videoinfo.outputs.actual_res }}
          TRADITIONAL_SIZE_MB: ${{ steps.videoinfo.outputs.traditional_size_mb }}
          HYBRID_SIZE_MB: ${{ steps.videoinfo.outputs.hybrid_size_mb }}
        run: |
          set -euo pipefail

          # قراءة نتائج المقارنة
          COMPARISON_TEXT=$(cat comparison_results.txt)

          # تجهيز الملفات للرفع
          TRADITIONAL_FILE="${FINAL_NAME}_traditional.mkv"
          HYBRID_FILE="${FINAL_NAME}_hybrid.mkv"
          mv traditional_output.mkv "$TRADITIONAL_FILE"
          mv hybrid_output.mkv "$HYBRID_FILE"

          # إعداد التعليق
          CAPTION=$(printf '🎬 %s (مقارنة AV1)\n\n📐 الدقة: %s\n⏱️ المدة: %s\n\n📦 الحجم التقليدي: %s MB\n📦 الحجم المهجن: %s MB\n\n%s' \
            "$FINAL_NAME" "$ACTUAL_RES" "$DURATION_FMT" "$TRADITIONAL_SIZE_MB" "$HYBRID_SIZE_MB" "$COMPARISON_TEXT")

          export TRADITIONAL_FILE HYBRID_FILE CAPTION

          python3 << 'PYEOF'
          import asyncio
          import os
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              client = TelegramClient(
                  StringSession(os.environ["TG_SESSION"]),
                  int(os.environ["TG_API_ID"]),
                  os.environ["TG_API_HASH"],
              )
              await client.start()
              async with client:
                  # إرسال ملف المقارنة النصي
                  with open("comparison_results.txt", "rb") as f:
                      await client.send_file(
                          int(os.environ["TG_CHANNEL_ID"]),
                          f,
                          caption=os.environ["CAPTION"],
                          force_document=True,
                      )
                  
                  # إرسال الفيديو التقليدي
                  await client.send_file(
